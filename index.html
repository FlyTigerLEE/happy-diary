A.POEMS.nalan=[
{t:'木兰花 · 拟古决绝词柬友',body:`人生若只如初见，何事秋风悲画扇。
等闲变却故人心，却道故人心易变。
骊山语罢清宵半，泪雨霖铃终不怨。
何如薄幸锦衣郎，比翼连枝当日愿。`,bg:`康熙年间，纳兰以"拟古决绝词"旧题寄赠一位友人（多以为指顾贞观）。表面写女子被弃，实则叹友情见疑、初心难守。"人生若只如初见"一句，成为三百年来最广为流传的叹息。`},
{t:'长相思 · 山一程',body:`山一程，水一程，身向榆关那畔行，夜深千帐灯。
风一更，雪一更，聒碎乡心梦不成，故园无此声。`,bg:`康熙二十一年（1682），纳兰以一等侍卫身份随康熙帝东巡，出山海关往盛京。关外风雪连宵，千帐灯火之外，是醒着的乡心。全词无一"愁"字，而边地行役之苦尽出。`},
{t:'浣溪沙 · 谁念西风独自凉',body:`谁念西风独自凉，萧萧黄叶闭疏窗，沉思往事立残阳。
被酒莫惊春睡重，赌书消得泼茶香，当时只道是寻常。`,bg:`康熙十六年（1677）五月，纳兰妻卢氏病逝。此后他写下大量悼亡之作。此词追忆当年夫妻赌书泼茶、春日醉酒的小事，末句"当时只道是寻常"，是失去之后才懂的锥心之痛。`},
{t:'浣溪沙 · 残雪凝辉冷画屏',body:`残雪凝辉冷画屏，落梅横笛已三更，更无人处月胧明。
我是人间惆怅客，知君何事泪纵横，断肠声里忆平生。`,bg:`冬夜雪后，残雪映上画屏，远处传来《落梅花》笛声。纳兰以"人间惆怅客"自许，在断肠的笛声里回望平生，是这位贵公子心底最深的自画像。`},
{t:'浣溪沙 · 十里湖光载酒游',body:`十里湖光载酒游，青帘低映白蘋洲，西风听彻采菱讴。
沙岸有时双袖拥，画船何处一竿收，归来无语晚妆楼。`,bg:`纳兰游湖载酒，青帘白蘋、采菱清歌，一派江南风致。然而归来独上妆楼，默默无语——热闹是水上的，寂寥是带回家的。`},
{t:'浣溪沙 · 一半残阳下小楼',body:`一半残阳下小楼，朱帘斜控软金钩，倚阑无绪不能愁。
有个盈盈骑马过，薄妆浅黛亦风流，见人羞涩却回头。`,bg:`此词写黄昏倚楼所见：一位薄妆浅黛的少女骑马而过，见人羞涩却又回头。纳兰以极轻的笔触，留下一个鲜活的回眸瞬间。`},
{t:'浣溪沙 · 身向云山那畔行',body:`身向云山那畔行，北风吹断马嘶声，深秋远塞若为情。
一抹晚烟荒戍垒，半竿斜日旧关城，古今幽恨几时平。`,bg:`康熙二十一年（1682）纳兰随驾出塞，途中作此词。晚烟荒垒、斜日关城，边塞的苍茫里涌起"古今幽恨"——这已超出个人愁绪，是历史的苍凉感。`},
{t:'浣溪沙 · 伏雨朝寒愁不胜',body:`伏雨朝寒愁不胜，那能还傍杏花行？去年高摘斗轻盈。
漫惹炉烟双袖紫，空将酒晕一衫青，人间何处问多情。`,bg:`秋雨朝寒，词人愁绪难胜。去年此时还傍着杏花、攀高摘花比轻盈，如今只剩炉烟双袖、酒晕青衫，无处可问多情。`},
{t:'浣溪沙 · 已惯天涯莫浪愁',body:`已惯天涯莫浪愁，寒云衰草渐成秋，漫因睡起又登楼。
伴我萧萧惟代马，笑人寂寂有牵牛，劳人只合一生休。`,bg:`纳兰久惯天涯行役，劝自己莫要浪愁。寒云衰草渐成秋色，伴他的只有边地代马，笑他孤寂的还有天上的牵牛星。`},
{t:'浣溪沙 · 记绾长条欲别难',body:`记绾长条欲别难，盈盈自此隔银湾，便无风雪也摧残。
青雀几时裁锦字，玉虫连夜翦春幡，不禁辛苦况相关。`,bg:`此词写离别：记得折柳相赠时已觉难别，自此盈盈一水相隔，纵无风雪也足以摧残人心。青雀何时能捎锦书？玉虫（灯花）连夜剪着春幡，辛苦尚且其次，最苦是彼此相念。`},
{t:'浣溪沙 · 雨歇梧桐泪乍收',body:`雨歇梧桐泪乍收，遣怀翻自忆从头，摘花销恨旧风流。
帘影碧桃人已去，屧痕苍藓径空留，两眉何处月如钩。`,bg:`秋雨初歇，梧桐上的水珠如泪方收。词人遣怀反惹追忆：当年摘花销恨的旧风流，如今帘影里的人已去，苍藓上只空留鞋痕。`},
{t:'浣溪沙 · 泪浥红笺第几行',body:`泪浥红笺第几行，唤人娇鸟怕开窗，那能闲过好时光。
屏障厌看金碧画，罗衣不奈水沉香，遍翻眉谱只寻常。`,bg:`写闺中人写信寄远：泪湿了红笺第几行，怕听窗外娇鸟唤起春光。金碧屏风看厌了，水沉香也熏不住罗衣，遍翻眉谱却觉一切寻常。`},
{t:'浣溪沙 · 谁道飘零不可怜',body:`谁道飘零不可怜，旧游时节好花天，断肠人去自经年。
一片晕红才著雨，几丝柔柳乍和烟，倩魂销尽夕阳前。`,bg:`旧游时节、好花天气，而断肠人已离去经年。雨后一片晕红、烟中几丝柔柳，那销魂的倩影仿佛就在夕阳之前。`},
{t:'浣溪沙 · 欲寄愁心朔雁边',body:`欲寄愁心朔雁边，西风浊酒惨离颜，黄花时节碧云天。
古戍烽烟迷斥堠，夕阳村落解鞍鞯，不知征战几人还。`,bg:`纳兰随驾出塞途中作。想把愁心托给北飞的大雁，可眼前是西风浊酒、黄花碧云；古戍烽烟里，他忍不住问：征战几人能还？`},
{t:'浣溪沙 · 消息谁传到拒霜',body:`消息谁传到拒霜？两行斜雁碧天长，晚秋风景倍凄凉。
银蒜押帘人寂寂，玉钗敲竹信茫茫，黄花开也近重阳。`,bg:`秋日怀人。拒霜（木芙蓉）花开时，是谁把消息传到？两行斜雁划过碧天，晚秋风景倍觉凄凉；玉钗敲竹，音信茫茫，黄花已开，重阳将近。`},
{t:'浣溪沙 · 莲漏三声烛半条',body:`莲漏三声烛半条，杏花微雨湿轻绡，那将红豆记无聊。
春色已看浓似酒，归期安得信如潮，离魂入夜倩谁招。`,bg:`春夜听更漏、看残烛，杏花微雨打湿轻绡。春色浓得像酒，而归期却不像潮水那般守信；入夜离魂飘散，又有谁能招回？`},
{t:'浣溪沙 · 微晕娇花湿欲流',body:`微晕娇花湿欲流，簟纹灯影一生愁，梦回疑在远山楼。
残月暗窥金屈戍，软风徐荡玉帘钩，待听邻女唤梳头。`,bg:`写闺中春晓：娇花带露、簟纹灯影，梦里疑似还在远山楼上。残月暗窥门环，软风徐荡帘钩，只待邻家女伴来唤梳头。`},
{t:'浣溪沙 · 十二红帘窣地深',body:`十二红帘窣地深，才移刬袜又沉吟，晚晴天气惜轻阴。
珠衱佩囊三合字，宝钗拢髻两分心，定缘何事湿兰襟。`,bg:`此词写一位女子的情态：红帘垂地，她刚挪步又沉吟；珠佩宝钗皆成双，却不知为了何事湿透了衣襟。`},
{t:'画堂春 · 一生一代一双人',body:`一生一代一双人，争教两处销魂。相思相望不相亲，天为谁春？
浆向蓝桥易乞，药成碧海难奔。若容相访饮牛津，相对忘贫。`,bg:`相传纳兰早年与一位女子情缘受阻，被迫分离。词中连用裴航蓝桥遇仙、嫦娥奔月、牛郎织女三典，写尽相爱而不能相亲的绝望，末句"相对忘贫"是最卑微也最炽热的愿。`},
{t:'蝶恋花 · 辛苦最怜天上月',body:`辛苦最怜天上月，一昔如环，昔昔都成玦。若似月轮终皎洁，不辞冰雪为卿热。
无那尘缘容易绝，燕子依然，软踏帘钩说。唱罢秋坟愁未歇，春丛认取双栖蝶。`,bg:`卢氏去世后，纳兰夜夜望月。月只一夕圆满，夜夜都如缺玦，正如人间聚少离多。他愿化作冰雪去温暖亡妻，又盼来世化作蝴蝶双双栖于花丛——痴语之中，是一片至情。`},
{t:'蝶恋花 · 出塞',body:`今古河山无定据。画角声中，牧马频来去。满目荒凉谁可语？西风吹老丹枫树。
从前幽怨应无数。铁马金戈，青冢黄昏路。一往情深深几许？深山夕照深秋雨。`,bg:`康熙二十一年（1682）纳兰随康熙帝出塞，途经内蒙古一带。古来征战之地，如今只剩牧马往来、丹枫吹老。他问"一往情深深几许"，答案在深山夕照与深秋冷雨之中。`},
{t:'蝶恋花 · 眼底风光留不住',body:`眼底风光留不住，和暖和香，又上雕鞍去。欲倩烟丝遮别路，垂杨那是相思树。
惆怅玉颜成间阻，何事东风，不作繁华主。断带依然留旧句，斑骓一系无寻处。`,bg:`此词写马上送别：眼底风光留不住，那人又上了雕鞍。想请烟柳遮住别路，可垂杨哪里是相思树？断带上还留着旧日诗句，系马一去便无处可寻。`},
{t:'蝶恋花 · 又到绿杨曾折处',body:`又到绿杨曾折处，不语垂鞭，踏遍清秋路。衰草连天无意绪，雁声远向萧关去。
不恨天涯行役苦，只恨西风，吹梦成今古。明日客程还几许，沾衣况是新寒雨。`,bg:`纳兰重经旧日折柳送别之地，不语垂鞭、踏遍清秋。他说不恨行役之苦，只恨西风把梦吹成了今古之隔；明日还有多少路程？何况新寒冷雨沾衣。`},
{t:'蝶恋花 · 萧瑟兰成看老去',body:`萧瑟兰成看老去，为怕多情，不作怜花句。阁泪倚花愁不语，暗香飘尽知何处。
重到旧时明月路，袖口香寒，心比秋莲苦。休说生生花里住，惜花人去花无主。`,bg:`纳兰以庾信（小字兰成）自比，说怕多情便不敢写怜花的句子。重到旧时明月路上的时候，袖口香寒，心比秋莲还苦；惜花的人去了，花也就没了主人。`},
{t:'蝶恋花 · 准拟春来消寂寞',body:`准拟春来消寂寞，愁雨愁风，翻把春担搁。不为伤春情绪恶，为怜镜里颜非昨。
毕竟春光谁领略？九陌缁尘，抵死遮云壑。若得寻春终遂约，不成长负东君诺。`,bg:`本打算借春光消解寂寞，谁知风雨把春天耽误了。不是伤春，是怜惜镜中容颜已非昨日；若寻春之约终能遂愿，便不算辜负了东君。`},
{t:'蝶恋花 · 露下庭柯蝉响歇',body:`露下庭柯蝉响歇，纱碧如烟，烟里玲珑月。枕上芙蓉香未歇，此时情事谁边说？
忆共当时犹未别，梦里相逢，还共当时月。无那音书容易绝，纵然一晌相看也。`,bg:`秋夜庭院，露下蝉歇、纱碧如烟，月色玲珑。枕上芙蓉香还未散，此时情事能向谁说？梦里重逢还共当时那轮月，可叹音书太容易断绝。`},
{t:'蝶恋花 · 散花楼送客',body:`城上清笳城下杵。秋尽离人，此际心偏苦。刀尺又催天又暮，一声吹冷蒹葭浦。
把酒留君君不住。莫被寒云，遮断君行处。行宿黄茅山店路，夕阳村社迎神鼓。`,bg:`康熙年间纳兰在散花楼送别友人（一说为张见阳）。秋尽离人，城上清笳、城下砧杵，刀尺催寒又天暮；末句以夕阳村社的迎神鼓声作结，别情中透出一丝温暖。`},
{t:'采桑子 · 谁翻乐府凄凉曲',body:`谁翻乐府凄凉曲？风也萧萧，雨也萧萧，瘦尽灯花又一宵。
不知何事萦怀抱，醒也无聊，醉也无聊，梦也何曾到谢桥。`,bg:`秋夜听人翻唱乐府旧曲，风雨潇潇，灯花燃尽又是一夜。纳兰说不清心中所萦何事，只知醒也无聊、醉也无聊，连梦中都到不了思念之地。`},
{t:'采桑子 · 明月多情应笑我',body:`明月多情应笑我，笑我如今。辜负春心，独自闲行独自吟。
近来怕说当时事，结遍兰襟。月浅灯深，梦里云归何处寻。`,bg:`卢氏去世数年后，纳兰重踏旧地。明月多情，反笑他今日形单影只；当年结下的种种情谊，如今都成不敢提起的往事。`},
{t:'采桑子 · 塞上咏雪花',body:`非关癖爱轻模样，冷处偏佳。别有根芽，不是人间富贵花。
谢娘别后谁能惜，飘泊天涯。寒月悲笳，万里西风瀚海沙。`,bg:`康熙十七年（1678）纳兰随驾出塞见雪。他借雪花自喻：并非偏爱它轻薄的模样，而是它在冷处更见佳致，别有根芽，本不是人间的富贵花。这是纳兰最著名的自况之作。`},
{t:'采桑子 · 彤云久绝飞琼字',body:`彤云久绝飞琼字，人在谁边？人在谁边，今夜玉清眠不眠。
香销被冷残灯灭，静数秋天。静数秋天，又误心期到下弦。`,bg:`久无音信，词人痴问：人在谁边？今夜她睡了吗？香销被冷、残灯已灭，他静静地数着秋夜，又误了心期到下弦月。`},
{t:'采桑子 · 冷香萦遍红桥梦',body:`冷香萦遍红桥梦，梦觉城笳。月上桃花，雨歇春寒燕子家。
箜篌别后谁能鼓，断肠天涯。暗损韶华，一缕茶烟透碧纱。`,bg:`红桥梦醒，城头吹笳；月上桃花、雨歇春寒，燕子归家。别后谁还能弹那曲箜篌？天涯断肠，韶华暗损，只剩一缕茶烟透出碧纱。`},
{t:'采桑子 · 桃花羞作无情死',body:`桃花羞作无情死，感激东风。吹落娇红，飞入窗间伴懊侬。
谁怜辛苦东阳瘦，也为春慵。不及芙蓉，一片幽情冷处浓。`,bg:`纳兰以桃花自喻：桃花羞于无情地凋落，感激东风把它吹进窗间，陪伴愁人。他自比沈约（东阳）消瘦，说这份幽情不及芙蓉，却在冷处更浓。`},
{t:'采桑子 · 海天谁放冰轮满',body:`海天谁放冰轮满，惆怅离情。莫说离情，但值凉宵总泪零。
只应碧落重相见，那是今生。可奈今生，刚作愁时又忆卿。`,bg:`悼亡之作。是谁把海上明月放得这般圆满，偏照离人？他说只应到天上重见，那便是来生；可奈今生，刚要发愁时又想起了你。`},
{t:'采桑子 · 而今才道当时错',body:`而今才道当时错，心绪凄迷。红泪偷垂，满眼春风百事非。
情知此后来无计，强说欢期。一别如斯，落尽梨花月又西。`,bg:`相传此词与纳兰早年一段受阻的情缘有关。如今才说"当时错了"，心绪凄迷、红泪偷垂，满眼春风而百事皆非；明知此后无计可施，还强说着欢会的日期。`},
{t:'采桑子 · 拨灯书尽红笺也',body:`拨灯书尽红笺也，依旧无聊。玉漏迢迢，梦里寒花隔玉箫。
几竿修竹三更雨，叶叶萧萧。分付秋潮，莫误双鱼到谢桥。`,bg:`拨亮灯烛写尽了红笺，依旧无聊；更漏迢迢，梦里寒花隔着玉箫。三更雨打修竹，叶叶萧萧，他吩咐秋潮：莫要误了双鱼（书信）到谢桥。`},
{t:'临江仙 · 寒柳',body:`飞絮飞花何处是？层冰积雪摧残。疏疏一树五更寒。爱他明月好，憔悴也相关。
最是繁丝摇落后，转教人忆春山。湔裙梦断续应难。西风多少恨，吹不散眉弯。`,bg:`纳兰以寒柳自喻兼悼亡。柳絮飘尽、层冰积雪之后，只剩一树疏枝独对五更寒。末句"西风多少恨，吹不散眉弯"，把无形之愁写得如在目前。`},
{t:'临江仙 · 点滴芭蕉心欲碎',body:`点滴芭蕉心欲碎，声声催忆当初。欲眠还展旧时书。鸳鸯小字，犹记手生疏。
倦眼乍低缃帙乱，重看一半模糊。幽窗冷雨一灯孤。料应情尽，还道有情无？`,bg:`悼亡之作。雨打芭蕉点点滴滴，声声催他回忆当初；欲眠又展开旧时书信，那写鸳鸯小字的手还显得生疏。重看时一半已经模糊，幽窗冷雨、一灯孤明。`},
{t:'临江仙 · 昨夜个人曾有约',body:`昨夜个人曾有约，严城玉漏三更。一钩新月几疏星。夜阑犹未寝，人静鼠窥灯。
原是瞿唐风间阻，错教人恨无情。小阑干外寂无声。几回肠断处，风动护花铃。`,bg:`此词写等人不至：昨夜约好相见，等到三更漏尽，一钩新月、几颗疏星。原是瞿塘风浪阻隔，并非那人无情；几回肠断处，只有栏杆外的护花铃在风中轻响。`},
{t:'临江仙 · 丝雨如尘云著水',body:`丝雨如尘云著水，嫣香碎拾吴宫。百花冷暖避东风。酷怜娇易散，燕子学偎红。
人说病宜随月减，恹恹却与春同。可能留蝶抱花丛。不成双梦影，翻笑杏梁空。`,bg:`春雨如尘、云贴水面，拾起吴宫的落花碎瓣。百花因冷暖而避东风，他怜惜娇花易散，笑燕子学人偎红；末句说做不成双梦，反被杏梁的空寂取笑。`},
{t:'临江仙 · 长记碧纱窗外语',body:`长记碧纱窗外语，秋风吹送归鸦。片帆从此寄天涯。一灯新睡觉，思梦月初斜。
便是欲归归未得，不如燕子还家。春云春水带轻霞。画船人似月，细雨落杨花。`,bg:`羁旅思归之作。记得碧纱窗外说过的话，秋风吹送归鸦，从此片帆寄身天涯。想归归不得，倒不如燕子还能还家；梦里画船人似明月，细雨中落满杨花。`},
{t:'虞美人 · 曲阑深处重相见',body:`曲阑深处重相见，匀泪偎人颤。可怜心事太分明，翻作断肠声里忆平生。
半生已分孤眠过，山枕檀痕涴。忆来何事最销魂，第一折枝花样画罗裙。`,bg:`词写梦中与亡妻在曲阑深处重逢。妻子偎人而颤、泪痕犹在，醒后只余半生孤眠。最销魂的记忆，是她当年那条画着折枝花样的罗裙——细节越小，越见情深。`},
{t:'虞美人 · 银床淅沥青梧老',body:`银床淅沥青梧老，屧粉秋蛩扫。采香行处蹙连钱，拾得翠翘何恨不能言。
回廊一寸相思地，落月成孤倚。背灯和月就花阴，已是十年踪迹十年心。`,bg:`秋日重经旧地，井栏边梧桐已老，蟋蟀在阶下低唱。他在回廊拾得一支翠翘（女子首饰），却无人可诉。结句"十年踪迹十年心"，是纳兰对漫长追忆最沉痛的总结。`},
{t:'虞美人 · 春情只到梨花薄',body:`春情只到梨花薄，片片催零落。夕阳何事近黄昏，不道人间犹有未招魂。
银笺别梦当时句，密绾同心苣。为伊判作梦中人，长向画图清夜唤真真。`,bg:`悼亡之作。春光只到梨花便薄情而去，片片催它零落；夕阳为何偏近黄昏，难道不知人间还有未招的魂？他为伊判作梦中人，夜夜对着画像呼唤"真真"。`},
{t:'虞美人 · 秋夕信步',body:`愁痕满地无人省，露湿琅玕影。闲阶小立倍荒凉，还剩旧时月色在潇湘。
薄情转是多情累，曲曲柔肠碎。红笺向壁字模糊，忆共灯前呵手为伊书。`,bg:`秋夜独步。满地愁痕无人省得，露水打湿竹影；旧时月色还留在潇湘之上。他说多情反被多情累，最忆的是当年灯前呵手为她写字的情景。`},
{t:'虞美人 · 彩云易向秋空散',body:`彩云易向秋空散，燕子怜长叹。几番离合总无因，赢得一回僝僽一回亲。
归鸿旧约霜前至，可寄香笺字。不如前事不思量，且枕红蕤欹侧看斜阳。`,bg:`写聚散无常：彩云易散，燕子也为他长叹。几番离合总无因由，赢来一回烦恼一回亲。不如不思量前事，且枕着红蕤枕侧看斜阳。`},
{t:'虞美人 · 凭君料理花间课',body:`凭君料理花间课，莫负当初我。
眼看鸡犬上天梯，黄九自招秦七共泥犁。
瘦狂那似痴肥好，判任痴肥笑。
笑他多病与长贫，不及诸公衮衮向风尘。`,bg:`此词为纳兰题《饮水词》集后、寄赠顾贞观之作。他以黄庭坚（黄九）、秦观（秦七）自比，宁可"共泥犁"（同下地狱）也不效世俗的"痴肥"，末句笑自己多病长贫，比不上诸公衮衮红尘——是他最见风骨的作品之一。`},
{t:'南乡子 · 为亡妇题照',body:`泪咽却无声，只向从前悔薄情。凭仗丹青重省识，盈盈，一片伤心画不成。
别语忒分明，午夜鹣鹣梦早醒。卿自早醒侬自梦，更更，泣尽风檐夜雨铃。`,bg:`康熙十六年（1677）卢氏去世后，纳兰为妻子遗照题词。"一片伤心画不成"化用高蟾诗意，说丹青能画容颜，却画不出伤心；末句午夜听雨，一夜数更，字字是泪。`},
{t:'南乡子 · 捣衣',body:`鸳瓦已新霜，欲寄寒衣转自伤。见说征夫容易瘦，端相，梦里回时仔细量。
支枕怯空房，且拭清砧就月光。已是深秋兼独夜，凄凉，月到西南更断肠。`,bg:`写思妇为征夫捣制寒衣。鸳鸯瓦上已落新霜，想寄寒衣反而自伤；听说征夫容易消瘦，梦里回来时要仔细端量。深秋独夜，月到西南更断肠。`},
{t:'南乡子 · 柳絮晚悠飏',body:`柳絮晚悠飏，斜日波纹映画梁。刺绣女儿楼上立，柔肠，爱看晴丝百尺长。
风定却闻香，吹落残红在绣床。莫怪东风无赖甚，春光，一半儿因他半自忙。`,bg:`春日即景小词。柳絮傍晚悠扬，斜阳波影映在画梁上；刺绣的女子立在楼头，爱看晴丝百尺。风定后忽闻残花香，她嗔怪东风无赖——春光一半因它忙，一半自己忙。`},
{t:'南歌子 · 翠袖凝寒薄',body:`翠袖凝寒薄，帘衣入夜空。病容扶起月明中，惹得一丝残篆旧薰笼。
暗觉欢期过，遥知别恨同。疏花已是不禁风，那更夜深清露湿愁红。`,bg:`写一位病中女子的孤寂：翠袖凝寒、帘衣入夜空寂，病容在月明中扶起，惹得薰笼里一缕残香。欢期已过，别恨相同；疏花本已禁不住风，何况夜深清露又打湿了愁红。`},
{t:'金缕曲 · 赠梁汾',body:`德也狂生耳。偶然间、缁尘京国，乌衣门第。有酒惟浇赵州土，谁会成生此意？不信道、遂成知己。青眼高歌俱未老，向尊前、拭尽英雄泪。君不见，月如水。
共君此夜须沉醉。且由他、蛾眉谣诼，古今同忌。身世悠悠何足问，冷笑置之而已。寻思起、从头翻悔。一日心期千劫在，后身缘、恐结他生里。然诺重，君须记。`,bg:`康熙十五年（1676），二十二岁的纳兰初识比他年长十八岁、潦倒京华的顾贞观（号梁汾），倾盖如故。词中自称"德也狂生"，蔑视门第，许下"一日心期千劫在"的誓言，是清代交谊词第一名篇。`},
{t:'金缕曲 · 亡妇忌日有感',body:`此恨何时已。滴空阶、寒更雨歇，葬花天气。三载悠悠魂梦杳，是梦久应醒矣。料也觉、人间无味。不及夜台尘土隔，冷清清、一片埋愁地。钗钿约，竟抛弃。
重泉若有双鱼寄。好知他、年来苦乐，与谁相倚。我自中宵成转侧，忍听湘弦重理。待结个、他生知己。还怕两人俱薄命，再缘悭、剩月零风里。清泪尽，纸灰起。`,bg:`康熙十九年（1680）卢氏去世三周年忌日，纳兰作此词。他从"此恨何时已"一路写到"清泪尽，纸灰起"，把绝望写得层层转深，是悼亡词中最沉痛的一首。`},
{t:'金缕曲 · 慰西溟',body:`何事添凄咽？但由他、天公簸弄，莫教磨涅。失意每多如意少，终古几人称屈。须知道、福因才折。独卧藜床看北斗，背高城、玉笛吹成血。听谯鼓，二更彻。
丈夫未肯因人热，且乘闲、五湖料理，扁舟一叶。泪似秋霖挥不尽，洒向野田黄蝶。须不羡、承明箸作。急雪乍翻香阁絮，看疏林、一夜梅花发。休重说，但高歌。`,bg:`姜宸英（号西溟）屡试不第，纳兰以此词相慰。他劝友人莫因失意而自弃，说"福因才折"，末句劝他且去五湖扁舟、高歌一醉，是挚友之间最恳切的劝慰。`},
{t:'菩萨蛮 · 朔风吹散三更雪',body:`朔风吹散三更雪，倩魂犹恋桃花月。梦好莫催醒，由他好处行。
无端听画角，枕畔红冰薄。塞马一声嘶，残星拂大旗。`,bg:`康熙二十一年（1682）纳兰随驾出塞。塞外三更风雪，梦中却回到故园桃李花下。画角惊梦，泪落枕畔成冰，残星之下战马嘶鸣——温柔与荒寒，在一首小令里对撞。`},
{t:'菩萨蛮 · 春云吹散湘帘雨',body:`春云吹散湘帘雨，絮黏蝴蝶飞还住。人在玉楼中，楼高四面风。
柳烟丝一把，暝色笼鸳瓦。休近小阑干，夕阳无限山。`,bg:`春云散后，雨歇帘卷，柳絮黏着蝴蝶欲飞还停。玉楼高处四面来风，暮色笼罩鸳鸯瓦。末句劝人莫近阑干，因为栏外是夕阳与无尽关山——望之只会更远。`},
{t:'菩萨蛮 · 晶帘一片伤心白',body:`晶帘一片伤心白，云鬟香雾成遥隔。无语问添衣，桐阴月已西。
西风鸣络纬，不许愁人睡。只是去年秋，如何泪欲流。`,bg:`悼亡之作。水晶帘一片伤心白，云鬟香雾已成遥隔。无人再问他添衣，梧桐影里月已西斜；西风里络纬鸣叫，不许愁人入睡。还是去年的秋天，为什么泪就要流下来？`},
{t:'菩萨蛮 · 新寒中酒敲窗雨',body:`新寒中酒敲窗雨，残香细袅秋情绪。才道莫伤神，青衫有泪痕。
相思不似醉，闷拥重衾睡。又听鹧鸪声，隔帘月胧明。`,bg:`秋寒病酒、雨敲窗棂，残香细袅牵起秋的情绪。才说莫要伤神，青衫上已有泪痕；相思不像醉酒可以昏睡，闷拥重被又听见鹧鸪声。`},
{t:'菩萨蛮 · 隔花才歇廉纤雨',body:`隔花才歇廉纤雨，一声弹指浑无语。梁燕自双归，长条脉脉垂。
小屏山色远，妆薄铅华浅。独自立瑶阶，透寒金缕鞋。`,bg:`细雨刚停，她隔着花枝一声弹指、默然无语。梁上的燕子尚且双双归来，柳条脉脉低垂；她独自立在玉阶上，寒气透过金缕鞋。`},
{t:'菩萨蛮 · 萧萧几叶风兼雨',body:`萧萧几叶风兼雨，离人偏识长更苦。欹枕数秋天，蟾蜍下早弦。
夜寒惊被薄，泪与灯花落。无处不伤心，轻尘在玉琴。`,bg:`风雨萧萧，离人最识长夜之苦。斜倚枕上数着秋天，月亮已下早弦；夜寒惊觉被薄，泪与灯花一同落下。无处不伤心，连玉琴上都落了轻尘。`},
{t:'菩萨蛮 · 黄云紫塞三千里',body:`黄云紫塞三千里，女墙西畔啼乌起。落日万山寒，萧萧猎马还。
笳声听不得，入夜空城黑。秋梦不归家，残灯落碎花。`,bg:`康熙二十一年（1682）纳兰随驾出塞。黄云紫塞三千里，女墙西畔乌鸦啼起；落日万山寒，猎马萧萧而还。笳声不忍听，入夜空城漆黑，秋梦都回不了家。`},
{t:'如梦令 · 正是辘轳金井',body:`正是辘轳金井，满砌落花红冷。蓦地一相逢，心事眼波难定。谁省，谁省，从此簟纹灯影。`,bg:`纳兰早期小令。金井辘轳、满阶落红的庭院里，一次猝不及防的相逢，眼波流转心事难定。此后无数个夜晚，那人只剩竹席的纹与灯下的影。`},
{t:'如梦令 · 纤月黄昏庭院',body:`纤月黄昏庭院，语密翻教醉浅。
知否那人心？旧恨新欢相半。
谁见？谁见？珊枕泪痕红泫。`,bg:`黄昏庭院里一弯纤月，越说得亲密反而越醉得浅——因为怕醉了失言。她问：你可知那人的心？旧恨新欢各占一半。有谁看见？珊瑚枕上泪痕犹红。`},
{t:'如梦令 · 木叶纷纷归路',body:`木叶纷纷归路，残月晓风何处。消息竟沉沉，今夜相思几许。秋雨，秋雨，一半因风吹去。`,bg:`纳兰行役途中思家。落叶铺满归路，残月晓风中人在何处？消息沉沉，今夜相思几许；秋雨一半被风吹去，一半落在心上。`},
{t:'如梦令 · 万帐穹庐人醉',body:`万帐穹庐人醉，星影摇摇欲坠。归梦隔狼河，又被河声搅碎。还睡，还睡，解道醒来无味。`,bg:`康熙二十一年（1682）纳兰随驾出塞，宿于万帐穹庐之中。星影摇摇欲坠，归梦却被狼河（大凌河）的水声搅碎；只好再睡，因为醒来更无味。`},
{t:'减字木兰花 · 新月',body:`晚妆欲罢，更把纤眉临镜画。准待分明，和雨和烟两不胜。
莫教星替，守取团圆终必遂。此夜红楼，天上人间一样愁。`,bg:`写一位女子对镜描眉、凝望新月的情态。纳兰怜惜新月微茫，怕它被星光取代，祈愿团圆——天上那一弯未圆之月，与人间未圆之心，是一样愁。`},
{t:'减字木兰花 · 相逢不语',body:`相逢不语，一朵芙蓉著秋雨。小晕红潮，斜溜鬟心只凤翘。
待将低唤，直为凝情恐人见。欲诉幽怀，转过回阑叩玉钗。`,bg:`相传此词写纳兰与表妹（一说恋人）被迫分离后的一次相见：相逢却不能说话，她像一朵带雨的芙蓉，脸上泛起红潮。他想低声呼唤，又怕被人看见；千言万语，只化作转过回廊叩响玉钗。`},
{t:'减字木兰花 · 烛花摇影',body:`烛花摇影，冷透疏衾刚欲醒。待不思量，不许孤眠不断肠。
茫茫碧落，天上人间情一诺。银汉难通，稳耐风波愿始从。`,bg:`烛影摇红、孤衾冷透，刚要睡去又醒。不许孤眠不断肠，可天上人间情只一诺；银汉难通，只愿稳耐风波，等到来日相从。`},
{t:'山花子 · 风絮飘残已化萍',body:`风絮飘残已化萍，泥莲刚倩藕丝萦。珍重别拈香一瓣，记前生。
人到情多情转薄，而今真个不多情。又到断肠回首处，泪偷零。`,bg:`悼亡妻之作。柳絮化萍、莲断丝连，都是旧时情意的比喻。他说"情多情转薄"，其实是不敢再多情——越怕断肠，越易断肠。`},
{t:'山花子 · 林下荒苔道韫家',body:`林下荒苔道韫家，生怜玉骨委尘沙。愁向风前无处说，数归鸦。
半世浮萍随逝水，一宵冷雨葬名花。魂是柳绵吹欲碎，绕天涯。`,bg:`纳兰以谢道韫比亡妻，痛惜玉骨委于尘沙。半世浮萍随水而逝，一宵冷雨葬了名花；魂魄像柳绵一样吹得欲碎，仍绕着天涯不肯散去。`},
{t:'于中好 · 十月初四夜风雨',body:`尘满疏帘素带飘，真成暗度可怜宵。几回偷拭青衫泪，忽傍犀奁见翠翘。
惟有恨，转无聊。五更依旧落花朝。衰杨叶尽丝难尽，冷雨凄风打画桥。`,bg:`十月初四风雨之夜，纳兰独坐房中，偶然在妆奁旁看见亡妻留下的翠翘。杨叶落尽而柳丝难尽，正如岁月流逝而思念不断，冷雨凄风打在画桥之上。`},
{t:'于中好 · 送梁汾南还',body:`握手西风泪不干，年来多在别离间。遥知独听灯前雨，转忆同看雪后山。
凭寄语，劝加餐。桂花时节约重还。分明小像沉香缕，一片伤心欲画难。`,bg:`康熙二十年（1681）顾贞观南归，纳兰作此送别。握手西风、泪流不干，此后独听灯前雨，便会想起同看雪后山。末句化用"一片伤心画不成"，写尽知己离别之痛。`},
{t:'于中好 · 独背残阳上小楼',body:`独背残阳上小楼，谁家玉笛韵偏幽。一行白雁遥天暮，几点黄花满地秋。
惊节序，叹沉浮，秾华如梦水东流。人间所事堪惆怅，莫向横塘问旧游。`,bg:`秋日登楼。背对残阳独上小楼，谁家玉笛声偏幽怨；一行白雁没入暮天，几点黄花开满秋地。他惊心于节序更替、身世沉浮，说人间万事都堪惆怅。`},
{t:'生查子 · 短焰剔残花',body:`短焰剔残花，夜久边声寂。倦舞却闻鸡，暗觉青绫湿。
残月出门时，美人和泪别。欲寄北风吟，为问南飞雁。`,bg:`秋夜羁旅，孤灯将尽，四野无声。舞倦闻鸡，青绫被上泪痕暗湿。想起出门时的残月与美人的泪眼，想把心思托付北风与南飞之雁。`},
{t:'生查子 · 惆怅彩云飞',body:`惆怅彩云飞，碧落知何许？不见合欢花，空倚相思树。
总是别时情，那待分明语。判得最长宵，数尽厌厌雨。`,bg:`彩云飞去、碧落茫茫，不见合欢花，空倚相思树。别时之情不必说破，他索性认了这最长的夜，去数那绵绵的雨。`},
{t:'生查子 · 东风不解愁',body:`东风不解愁，偷展湘裙衩。独夜背纱笼，影著纤腰画。
爇尽水沉烟，露滴鸳鸯瓦。花骨冷宜香，小立樱桃下。`,bg:`东风不解愁，偷偷掀起她的裙衩。夜里背灯独立，影子画出纤腰；沉香燃尽，露滴鸳鸯瓦。她像一束冷香的花骨，小立在樱桃树下。`},
{t:'浪淘沙 · 夜雨做成秋',body:`夜雨做成秋，恰上心头。教他珍重护风流。端的为谁添病也，更为谁羞？
密意未曾休，密愿难酬。珠帘四卷月当楼。暗忆欢期真似梦，梦也须留。`,bg:`一夜秋雨，秋意上了心头。纳兰惦念远方之人，问她为谁添病、为谁含羞。卷帘见月，欢期如梦——连梦也要留着，不肯醒来。`},
{t:'浪淘沙 · 红影湿幽窗',body:`红影湿幽窗，瘦尽春光。雨余花外却斜阳。谁见薄衫低髻子，抱膝思量。
莫道不凄凉，早近持觞。暗思何事断人肠？曾是向他春梦里，瞥遇回廊。`,bg:`春雨后红花映湿幽窗，春光就此瘦尽。谁见那薄衫低髻的女子抱膝思量？最断肠的是曾在春天的梦里，于回廊上瞥见过他。`},
{t:'浪淘沙 · 紫玉拨寒灰',body:`紫玉拨寒灰，心字全非。疏钟已应晚来风。人在青山相识处，绿满长堤。
后会已难期，珍重香衣。落梅时节雨霏微。画舫鸳鸯双桨急，不管人归。`,bg:`用紫玉拨弄寒灰，心字香已烧得面目全非。晚风送来疏钟，人在青山相识之处、绿满长堤。后会难期，落梅细雨里画舫鸳鸯双桨急去，不管人归。`},
{t:'清平乐 · 凄凄切切',body:`凄凄切切，惨淡黄花节。梦里砧声浑未歇，那更乱蛩悲咽。
尘生燕子空楼，抛残弦索床头。一样晓风残月，而今触绪添愁。`,bg:`重阳前后，黄花惨淡。梦里捣衣声未歇，更有蟋蟀悲鸣。燕子楼空、弦索弃置，同样是晓风残月，如今每一处景物都牵动愁绪。`},
{t:'清平乐 · 风鬟雨鬓',body:`风鬟雨鬓，偏是来无准。倦倚玉阑看月晕，容易语低香近。
软风吹过窗纱，心期便隔天涯。从此伤春伤别，黄昏只对梨花。`,bg:`写一次短暂而仓促的相会：她风鬟雨鬓地来了，靠在玉阑上看月晕，话语轻柔、香气亲近。软风吹过窗纱，心期便隔了天涯；从此黄昏里，只对着一树梨花。`},
{t:'清平乐 · 弹琴峡题壁',body:`泠泠彻夜，谁是知音者？如梦前朝何处也，一曲边愁难写。
极天关塞云中，人随落雁西风。唤取红巾翠袖，莫教泪洒英雄。`,bg:`康熙二十一年（1682）纳兰随驾出塞，途经弹琴峡（今北京延庆）题壁。水声泠泠彻夜，谁是知音？极天关塞、落雁西风，末句以辛弃疾词意自解，豪气中藏着孤独。`},
{t:'清平乐 · 烟轻雨小',body:`烟轻雨小，望里青难了。
一缕断虹垂树杪，又是乱山残照。
凭高目断征途，暮云千里平芜。
日夜河流东下，锦书应托双鱼。`,bg:`此词写登临望远。烟雨微蒙里远山青色望不到头，一缕断虹垂在树梢，又是乱山残照。他凭高望断征途，暮云千里平芜；日夜东流的河水，该替他把锦书托给双鱼。`},
{t:'忆王孙 · 西风一夜剪芭蕉',body:`西风一夜剪芭蕉，倦眼经秋耐寂寥。强把心情付浊醪。读离骚，愁似湘江日夜潮。`,bg:`秋夜不寐。西风一夜把芭蕉剪得零落，倦眼经秋耐住寂寥，强把心情托付给浊酒。读《离骚》遣怀，愁却像湘江的潮水日夜不退。`},
{t:'梦江南 · 昏鸦尽',body:`昏鸦尽，小立恨因谁？急雪乍翻香阁絮，轻风吹到胆瓶梅，心字已成灰。`,bg:`《梦江南》组词之一。黄昏鸦尽，她小立庭院，心字香已烧成灰烬。急雪翻飞如柳絮，轻风吹到胆瓶里的梅花——她恨的是谁，只有她自己知道。`},
{t:'忆江南 · 宿双林禅院有感',body:`心灰尽，有发未全僧。风雨消磨生死别，似曾相识只孤檠，情在不能醒。
摇落后，清吹那堪听。淅沥暗飘金井叶，乍闻风定又钟声，薄福荐倾城。`,bg:`康熙十六年（1677）冬，纳兰宿于双林禅院，为亡妻做法事时所作。"心灰尽，有发未全僧"是他对自己的判词：身在尘世，心已出家。`},
{t:'望江南 · 咏弦月',body:`初八月，半镜上青霄。斜倚画阑娇不睡，暗移梅影过红桥，裙带北风飘。`,bg:`咏初八的弦月如半面镜子挂上青霄。一位娇憨的女子斜倚画栏不肯睡去，看梅影悄悄移过红桥，裙带在北风里飘动。`},
{t:'点绛唇 · 咏风兰',body:`别样幽芬，更无浓艳催开处。凌波欲去，且为东风住。
忒煞萧疏，怎耐秋如许？还留取，冷香半缕，第一湘江雨。`,bg:`纳兰咏风兰（石斛兰）。它别样幽芬，不靠浓艳催开；本想凌波而去，又为东风暂住。秋意太萧疏，还留取半缕冷香，那是湘江上第一等的雨。`},
{t:'点绛唇 · 黄花城早望',body:`五夜光寒，照来积雪平于栈。西风何限，自起披衣看。
对此茫茫，不觉成长叹。何时旦，晓星欲散，飞起平沙雁。`,bg:`康熙二十一年（1682）纳兰随驾出塞，宿黄花城（今北京怀柔）早望所作。五更月色寒彻，积雪与栈道齐平；对此茫茫大地，他不觉长叹：天何时亮？晓星将散，平沙上已飞起大雁。`},
{t:'相见欢 · 落花如梦凄迷',body:`落花如梦凄迷，麝烟微，又是夕阳潜下小楼西。
愁无限，消瘦尽，有谁知？闲教玉笼鹦鹉念郎诗。`,bg:`闺怨小令。落花如梦、麝烟微微，夕阳又悄悄沉下小楼西。愁无限而消瘦尽，有谁知道？她闲来教笼中鹦鹉念情郎的诗。`},
{t:'昭君怨 · 深禁好春谁惜',body:`深禁好春谁惜？薄暮瑶阶伫立。别院管弦声，不分明。
又是梨花欲谢，绣被春寒今夜。寂寂锁朱门，梦承恩。`,bg:`写深宫宫怨：深宫里的大好春光有谁怜惜？黄昏时她独自伫立在玉阶上，别院的管弦声听不分明。梨花又要谢了，绣被春寒，朱门寂寂，只有在梦里承恩。`},
{t:'酒泉子 · 谢却荼蘼',body:`谢却荼蘼，一片月明如水。篆香消，犹未睡，早鸦啼。
嫩寒无赖罗衣薄，休傍阑干角。最愁人，灯欲落，雁还飞。`,bg:`荼蘼花谢、月明如水，篆香已消而人未睡，早鸦已啼。嫩寒里罗衣太薄，劝她莫要靠着栏杆；最愁的是灯将落、雁还飞的时候。`},
{t:'一络索 · 过尽遥山如画',body:`过尽遥山如画，短衣匹马。萧萧落木不胜秋，莫回首、斜阳下。
别是柔肠萦挂，待归才罢。却愁拥髻向灯前，说不尽、离人话。`,bg:`行役途中。看尽如画的远山，短衣匹马独行；落木萧萧不胜秋意，莫要回首斜阳之下。柔肠另有一段牵挂，等归家才罢——最愁的是灯前相对，说不尽离人的话。`},
{t:'落花时 · 夕阳谁唤下楼梯',body:`夕阳谁唤下楼梯，一握香荑。回头忍笑阶前立，总无语，也依依。
笺书直恁无凭据，休说相思。劝伊好向红窗醉，须莫及，落花时。`,bg:`写一次猝然相逢：夕阳里是谁唤她下楼？她握着一把香草，回头忍笑立在阶前，虽无一语也自依依。书信终究无凭，劝她且向红窗一醉，莫要错过落花时节。`},
{t:'荷叶杯 · 知己一人谁是',body:`知己一人谁是？已矣。赢得误他生。有情终古似无情，别语悔分明。
莫道芳时易度，朝暮。珍重好花天。为伊指点再来缘，疏雨洗遗钿。`,bg:`纳兰悼念亡妻兼怀知己。"有情终古似无情"是他的至痛之语：正因太有情，反教人看着像无情。末句说要为她指点再来的缘分，疏雨正洗着遗留的钿钗。`},
{t:'秋千索 · 垆边换酒双鬟亚',body:`垆边换酒双鬟亚，春已到卖花帘下。一道香尘碎绿蘋，看白袷、亲调马。
烟丝宛宛愁萦挂，剩几笔、晚晴图画。半枕芙蕖压浪眠，教费尽、莺儿话。`,bg:`春日游冶之作。酒垆边双鬟少女换酒，卖花帘下春意已到；香尘碾碎绿蘋，看白衣少年亲自调马。烟柳宛宛牵着愁绪，剩几笔晚晴的图画。`},
{t:'好事近 · 何路向家园',body:`何路向家园，历历残山剩水。都把一春冷淡，到麦秋天气。
料应重发隔年花，莫问花前事。纵使东风依旧，怕红颜不似。`,bg:`思归之作。哪条路通向家园？眼前只有历历残山剩水。一春冷淡直到麦秋天气；隔年的花料应重开，可纵使东风依旧，怕红颜已不似当年。`},
{t:'太常引 · 自题小照',body:`西风乍起峭寒生，惊雁避移营。千里暮云平，休回首、长亭短亭。
无穷山色，无边往事，一例冷清清。试倩玉箫声，唤千古、英雄梦醒。`,bg:`纳兰为自己的小照题词。西风乍起、惊雁避营，千里暮云平铺；无穷山色、无边往事，一例冷清清。末句想借玉箫声唤醒千古英雄梦，是他少有的豪放语。`},
{t:'踏莎行 · 月华如水',body:`月华如水，波纹似练，几簇淡烟衰柳。塞鸿一夜尽南飞，谁与问倚楼人瘦。
韵拈风絮，录成金石，不是舞裙歌袖。从前负尽扫眉才，又担阁镜囊重绣。`,bg:`此词一说是纳兰为妻子卢氏写照。月华如水、淡烟衰柳，塞鸿一夜南飞，谁去问那倚楼人的消瘦？她的才情不在舞裙歌袖，而在风絮金石之间。`},
{t:'鹊桥仙 · 乞巧楼空',body:`乞巧楼空，影娥池冷，佳节只供愁叹。丁香空结雨中愁，也是一般凄断。
人间何处，问多情伴侣，剩取闲愁相伴。神仙纵有相逢期，也只恐、人间易散。`,bg:`七夕悼亡。乞巧楼空、影娥池冷，佳节只供愁叹；丁香在雨中空结着愁，也是一般的凄凉断肠。末句说神仙纵有相逢之期，也只怕人间容易离散。`},
{t:'南歌子 · 古戍饥乌集',body:`古戍饥乌集，荒城野雉飞。何年劫火剩残灰，试看英雄碧血，满龙堆。
玉帐空分垒，金笳已罢吹。东风回首尽成非，不道兴亡命也，岂人为。`,bg:`康熙二十一年（1682）出塞途中作。古戍饥乌、荒城野雉，英雄碧血洒满龙堆（白龙堆沙漠）。玉帐空垒、金笳罢吹，末句叹"兴亡命也，岂人为"，是纳兰少有的历史兴亡之感。`},
{t:'青衫湿 · 悼亡',body:`近来无限伤心事，谁与话长更？从教分付，绿窗红泪，早雁初莺。
当时领略，而今断送，总负多情。忽疑君到，漆灯风飐，痴数春星。`,bg:`悼亡之作。近来无限伤心事，长夜与谁诉说？当时领略过的温柔，如今都成了断送，终究辜负了多情。恍惚间疑心你来了——只见漆灯被风吹动，我痴痴地数着春星。`},
{t:'眼儿媚 · 咏红姑娘',body:`骚屑西风弄晚寒，翠袖倚阑干。霞绡裹处，樱唇微绽，靺鞨红殷。
故宫事往凭谁问，无恙是朱颜。玉墀争采，玉钗争插，至正年间。`,bg:`红姑娘即酸浆草的果实。纳兰咏此物，由眼前殷红的果实联想到元故宫旧事（至正年间），写物是人非、朱颜依旧而故宫已非。`},
{t:'河传 · 春残',body:`春残，红怨，掩双环。微雨花间，昼闲。无言暗将红泪弹。阑珊，香销轻梦还。
斜倚画屏思往事，皆不是，空作相思字。记当时，垂柳丝，花枝，满庭蝴蝶儿。`,bg:`春残红怨、微雨花间，她无言暗弹红泪。斜倚画屏追思往事，全都已不是，只空写下相思的字。记得当时：垂柳丝、花枝、满庭的蝴蝶儿。`},
{t:'木兰花慢 · 立秋夜雨，送梁汾南行',body:`盼银河迢递，惊入夜，转清商。乍西园蝴蝶，轻翻麝粉，暗惹蜂黄。炎凉。等闲瞥眼，甚丝丝、点点搅柔肠。应是登临送客，别离滋味重尝。
疑将。水墨画疏窗，孤影澹潇湘。倩一叶高梧，半条残烛、做尽商量。荷裳。被风暗剪，问今宵、谁与盖鸳鸯。从此羁愁万叠，梦回分付啼螀。`,bg:`康熙二十年（1681）立秋夜雨，纳兰冒雨送顾贞观南行。词中"从此羁愁万叠"一句，把知己离别之后的万般愁绪尽数道出，是他长调中的佳作。`},
{t:'水龙吟 · 题文姬图',body:`须知名士倾城，一般易到伤心处。柯亭响绝，四弦才断，恶风吹去。万里他乡，非生非死，此身良苦。对黄沙白草，呜呜卷叶，平生恨、从头谱。
应是瑶台伴侣，只多了、毡裘夫妇。凄凉一样，只今塞外，何须重赋？怪甚愁端，难道梦儿里、也拘管？待不思量，怎因循、书又无端误。`,bg:`纳兰题《文姬归汉图》，借蔡文姬身世抒写才命相妨之悲。"名士倾城，一般易到伤心处"，是他为古今才人共下的一语断词。`},
{t:'齐天乐 · 上元',body:`阑珊火树鱼龙舞，望中宝钗楼远。靺鞨余红，琉璃剩碧，待属花归缓缓。寒轻漏浅。正乍敛烟霏，陨星如箭。旧事惊心，一双莲影藕丝断。
黄昏心怯春倦，把湘帘半揭，愁梦都乱。水驿灯昏，山城马滑，还是翠被曾拥处。多应未惯，寂寞怎禁伊，独眠人怨。尽嘱东风，莫分春一半。`,bg:`元宵夜追忆往事。火树银花、鱼龙漫舞，而宝钗楼已远；旧事惊心，一双莲影如藕丝断。末句叮嘱东风：莫把春光分去一半。`},
{t:'满江红 · 茅屋新成却赋',body:`问我何心，却构此、三楹茅屋。可学得、海鸥无事，闲飞闲宿。百感都随流水去，一身还被浮名束。误东风、迟日杏花天，红牙曲。
尘土梦，蕉中鹿。翻覆手，看棋局。且耽闲殢酒，消他薄福。雪后谁遮檐际翠，雨余好种墙阴绿。有些些、欲说向寒宵，西窗烛。`,bg:`康熙十七年（1678）纳兰于渌水亭畔筑茅屋落成而作。他自问为何要造此三间茅屋，答以学海鸥无事、闲飞闲宿。百感随流水去，一身却被浮名所束——是他倦于世事的自白。`},
{t:'念奴娇 · 宿汉儿村',body:`无情野火，趁西风烧遍、天涯芳草。榆塞重来冰雪里，冷入鬓丝吹老。牧马长嘶，征笳乱动，并入愁怀抱。定知今夕，庾郎瘦损多少。
便是脑满肠肥，尚难消受，此荒烟落照。何况文园憔悴后，非复酒垆风调。回乐峰寒，受降城远，梦向家山绕。茫茫百感，凭高唯有清啸。`,bg:`康熙二十一年（1682）纳兰随驾出塞，宿汉儿村（今河北承德一带）。野火西风、榆塞冰雪，牧马征笳并入愁怀；末句"茫茫百感，凭高唯有清啸"，是他边塞词中最苍凉的收束。`},
{t:'沁园春 · 瞬息浮生',body:`瞬息浮生，薄命如斯，低徊怎忘？记绣榻闲时，并吹红雨，雕阑曲处，同倚斜阳。梦好难留，诗残莫续，赢得更深哭一场。遗容在，只灵飙一转，未许端详。
重寻碧落茫茫，料短发、朝来定有霜。便人间天上，尘缘未断，春花秋叶，触绪还伤。欲结绸缪，翻惊摇落，减尽荀衣昨日香。真无奈，倩声声邻笛，谱出回肠。`,bg:`康熙十六年（1677）卢氏去世后不久所作。小序自言"梦亡妇淡装素服，执手哽咽，语多不复能记"。词从梦中相会写到梦醒遗容，是纳兰悼亡词中最长、最哀的一首。`},
{t:'沁园春 · 试望阴山',body:`试望阴山，黯然销魂，无言徘徊。见青峰几簇，去天才尺，黄沙一片，匝地无埃。碎叶城荒，拂云堆远，雕外寒烟惨不开。踟蹰久，忽砯崖转石，万壑惊雷。
穷边自足愁怀，又何必平生多恨哉。只凄凉绝塞，蛾眉遗冢，销沉腐草，骏骨空台。北转河流，南横斗柄，略点微霜鬓早衰。君不信，向西风回首，百事堪哀。`,bg:`康熙二十一年（1682）纳兰出塞望阴山而作。青峰去天不盈尺、黄沙匝地无埃，忽闻砯崖转石、万壑惊雷。末句"向西风回首，百事堪哀"，是他边塞词中最沉郁的慨叹。`},
{t:'台城路 · 塞外七夕',body:`白狼河北秋偏早，星桥又迎归节。运巧思穿，愁凝笑解，恰是人间离别。相思漫说，任蛛网慵拈，虫丝空结。还似年年，旧时情绪为谁说。
当时密祝深期，料天孙不管，此恨难雪。梦断刀环，魂销罗袜，两戒河山都裂。柔肠寸折，正沙净草枯，水平天阔。恨煞西风，又吹尘世屑。`,bg:`康熙二十一年（1682）七夕纳兰在塞外作。白狼河（大凌河）北秋来偏早，七夕星桥又是离别之日。他说牛郎织女的恨难消，自己的柔肠也寸寸折断。`},
{t:'忆王孙 · 暗怜双绁郁金香',body:`暗怜双绁郁金香，欲梦天涯思转长。
几夜东风昨夜霜，减容光，莫为繁花又断肠。`,bg:`小令《忆王孙》。她暗自怜惜那双郁金香染的丝带，想借梦去天涯，思念反而更长。几夜东风、昨夜寒霜，减损了容光；她劝自己：莫要为了繁花又断肠。`},
{t:'望海潮 · 宝珠洞',body:`漠陵风雨，寒烟衰草，江山满目兴亡。白日空山，夜深清呗，算来别是凄凉。往事最堪伤，想铜驼巷陌，金谷风光。几处离宫，至今童子牧牛羊。
荒沙一片茫茫，有桑乾一线，雪冷雕翔。一道炊烟，三分梦雨，忍看林表斜阳。归雁两三行，见乱云低水，铁骑荒冈。僧饭黄昏，松门凉月拂衣裳。`,bg:`纳兰登北京西山宝珠洞远望。漠陵风雨、寒烟衰草，满目兴亡之慨；荒沙茫茫、桑乾一线，归雁两三行，末以僧饭黄昏、松门凉月收束，苍凉而静穆。`},
{t:'水调歌头 · 题西山秋爽图',body:`空山梵呗静，水月影俱沉。悠然一境人外，都不许尘侵。岁晚忆曾游处，犹记半竿斜照，一抹界疏林。绝顶茅庵里，老衲正孤吟。
云中锡，溪头线，岩下琴。此生著几两屐，谁识卧游心？准拟乘风归去，错向槐安回首，何日得投簪。布袜青鞋约，但向画图寻。`,bg:`纳兰为题画之作。画中空山梵呗、水月俱沉，绝顶茅庵里老衲孤吟。他羡慕这种出尘之境，"何日得投簪"一语，透露出对官场羁绊的厌倦。`},
{t:'风流子 · 秋郊射猎',body:`平原草枯矣，重阳后，黄叶树骚骚。记玉勒青丝，落花时节，曾逢拾翠，忽听吹箫。今来是、烧痕残碧尽，霜影乱红凋。秋水映空，寒烟如织，皂雕飞处，天惨云高。
人生须行乐，君知否，容易两鬓萧萧。自与东君作别，刬地无聊。算功名何许，此身博得，短衣射虎，沽酒西郊。便向夕阳影里，倚马挥毫。`,bg:`康熙年间纳兰秋郊射猎后作。上片写秋原萧瑟，下片忽作豪语"人生须行乐"，末句"便向夕阳影里，倚马挥毫"，是这位贵公子难得的慷慨之音。`},
{t:'转应曲 · 明月',body:`明月，明月。曾照个人离别。玉壶红泪相偎，还似当年夜来。来夜，来夜，肯把清辉重借。`,bg:`小令《转应曲》。明月曾照那人离别，玉壶与红泪相偎，还像当年夜里的情形。他痴问来夜的月亮：肯把清辉再借我一用么？`},
{t:'赤枣子 · 风淅淅',body:`风淅淅，雨纤纤。难怪春愁细细添。记不分明疑是梦，梦来还隔一重帘。`,bg:`小令写春愁。风声淅淅、雨丝纤纤，难怪春愁细细地添。记忆不分明，疑心是梦；可梦来了，还隔着一层帘子。`},
{t:'玉连环影 · 何处',body:`何处？几叶萧萧雨。湿尽檐花，花底人无语。掩屏山，玉炉寒。谁见两眉愁聚倚阑干。`,bg:`小令《玉连环影》（即《忆江南》另一体）。问雨从何处来？几叶萧萧的雨打湿了檐花，花下的人默然无语。掩上屏风，玉炉生寒，谁看见她双眉愁聚、独倚阑干。`},
{t:'忆秦娥 · 龙潭口',body:`山重叠。悬崖一线天疑裂。天疑裂。断碑题字，古苔横啮。
风声雷动鸣金铁。阴森潭底蛟龙窟。蛟龙窟。兴亡满眼，旧时明月。`,bg:`康熙二十一年（1682）纳兰随驾游龙潭口（今河北承德一带）。悬崖一线、断碑古苔，风声如雷、潭深似蛟龙窟；末句"兴亡满眼，旧时明月"，历史之感扑面而来。`},
{t:'霜天晓角 · 重来对酒',body:`重来对酒，折尽风前柳。若问看花情绪，似当日、怎能够。
休为西风瘦，痛饮频搔首。自古青蝇白璧，天公已、安排就。`,bg:`此词写重逢对饮、折柳伤别。若问看花的心情还能不能像当日——怎么能够？末句以"青蝇白璧"自喻遭谗，说这一切天公早已安排定了。`},
{t:'鹧鸪天 · 离恨',body:`背立盈盈故作羞，手挼梅蕊打肩头。欲将离恨寻郎说，待得郎来恨却休。
云淡淡，水悠悠，一声横笛锁空楼。何时共泛春溪月，断岸垂杨一叶舟。`,bg:`写小儿女的离恨：她背立着故作娇羞，手搓梅蕊打在郎肩头。本想把离恨说给他听，等他来了恨却全消。末句相约春溪月下共泛一叶扁舟。`},
{t:'金人捧露盘 · 净业寺观莲，有怀荪友',body:`藕风轻，莲露冷，断虹收。正红窗、初上帘钩。田田翠盖，趁斜阳鱼浪香浮。此时画阁垂杨岸，睡起梳头。
旧游踪，招提路，重到处，满离忧。想芙蓉、湖上悠悠。红衣狼藉，卧看少妾荡兰舟。午风吹断江南梦，梦里菱讴。`,bg:`康熙十七年（1678）纳兰于净业寺观莲，怀念南归的好友严绳孙（荪友）。藕风莲露、断虹初收，重到旧游之地满眼离忧；午风吹断江南梦，梦里是采菱的歌。`},
{t:'翦湘云 · 送友',body:`险韵慵拈，新声倦倚。判憔悴无眠，残更相对。药裹关心诗总废，穗帐灯昏泪。最无聊、听尽漏声长，判小字、裁将寄。
无奈，一寸柔肠，几番萦系。问此后、怎生忘记。梦里也、须唤起。愿他生、莫作有情痴，人天无地，著个寻常知己。`,bg:`纳兰送别友人。险韵懒拈、新声倦倚，残更相对无眠。药裹关心而诗总废，灯昏帐冷泪长流；末句愿来生莫作有情痴，人天之间放不下一个寻常知己。`},
{t:'潇湘雨 · 送西溟归慈溪',body:`长安一夜雨，便添了、几分秋色。奈此际萧条，无端又听，渭城风笛。咫尺层城留不住，久相忘、到此偏相忆。依依白露丹枫，渐行渐远，天涯南北。
凄寂。黔娄当日事，总名士、如何消得。只皂帽蹇驴，西风残照，倦游踪迹。廿载江南犹落拓，叹一人、知己终难觅。君须爱酒能诗，坐对青灯，那更寒虫四壁。`,bg:`康熙十八年（1679）姜宸英（西溟）南归慈溪，纳兰作此送别。他为友人才高命蹇而痛惜，"叹一人、知己终难觅"一语，说的既是西溟，也是自己。`},
{t:'琵琶仙 · 中秋',body:`碧海年年，试问取、冰轮为谁圆缺？吹到一片秋香，清辉了如雪。愁中看、好天良夜，知道尽成悲咽。只影而今，那堪重对，旧时明月。
花径里、戏捉迷藏，曾惹下萧萧井梧叶。记否轻纨小扇，又几番凉热。只落得、填膺百感，总茫茫、不关离别。一任紫玉无情，夜寒吹裂。`,bg:`中秋夜纳兰独对明月。碧海年年，冰轮为谁圆缺？他想起童年花径里捉迷藏的往事、轻纨小扇的几番凉热，如今只剩填膺百感，任紫玉笛在夜寒中吹裂。`},
{t:'凤凰台上忆吹箫 · 除夕得梁汾闽中信，因赋',body:`荔粉初装，桃符欲换，怀人忽在天涯。想萧然孤馆，竹影横斜。料得也应憔悴，吟尽了、水驿梅花。乡心切，何时归去，乘月到家。
堪嗟，人生离合，便常也难必，况是京华。更那堪此际，独听悲笳。纵有相思千点，凭谁寄、梦里还家。清辉在，依然烛影，但照窗纱。`,bg:`康熙二十一年（1682）除夕，纳兰收到顾贞观自福建的来信。恰逢荔粉初装、桃符欲换，他想象友人孤馆中竹影横斜、吟尽水驿梅花的情景，倍增乡思与友思。`},
{t:'百字令 · 废园有感',body:`片红飞减，甚东风不语，只催漂泊。石上胭脂花上露，谁与画眉商略。碧甃瓶沉，紫钱钗掩，雀踏金铃索。韶华如梦，为寻好梦担阁。

    else { A.DB=A.defaultDB(); }
  }catch(e){ console.warn('本地数据读取失败',e); A.DB=A.defaultDB(); }
};
A.save=function(mod){
  const DB=A.DB;
  if(mod) DB.meta.updatedAt[mod]=Date.now();
  DB.meta.updatedAt.__all=Date.now();
  try{ localStorage.setItem(STORE_KEY,JSON.stringify(DB)); }
  catch(e){ A.toast('本地存储写入失败：'+e.message,'err'); return false; }
  if(mod) A.Sync.schedule();
  return true;
};
A.saveAll=function(){ return A.save(null); };
A.replaceDB=function(obj){ /* 保持引用不变，逐字段替换 */

/* =========================================================
   IndexedDB（背景图片等大对象存储）
   ========================================================= */
A.idb={
  _db:null,
  ready(){ return new Promise((res,rej)=>{
    if(this._db) return res(this._db);
    if(!window.indexedDB) return rej(new Error('浏览器不支持 IndexedDB'));
    const rq=indexedDB.open('happydiary_files',1);
    rq.onupgradeneeded=()=>{ rq.result.createObjectStore('files'); };
    rq.onsuccess=()=>{ this._db=rq.result; res(this._db); };
    rq.onerror=()=>rej(rq.error);
  });},
  async get(key){ const db=await this.ready(); return new Promise((res,rej)=>{
    const rq=db.transaction('files','readonly').objectStore('files').get(key);
    rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error); });},
  async set(key,val){ const db=await this.ready(); return new Promise((res,rej)=>{
    const rq=db.transaction('files','readwrite').objectStore('files').put(val,key);
    rq.onsuccess=()=>res(true); rq.onerror=()=>rej(rq.error); });},
  async del(key){ const db=await this.ready(); return new Promise((res,rej)=>{
    const rq=db.transaction('files','readwrite').objectStore('files').delete(key);
    rq.onsuccess=()=>res(true); rq.onerror=()=>rej(rq.error); });}
};

/* =========================================================
   云同步（带详细进度反馈）
   ========================================================= */
/* 同步用：浏览器安全的 UTF-8 ↔ Base64（Gitee 的 Gist 存储列不支持 4 字节 UTF-8/表情，
   先编码为 ASCII 再上传，拉取时还原，确保 emoji 等数据完整往返） */
function b64e(str){
  const bytes=new TextEncoder().encode(str);
  let bin=''; for(let i=0;i<bytes.length;i++) bin+=String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function b64d(b64){
  const bin=atob(b64.trim()); const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
A.Sync={
  busy:false,timer:null,steps:[],cur:'',
  cfg(){ return A.DB.settings.cloud||{}; },
  enabled(){ const c=this.cfg(); return !!c.type&&c.type!=='none'; },
  setStatus(txt,cls){ const d=$('#syncDot'),t=$('#syncText');
    if(d) d.className='sync-dot '+(cls||'off'); if(t) t.textContent=txt; if(A.onSyncStatus) A.onSyncStatus(txt,cls); },
  step(name){ this.cur=name; this.steps.push({name,state:'cur'});
    this.steps.forEach(s=>{ if(s.state==='cur'&&s!==this.steps[this.steps.length-1]) s.state='done'; });
    this.setStatus(name,'busy'); A.renderSyncProgress&&A.renderSyncProgress(); },
  finish(ok,msg){
    this.steps.forEach(s=>{ if(s.state==='cur') s.state=ok?'done':'err'; });
    this.setStatus(msg,ok?'':'off'); A.renderSyncProgress&&A.renderSyncProgress();
  },
  schedule(){
    clearTimeout(this.timer);
    const c=this.cfg();
    if(!this.enabled()||!c.auto) return;
    this.timer=setTimeout(()=>this.sync(true),8000);
  },
  async request(url,opt){
    const r=await fetch(url,opt);
    if(!r.ok){
      let msg='HTTP '+r.status+(r.statusText?(' '+r.statusText):'');
      try{
        const t=await r.text();
        if(t){
          try{ const j=JSON.parse(t); msg+='：'+(j.message||j.msg||(typeof j==='string'?j:t.slice(0,200))); }
          catch(e){ msg+='：'+t.slice(0,200); }
        }
      }catch(e){ /* 读取响应体失败不影响主错误 */ }
      const err=new Error(msg); err.status=r.status; throw err;
    }
    return r;
  },
  async testConnection(){
    const c=this.cfg();
    console.log('[Sync] testConnection → type=',c.type);
    if(c.type==='github'||c.type==='gitee'){
      const isGh=c.type==='github';
      const whoUrl=isGh?'https://api.github.com/user':'https://gitee.com/api/v5/user'+(isGh?'':'?access_token='+encodeURIComponent(c.token));
      const whoHeaders=isGh?{'Authorization':'Bearer '+c.token,'Accept':'application/vnd.github+json'}:{};
      const wr=await this.request(whoUrl,{headers:whoHeaders});
      const wj=await wr.json();
      const who=wj.login||wj.name||'(未知)';
      let gistOk=null;
      if(c.gistId){
        try{
          const gurl=(isGh?'https://api.github.com/gists/':'https://gitee.com/api/v5/gists/')+c.gistId+(isGh?'':('?access_token='+encodeURIComponent(c.token)));
          await this.request(gurl,{headers:isGh?{'Authorization':'Bearer '+c.token,'Accept':'application/vnd.github+json'}:{}});
          gistOk=true;
        }catch(e){ gistOk=false; }
      }
      console.log('[Sync] testConnection ok, who=',who,'gistOk=',gistOk);
      return {ok:true, who, gistOk, type:c.type};
    }
    if(c.type==='rest'){
      if(!c.getUrl) throw new Error('请先填写“下载地址”');
      const r=await fetch(c.getUrl,{cache:'no-store'});
      if(!r.ok) throw new Error('下载测试失败 HTTP '+r.status);
      return {ok:true, who:'自定义接口', gistOk:true, type:'rest'};
    }
    if(c.type==='webdav'){
      if(!c.webdavUrl) throw new Error('请先填写 WebDAV 文件地址');
      const r=await fetch(c.webdavUrl,{method:'GET',headers:{'Authorization':'Basic '+btoa(c.user+':'+c.pass)},cache:'no-store'});
      if(!r.ok) throw new Error('WebDAV 读取失败 HTTP '+r.status);
      return {ok:true, who:'WebDAV', gistOk:true, type:'webdav'};
    }
    throw new Error('未知的同步方式');
  },
  async createGist(){
    const c=this.cfg();
    const body={description:'我的快乐日记 · 数据同步',public:false,files:{'happydiary.json':{content:b64e(JSON.stringify(A.DB))}}};
    console.log('[Sync] createGist → type=',c.type);
    if(c.type==='github'){
      const r=await this.request('https://api.github.com/gists',{method:'POST',headers:{'Authorization':'Bearer '+c.token,'Accept':'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify(body)});
      const j=await r.json(); console.log('[Sync] createGist github ok, id=',j.id); return j.id;
    }
    /* Gitee：浏览器端对 POST /gists 常被 CORS/WAF 拦截返回 500，需手动建档案 */
    const url='https://gitee.com/api/v5/gists?access_token='+encodeURIComponent(c.token);
    console.log('[Sync] createGist → POST',url,'body.files=',Object.keys(body.files));
    try{
      const r=await this.request(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({access_token:c.token},body))});
      const j=await r.json(); console.log('[Sync] createGist gitee ok, id=',j.id); return j.id;
    }catch(e){
      console.warn('[Sync] createGist gitee 失败：',e.message);
      if(e.status===500||e.status===403)
        throw new Error('Gitee 暂不支持在浏览器内自动创建档案（接口返回 '+(e.status||'')+'）。请在 Gitee 网页端手动新建一个 Gist（文件名填 happydiary.json），把生成的 ID 填到“云端档案 ID”框后再同步。');
      throw e;
    }
  },
  async pull(){
    const c=this.cfg(); let remote;
    if(c.type==='github'||c.type==='gitee'){
      if(!c.gistId) throw new Error('还没有云端档案，请先创建');
      const base=c.type==='github'?'https://api.github.com/gists/':'https://gitee.com/api/v5/gists/';
      const url=base+c.gistId+(c.type==='gitee'?('?access_token='+encodeURIComponent(c.token)):'');
      const r=await this.request(url,{headers:c.type==='github'?{'Authorization':'Bearer '+c.token,'Accept':'application/vnd.github+json'}:{}});
    const j=await r.json(); const f=(j.files||{})['happydiary.json'];
    let content='';
    if(f){ content=f.content||''; if(f.truncated&&f.raw_url){ try{ const rr=await fetch(f.raw_url); content=await rr.text(); }catch(e){} } }
    let parsed=null;
    if(content){
      /* 优先按 Base64 解码（新格式）；失败则按纯 JSON 解析（兼容旧/手动档案） */
      try{ const d=b64d(content.trim()); parsed=JSON.parse(d); }
      catch(e){ try{ parsed=JSON.parse(content); }catch(e2){ parsed=null; } }
    }
    /* 档案为空 / 内容损坏 / 不是合法数据库 → 视为“全新档案”，返回中性种子（merge 为 no-op，随后 upload 写入真实数据） */
    if(!parsed||typeof parsed!=='object'||!parsed.meta) parsed={meta:{updatedAt:{}}};
    remote=parsed;
  }else if(c.type==='rest'){
      if(!c.getUrl) throw new Error('请填写“下载地址”');
      const r=await fetch(c.getUrl,{cache:'no-store'});
      if(!r.ok) throw new Error('下载失败 HTTP '+r.status);
      remote=await r.json();
    }else if(c.type==='webdav'){
      const r=await fetch(c.webdavUrl,{method:'GET',headers:{'Authorization':'Basic '+btoa(c.user+':'+c.pass)},cache:'no-store'});
      if(!r.ok) throw new Error('WebDAV 读取失败 HTTP '+r.status);
      remote=await r.json();
    }else throw new Error('未知的同步方式');
    if(!remote||typeof remote!=='object') throw new Error('云端数据格式不正确');
    return remote;
  },
  async upload(){
    const c=this.cfg();
    if(c.type==='github'||c.type==='gitee'){
      if(!c.gistId){
        if(c.type==='github'){ c.gistId=await this.createGist(); A.save('settings'); }
        else throw new Error('还没有云端档案 ID。请先在 Gitee 网页端新建一个 Gist（文件名填 happydiary.json，内容随便写），把生成的 ID 填到“数据同步”页面的“云端档案 ID”框，再点同步。');
      }
      else{
        const body={files:{'happydiary.json':{content:b64e(JSON.stringify(A.DB))}}};
        if(c.type==='github'){
          await this.request('https://api.github.com/gists/'+c.gistId,{method:'PATCH',headers:{'Authorization':'Bearer '+c.token,'Accept':'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify(body)});
        }else{
          await this.request('https://gitee.com/api/v5/gists/'+c.gistId,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({access_token:c.token},body))});
        }
      }
    }else if(c.type==='rest'){
      if(!c.putUrl) throw new Error('请填写“上传地址”');
      await this.request(c.putUrl,{method:(c.putMethod||'PUT'),headers:{'Content-Type':'application/json'},body:JSON.stringify(A.DB)});
    }else if(c.type==='webdav'){
      if(!c.webdavUrl) throw new Error('请填写 WebDAV 文件地址');
      const r=await fetch(c.webdavUrl,{method:'PUT',headers:{'Authorization':'Basic '+btoa(c.user+':'+c.pass),'Content-Type':'application/json'},body:JSON.stringify(A.DB)});
      if(!r.ok) throw new Error('WebDAV 上传失败 HTTP '+r.status);
    }
    c.lastSync=Date.now();
    /* 直接落盘，避免 A.save('settings') 触发 schedule() 形成「同步→保存→再同步」死循环导致页面持续闪烁 */
    try{ localStorage.setItem(STORE_KEY,JSON.stringify(A.DB)); }catch(e){}
  },
  merge(remote){
    let n=0;
    const lu=A.DB.meta.updatedAt||{}, ru=(remote.meta&&remote.meta.updatedAt)||{};
    A.MODULES.forEach(m=>{
      const a=lu[m]||0,b=ru[m]||0;
      if(b>a&&remote[m]!==undefined){ A.DB[m]=remote[m]; lu[m]=b; n++; }
    });
    A.DB.meta.updatedAt=lu; A.makeBackup('云端合并'); A.saveAll();
    return n;
  },
  async sync(silent){
    if(!this.enabled()){ A.toast('请先在数据同步里配置云端','err'); return; }
    if(this.busy) return;
    this.busy=true; this.steps=[];
    const t0=Date.now();
    try{
      this.step('① 连接云端…');
      const c0=this.cfg();
      if((c0.type==='gitee'||c0.type==='github')&&!c0.gistId){
        throw new Error(c0.type==='gitee'
          ? '还没有云端档案 ID。请先在 Gitee 网页端新建一个 Gist（文件名填 happydiary.json），把生成的 ID 填到“数据同步”页面，再点同步。'
          : '还没有云端档案 ID，正在自动创建…');
      }
      const remote=await this.pull();
      this.step('② 下载云端数据（'+Math.round(JSON.stringify(remote).length/1024)+' KB）');
      await new Promise(r=>setTimeout(r,120));
      this.step('③ 比对本地与云端差异');
      const n=this.merge(remote);
      this.step('④ 合并完成'+(n?('（更新 '+n+' 项）'):'（本地已是最新）'));
      this.step('⑤ 上传合并结果到云端');
      await this.upload();
      const ms=Date.now()-t0;
      this.finish(true,'已同步 '+nowHM()+'（'+ms+'ms）');
      if(!silent) A.toast('同步完成，更新 '+n+' 项','ok');
      if(n>0) A.render(); /* 仅在确有数据变更时重渲染，避免静默同步时页面反复闪烁 */
    }catch(e){
      this.finish(false,'同步失败');
      if(!silent) A.toast('同步失败：'+e.message,'err');
    }
    this.busy=false; this.timer=null;
  },
  async push(silent){
    if(!this.enabled()){ A.toast('请先在数据同步里配置云端','err'); return; }
    if(this.busy) return;
    this.busy=true; this.steps=[];
    try{
      this.step('① 准备本地数据（'+Math.round(JSON.stringify(A.DB).length/1024)+' KB）');
      this.step('② 上传到云端…');
      await this.upload();
      this.finish(true,'已上传 '+nowHM());
      if(!silent) A.toast('已上传到云端 ✓','ok');
    }catch(e){ this.finish(false,'上传失败'); if(!silent) A.toast('上传失败：'+e.message,'err'); }
    this.busy=false; this.timer=null;
  }
};
A.renderSyncProgress=function(){

/* =========================================================
   图表（自绘 + 缓存 + 防抖 + Hover Tooltip + 点击）
   ========================================================= */
function setupCanvas(cv){
  const dpr=window.devicePixelRatio||1;
  const w=cv.clientWidth||cv.parentNode.clientWidth||600,h=cv.clientHeight||260;
  cv.width=Math.max(1,Math.round(w*dpr)); cv.height=Math.max(1,Math.round(h*dpr));
  const ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h);
  return {ctx,w,h};
}
function niceRange(min,max){
  if(min===max){ min-=1; max+=1; }
  const span=max-min, raw=span/4, mag=Math.pow(10,Math.floor(Math.log10(Math.abs(raw)||1)));
  let s=mag*10; [1,2,2.5,5,10].forEach(m=>{ if(mag*m>=raw){ if(!s||mag*m<s) s=mag*m; } });
  return {lo:Math.floor(min/s)*s,hi:Math.ceil(max/s)*s,step:s};
}
const chartMemo=new WeakMap();
function sigOf(cv,type,cfg){
  return type+'|'+cv.clientWidth+'x'+cv.clientHeight+'|'+JSON.stringify(cfg);
}
function drawLineRaw(cv,cfg){
  const {ctx,w,h}=setupCanvas(cv);
  const P={l:44,r:14,t:16,b:26};
  const labels=cfg.labels||[], ds=(cfg.datasets||[]).filter(d=>d&&d.data.length);
  let vals=[]; ds.forEach(d=>vals=vals.concat(d.data.filter(v=>v!=null&&isFinite(v))));
  if(cfg.target!=null&&isFinite(cfg.target)) vals.push(cfg.target);
  if(!vals.length) vals=[0,1];
  let min=Math.min.apply(null,vals),max=Math.max.apply(null,vals);
  const padv=(max-min)*0.18||1; min-=padv; max+=padv;
  const R=niceRange(min,max); min=R.lo; max=R.hi;
  const X=i=>P.l+(w-P.l-P.r)*(labels.length<=1?0.5:i/(labels.length-1||1));
  const Y=v=>P.t+(h-P.t-P.b)*(1-(v-min)/(max-min||1));
  const font='11px '+getComputedStyle(document.body).fontFamily;
  ctx.font=font; ctx.strokeStyle='rgba(160,130,170,.22)'; ctx.fillStyle='rgba(120,100,125,.85)'; ctx.lineWidth=1;
  for(let v=min;v<=max+1e-9;v+=R.step){
    const y=Y(v); ctx.beginPath(); ctx.moveTo(P.l,y); ctx.lineTo(w-P.r,y); ctx.stroke();
    ctx.textAlign='right'; ctx.textBaseline='middle';
    ctx.fillText(Math.abs(v)>=1000?v.toFixed(0):v.toFixed(1),P.l-6,y);
  }
  ctx.textAlign='center'; ctx.textBaseline='top';
  const stepL=Math.ceil(labels.length/(w<420?5:10));
  labels.forEach((l,i)=>{ if(i%stepL===0||i===labels.length-1) ctx.fillText(l,X(i),h-P.b+7); });
  if(cfg.target!=null&&isFinite(cfg.target)){
    ctx.save(); ctx.setLineDash([6,5]); ctx.strokeStyle='#a98bf5'; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(P.l,Y(cfg.target)); ctx.lineTo(w-P.r,Y(cfg.target)); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle='#a98bf5'; ctx.textAlign='left'; ctx.textBaseline='bottom';
    ctx.fillText('目标 '+(cfg.targetLabel||cfg.target),P.l+4,Y(cfg.target)-3); ctx.restore();
  }
  const hits=[];
  ds.forEach(d=>{
    const pts=d.data.map((v,i)=>({x:X(i),y:(v==null||!isFinite(v))?null:Y(v),v:v,i:i})).filter(p=>p.y!=null);
    if(!pts.length) return;
    if(d.fill!==false){
      const g=ctx.createLinearGradient(0,P.t,0,h-P.b);
      g.addColorStop(0,(d.color||'#ff6fa5')+'55'); g.addColorStop(1,(d.color||'#ff6fa5')+'00');
      ctx.beginPath(); ctx.moveTo(pts[0].x,h-P.b); pts.forEach(p=>ctx.lineTo(p.x,p.y));
      ctx.lineTo(pts[pts.length-1].x,h-P.b); ctx.closePath(); ctx.fillStyle=g; ctx.fill();
    }
    ctx.beginPath(); pts.forEach((p,i)=>{ i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y); });
    ctx.strokeStyle=d.color||'#ff6fa5'; ctx.lineWidth=2.4; ctx.lineJoin='round'; ctx.lineCap='round'; ctx.stroke();
    pts.forEach(p=>{ ctx.beginPath(); ctx.arc(p.x,p.y,3.4,0,7); ctx.fillStyle='#fff'; ctx.fill();
      ctx.lineWidth=2; ctx.strokeStyle=d.color||'#ff6fa5'; ctx.stroke();
      hits.push({x:p.x,y:p.y,v:p.v,i:p.i}); });
  });
  return hits;
}
function drawBarRaw(cv,cfg){
  const {ctx,w,h}=setupCanvas(cv);
  const P={l:44,r:14,t:16,b:26};
  const labels=cfg.labels||[],data=cfg.data||[];
  let max=Math.max.apply(null,data.concat([cfg.min||10]));
  const R=niceRange(0,max*1.1); max=R.hi;
  const X=i=>P.l+(w-P.l-P.r)*(i+0.5)/Math.max(1,data.length);
  const Y=v=>P.t+(h-P.t-P.b)*(1-v/(max||1));
  const bw=Math.min(34,(w-P.l-P.r)/Math.max(1,data.length)*0.56);
  ctx.font='11px '+getComputedStyle(document.body).fontFamily;
  ctx.strokeStyle='rgba(160,130,170,.22)'; ctx.fillStyle='rgba(120,100,125,.85)';
  for(let v=0;v<=max+1e-9;v+=R.step){
    const y=Y(v); ctx.beginPath(); ctx.moveTo(P.l,y); ctx.lineTo(w-P.r,y); ctx.stroke();
    ctx.textAlign='right'; ctx.textBaseline='middle'; ctx.fillText(v.toFixed(0),P.l-6,y);
  }
  const hits=[];
  data.forEach((v,i)=>{
    const x=X(i),y0=Y(0),y1=Y(v);
    const g=ctx.createLinearGradient(0,y1,0,y0);
    g.addColorStop(0,'#ff8fbe'); g.addColorStop(1,'#c9a8f5');
    ctx.fillStyle=g; const r=Math.min(6,bw/2);
    ctx.beginPath();
    if(ctx.roundRect) { ctx.roundRect(x-bw/2,y1,bw,y0-y1,[r,r,0,0]); ctx.fill(); }
    else ctx.fillRect(x-bw/2,y1,bw,y0-y1);
    if(v>0){ ctx.fillStyle='#d93b79'; ctx.textAlign='center'; ctx.textBaseline='bottom'; ctx.font='bold 11px sans-serif';
      ctx.fillText(v.toFixed(0),x,y1-3); ctx.font='11px '+getComputedStyle(document.body).fontFamily; }
    ctx.fillStyle='rgba(120,100,125,.9)'; ctx.textAlign='center'; ctx.textBaseline='top';
    ctx.fillText(labels[i]||'',x,y0+6);
    hits.push({x:x,y:y1,v:v,i:i,bw:bw});
  });
  return hits;
}
function drawPieRaw(cv,cfg){
  const {ctx,w,h}=setupCanvas(cv);
  const items=(cfg.items||[]).filter(i=>i.value>0);
  const total=items.reduce((s,i)=>s+i.value,0);
  if(!total){ ctx.fillStyle='rgba(120,100,125,.6)'; ctx.font='13px sans-serif'; ctx.textAlign='center'; ctx.fillText('暂无数据',w/2,h/2); return []; }
  const cx=w*0.34,cy=h/2,r=Math.min(w*0.3,h*0.42);
  let a=-Math.PI/2; const hits=[];
  items.forEach(it=>{
    const ang=it.value/total*Math.PI*2;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,a,a+ang); ctx.closePath();
    ctx.fillStyle=it.color; ctx.fill(); ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke();
    const mid=a+ang/2;
    hits.push({mid:mid,item:it,x:cx+Math.cos(mid)*r*0.72,y:cy+Math.sin(mid)*r*0.72,v:it.value,i:cfg.items.indexOf(it)});
    a+=ang;
  });
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(cx,cy,r*0.42,0,7); ctx.fill();
  ctx.fillStyle='#6b5a70'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font='bold 13px sans-serif'; ctx.fillText(cfg.totalText||total.toFixed(0),cx,cy-6);
  ctx.font='10px sans-serif'; ctx.fillText(cfg.unit||'分钟',cx,cy+8);
  let ly=h/2-items.length*11+8;
  ctx.textAlign='left'; ctx.textBaseline='middle'; ctx.font='12px '+getComputedStyle(document.body).fontFamily;
  items.forEach(it=>{
    ctx.fillStyle=it.color; ctx.fillRect(w*0.66,ly-5,10,10);
    const vt=cfg.fmt?cfg.fmt(it.value):(it.value.toFixed(0)+'分');
    ctx.fillStyle='#5d4d63'; ctx.fillText(it.name+'  '+vt+' ('+(it.value/total*100).toFixed(0)+'%)',w*0.68,ly);
    ly+=22;
  });
  return hits;
}
/* 统一入口：绘制 + 缓存 + Tooltip + 点击 */
A.chart=function(cv,type,cfg,opts){
  if(!cv) return;
  opts=opts||{};
  const force=opts.force||!chartMemo.has(cv);
  const sig=sigOf(cv,type,cfg);
  let hits;
  if(force||chartMemo.get(cv).sig!==sig){
    hits=(type==='bar'?drawBarRaw:type==='pie'?drawPieRaw:drawLineRaw)(cv,cfg);
    chartMemo.set(cv,{sig:sig,hits:hits,type:type});
  }else{
    const m=chartMemo.get(cv); hits=m.hits;
  }
  const box=cv.parentNode;
  let tip=box&&box.querySelector('.chart-tip');
  if(!tip&&box){ tip=document.createElement('div'); tip.className='chart-tip'; box.appendChild(tip); }
  const move=e=>{
    if(!hits||!hits.length||!tip) return;
    const rect=cv.getBoundingClientRect();
    const px=(e.touches?e.touches[0].clientX:e.clientX)-rect.left;
    const py=(e.touches?e.touches[0].clientY:e.clientY)-rect.top;
    let best=null,bd=1e9;
    hits.forEach(ht=>{
      const d=type==='pie'?Math.hypot(px-ht.x,py-ht.y):Math.hypot(px-ht.x,py-(ht.y!=null?ht.y:py));
      const dd=type==='bar'?Math.abs(px-ht.x):d;
      if(dd<bd){ bd=dd; best=ht; }
    });
    if(!best||bd>(type==='bar'?(best.bw||30):(type==='pie'?60:34))){ tip.classList.remove('show'); return; }
    const text=opts.tipFmt?opts.tipFmt(best):((cfg.labels&&cfg.labels[best.i]||'')+'　'+best.v);
    tip.innerHTML=text;
    tip.style.left=(type==='pie'?best.x:best.x)+'px';
    tip.style.top=(best.y!=null?best.y:py)+'px';
    tip.classList.add('show');
    cv.style.cursor=opts.onClick?'pointer':'default';
  };
  const leave=()=>{ tip&&tip.classList.remove('show'); };
  cv.onmousemove=move; cv.onmouseleave=leave;
  cv.ontouchstart=move; cv.ontouchmove=move; cv.ontouchend=leave;
  cv.onclick=e=>{ if(!opts.onClick||!hits) return;
    const rect=cv.getBoundingClientRect();
    const px=(e.clientX||(e.changedTouches&&e.changedTouches[0].clientX)||0)-rect.left;
    const py=(e.clientY||(e.changedTouches&&e.changedTouches[0].clientY)||0)-rect.top;
    let best=null,bd=1e9;
    hits.forEach(ht=>{ const dd=type==='bar'?Math.abs(px-ht.x):Math.hypot(px-ht.x,py-(ht.y||py));
      if(dd<bd){ bd=dd; best=ht; } });
    if(best&&bd<(type==='bar'?(best.bw||30):40)) opts.onClick(best);
  };
  return hits;
};

A.navOrderArr=function(){
  const s=A.DB.settings, def=A.NAV.map(g=>g.k);
  const arr=s.navOrder;
  if(!Array.isArray(arr)||!arr.length){ s.navOrder=def.slice(); A.save('settings'); return def.slice(); }
  const known=new Set(def);
  const filtered=arr.filter(k=>known.has(k));
  let changed=filtered.length!==arr.length;
  def.forEach(k=>{ if(filtered.indexOf(k)<0){ filtered.push(k); changed=true; } });   /* 补齐新增模块（如购物/旅游） */
  if(changed){ s.navOrder=filtered; A.save('settings'); }
  return filtered;
};
A.subOrderMap=function(){
  const s=A.DB.settings, map={};
  A.NAV.forEach(g=>{ if(g.sub){ const def=g.sub.map(x=>x.k);
    const arr=s.subOrder&&s.subOrder[g.k];
    if(!Array.isArray(arr)||!arr.length){ map[g.k]=def.slice(); }
    else{ const known=new Set(def); const filtered=arr.filter(k=>known.has(k)); let ch=filtered.length!==arr.length;
      def.forEach(k=>{ if(filtered.indexOf(k)<0){ filtered.push(k); ch=true; } });
      if(ch){ if(!s.subOrder) s.subOrder={}; s.subOrder[g.k]=filtered; A.save('settings'); }
      map[g.k]=filtered; } } });
  return map;
};

   说明：HTML5 Drag&Drop 在移动端兼容性极差，这里统一用 Pointer Events——
   既能处理鼠标拖拽，也能处理触摸长按，并自动阻止移动端滚动 / 文本选择，体验更顺滑。

function onNavPointerDown(e){
  if(!A._navSort) return;
  const el=e.currentTarget;
  const isSub=el.classList.contains('sub-item');
  const moveEl=isSub?el:el.closest('.nav-group');
  if(!moveEl) return;
  const container=isSub?el.closest('.sub-wrap'):($('#navBox'));
  if(!container) return;
  const sibSel=isSub?'.sub-item':'.nav-group';
  const keyAttr=isSub?'data-k':'data-g';
  const isTouch=(e.pointerType==='touch');
  const startY=e.clientY,startX=e.clientX;
  const rect=moveEl.getBoundingClientRect();
  const offY=startY-rect.top;
  let active=false,aborted=false,longTimer=null;
  if(isTouch){ longTimer=setTimeout(()=>{ active=true; beginDrag(); },200); }   /* 移动端长按 200ms 触发 */
  function beginDrag(){
    try{ el.setPointerCapture(e.pointerId); }catch(_){}
    const ph=document.createElement('div');
    ph.className=isSub?'nav-sub-ph':'nav-group-ph';
    ph.style.height=rect.height+'px';
    moveEl.parentNode.insertBefore(ph,moveEl);
    moveEl.classList.add(isSub?'sub-drag':'group-drag');
    moveEl.style.width=rect.width+'px';
    moveEl.style.height=rect.height+'px';
    moveEl.style.position='fixed';
    moveEl.style.left=rect.left+'px';
    moveEl.style.top=(startY-offY)+'px';
    moveEl.style.zIndex='1200';
    moveEl.style.pointerEvents='none';
    moveEl._ph=ph;
    document.body.classList.add('dragging-active');
  }
  function onMove(ev){
    if(!active){
      if(isTouch){
        if(Math.abs(ev.clientY-startY)>10||Math.abs(ev.clientX-startX)>10){ aborted=true; clearTimeout(longTimer); }   /* 长按前移动=滚动，放弃拖拽 */
        return;
      }else{
        if(Math.abs(ev.clientY-startY)>4||Math.abs(ev.clientX-startX)>4){ active=true; beginDrag(); }   /* PC：移动阈值即触发 */
        else return;
      }
    }
    ev.preventDefault(); ev.stopPropagation();   /* 阻止移动端页面滚动 / 文本选择 */
    moveEl.style.top=(ev.clientY-offY)+'px';
    moveEl.style.left=rect.left+'px';
    const ph=moveEl._ph;
    const sibs=$$(sibSel,container).filter(s=>s!==moveEl&&s!==ph);
    const oldTop=new Map(); sibs.forEach(s=>oldTop.set(s,s.getBoundingClientRect().top));
    let target=null;
    for(const s of sibs){ const r=s.getBoundingClientRect(); if(ev.clientY<r.top+r.height/2){ target=s; break; } }
    if(target) container.insertBefore(ph,target); else container.appendChild(ph);
    sibs.forEach(s=>{ const dy=oldTop.get(s)-s.getBoundingClientRect().top;   /* FLIP：相邻项平滑让位 */
      if(dy){ s.style.transition='none'; s.style.transform='translateY('+dy+'px)';
        requestAnimationFrame(()=>{ s.style.transition='transform .2s ease'; s.style.transform=''; }); } });
  }
  function onUp(ev){
    clearTimeout(longTimer);
    if(!active) return;
    ev.preventDefault();
    const ph=moveEl._ph;
    if(ph&&ph.parentNode){ container.insertBefore(moveEl,ph); ph.remove(); }
    moveEl.classList.remove(isSub?'sub-drag':'group-drag');
    moveEl.style.position=''; moveEl.style.left=''; moveEl.style.top=''; moveEl.style.width=''; moveEl.style.height='';
    moveEl.style.zIndex=''; moveEl.style.pointerEvents=''; moveEl.style.transform='';
    document.body.classList.remove('dragging-active');
    moveEl._ph=null;
    try{ el.releasePointerCapture(e.pointerId); }catch(_){}
    el.removeEventListener('pointermove',onMove);
    el.removeEventListener('pointerup',onUp);
    el.removeEventListener('pointercancel',onUp);
    const order=$$(sibSel,container).map(s=>s.getAttribute(keyAttr)).filter(Boolean);
    if(isSub){ const gk=el.closest('.nav-group').getAttribute('data-g'); if(!A.DB.settings.subOrder) A.DB.settings.subOrder={}; A.DB.settings.subOrder[gk]=order; }
    else { A.DB.settings.navOrder=order; }
    A.save('settings');
  }
  el.addEventListener('pointermove',onMove);
  el.addEventListener('pointerup',onUp);
  el.addEventListener('pointercancel',onUp);
}

  A.redrawCharts=null;   /* 先清空，由视图函数重新注册 */
  try{ (A[n.item.view]||function(p){ p.innerHTML='<div class="card">页面建设中…</div>'; })(pv); }
  catch(e){ pv.innerHTML='<div class="card">页面出错：'+esc(e.message)+'</div>'; console.error(e); }
  pv.classList.add('active'); if(back) pv.classList.add('back');

};

<script>
/* ================= 今日资讯（实时金价 + 可配置指数 + 自动刷新） ================= */
(function(A){
'use strict';
const $=A.$,$$=A.$$,esc=A.esc,num=A.num,today=A.today;

function txQuote(codes){
  return new Promise((resolve,reject)=>{
    if(!codes.length) return resolve({});
    const s=document.createElement('script');
    s.charset='gbk'; let done=false;
    const fin=(f,a)=>{ if(done)return; done=true; clearTimeout(tid); try{s.remove();}catch(e){} f(a); };
    const tid=setTimeout(()=>fin(reject,new Error('行情请求超时')),9000);
    s.onload=()=>{ const out={}; codes.forEach(c=>{ if(window['v_'+c]) out[c]=window['v_'+c]; }); fin(resolve,out); };
    s.onerror=()=>fin(reject,new Error('网络不可用'));
    s.src='https://qt.gtimg.cn/q='+codes.join(',')+'&r='+Date.now();
    document.head.appendChild(s);
  });
}
function parseTx(code,raw){
  if(!raw) return null;
  if(raw.indexOf('~')>0){
    const a=raw.split('~');
    return {name:a[1]||code,code:a[2]||code,price:num(a[3]),prev:num(a[4]),open:num(a[5]),
      time:a[30]||'',chg:num(a[31]),pct:num(a[32]),high:num(a[33]),low:num(a[34])};
  }
  const a=raw.split(',');
  if(a[13]!==undefined) return {name:a[13]||code,code:code,price:num(a[0]),pct:num(a[1]),
      high:num(a[4]),low:num(a[5]),time:a[6]||'',prev:num(a[7]),open:num(a[8])};
  return {name:a[0]||code,code:code,price:num(a[3]),prev:num(a[2]),open:num(a[1]),high:num(a[4]),low:num(a[5]),time:a[6]||''};
}
A.fetchQuotes=async function(force){
  const Q=A.DB.quotes;
  const items=(Q.items||[]).filter(i=>i.on);
  if(!items.length) return;
  if(!force&&Q.lastTime&&(Date.now()-Q.lastTime<20000)) return;
  try{
    const raw=await txQuote(items.map(i=>i.code));
    const ts=Date.now();
    items.forEach(it=>{
      const q=parseTx(it.code,raw[it.code]);
      if(!q) return;
      if(q.chg===undefined||isNaN(q.chg)) q.chg=q.price-q.prev;
      if(q.pct===undefined||isNaN(q.pct)) q.pct=q.prev?(q.price-q.prev)/q.prev*100:0;
      if(!isFinite(q.chg)) q.chg=0; if(!isFinite(q.pct)) q.pct=0;
      if(isFinite(q.price)&&q.price>0){ q.ts=ts; Q.last[it.code]=q; }
    });
    Q.lastTime=ts; A.save('quotes');
  }catch(e){ console.warn('行情获取失败',e); window.__quoteErr=e.message; }
};
function quoteCardHTML(it){
  const Q=A.DB.quotes, q=(Q.last||{})[it.code];
  const mv=Q.manual||{};
  let price='--',pct=0,chg=0,cls='flat',time='暂无数据',extra='';
  if(mv[it.code]!=null&&mv[it.code]!==''){ price=num(mv[it.code]); time='手动填写'; }
  else if(q){ price=q.price; pct=q.pct; chg=q.chg; cls=pct>0?'up':(pct<0?'down':'flat'); time=(q.time||'')+' 更新'; }
  if(it.group==='gold'&&isFinite(price)&&String(it.code).indexOf('hf_')===0){
    extra='<div class="text-sub" style="font-size:12px">≈ ¥'+(price*num(Q.usdcny,7.1)/31.1035).toFixed(2)+' / 克（汇率 '+num(Q.usdcny,7.1)+'）</div>';
  }
  const badge=(it.group!=='gold')?''
    :(it.code==='hf_XAU'?'<span class="qc-badge spot">现货</span>'
    :(it.code==='hf_GC'?'<span class="qc-badge fut">连续</span>':''));
  return '<div class="qcard'+(it.group==='gold'?' gold-card':'')+'">'+
    '<div class="qc-name">'+(it.group==='gold'?'🥇':'📊')+' '+esc(it.name)+badge+'</div>'+
    '<div class="qc-price '+cls+'">'+(isFinite(price)?price.toLocaleString('zh-CN',{maximumFractionDigits:2}):'--')+'</div>'+
    '<div class="qc-chg '+cls+'">'+(q?((pct>0?'▲ +':(pct<0?'▼ ':'— '))+(isFinite(chg)?chg.toFixed(2):'')+'　'+(pct>0?'+':'')+pct.toFixed(2)+'%'):'--')+'</div>'+
    '<div class="qc-time">'+(q?(esc(time)+'　高 '+q.high+' / 低 '+q.low):esc(time))+'</div>'+extra+'</div>';
}
/* 期现价差：COMEX 黄金连续 − 伦敦金现货（两者都在看板上、且都有数据时才显示） */
function goldPairPrice(code){
  const Q=A.DB.quotes, mv=Q.manual||{};
  const it=(Q.items||[]).find(i=>i&&i.code===code&&i.on);
  if(!it) return null;
  let p=null;
  if(mv[code]!=null&&mv[code]!=='') p=num(mv[code]);
  else if(Q.last&&Q.last[code]) p=num(Q.last[code].price);
  return (isFinite(p)&&p>0)?p:null;
}
function goldSpreadHTML(){
  const Q=A.DB.quotes, rate=num(Q.usdcny,7.1), OZ=31.1035;
  const spot=goldPairPrice('hf_XAU'), fut=goldPairPrice('hf_GC');
  if(spot==null||fut==null) return '';
  const d=fut-spot, pct=spot?d/spot*100:0;
  const cls=d>0?'up':(d<0?'down':'flat');
  const g=(p)=>'¥'+(p*rate/OZ).toFixed(2);
  const tag=d>0?'期货升水':(d<0?'期货贴水':'期现持平');
  const tip=d>0?'连续合约价格高于现货，市场偏乐观，愿意为未来多付一点。'
    :(d<0?'连续合约价格低于现货，短期情绪偏谨慎。':'连续与现货几乎一致，市场情绪平稳。');
  return '<div class="gold-spread">'+
    '<div class="gs-h">📐 期现价差<span class="spacer"></span><span class="text-sub" style="font-weight:400">COMEX 黄金连续 − 伦敦金现货</span></div>'+
    '<div class="gs-body">'+
      '<span class="gs-num '+cls+'">'+(d>0?'+':'')+d.toFixed(2)+'</span>'+
      '<span class="text-sub">美元/盎司（'+(pct>0?'+':'')+pct.toFixed(2)+'%）</span>'+
      '<span class="gs-tag">'+tag+'</span>'+
    '</div>'+
    '<div class="text-sub">折合国内克价：现货 '+g(spot)+' / 克　·　连续 '+g(fut)+' / 克（汇率 '+rate+'）</div>'+
    '<div class="text-sub" style="opacity:.85">'+tip+'</div>'+
  '</div>';
}
A.goldSpreadHTML=goldSpreadHTML;
function refreshQuoteArea(){
  $$('.quote-grid').forEach(g=>{ if(g.dataset.group==='gold') g.innerHTML=goldHTML(); else if(g.dataset.group==='index') g.innerHTML=indexHTML(); });

function goldHTML(){ return (A.DB.quotes.items||[]).filter(i=>i.on&&i.group==='gold').map(quoteCardHTML).join(''); }

  '</div>';
  refreshQuoteArea();
  $$('[data-qref]',pv).forEach(b=>b.addEventListener('click',e=>A.refreshQuotes(e.currentTarget)));
  A.fetchQuotes();
  setTimeout(()=>{ if(A.CUR==='news:quote') refreshQuoteArea(); },1600);
};

    '<tr><td>纳斯达克</td><td><code>usIXIC</code></td><td>道琼斯</td><td><code>usDJI</code></td></tr>'+

/* ================= 每日阅读 ================= */
function poemDefaultIdx(poet,d){
  const list=A.POEMS[poet]||[]; const base=new Date(2024,0,1);
  const days=Math.round((A.parseDate(d)-base)/86400000);
  return ((days%list.length)+list.length)%list.length;
}
A.todayPoem=function(){
  const R=A.DB.reading, d=today();
  let poet=R.poet||'libai';
  if(!A.POEMS[poet]) poet='libai';
  if(R.rotate) poet=(poemDefaultIdx('libai',d)%2===0)?'libai':'nalan';
  const list=A.POEMS[poet]||A.POEMS.libai;
  let rec=R.history.find(h=>h.date===d&&h.poet===poet);
  if(!rec){
    rec={date:d,poet:poet,idx:poemDefaultIdx(poet,d)};
    R.history.push(rec); while(R.history.length>400) R.history.shift();
    A.save('reading');
  }
  if(rec.idx>=list.length) rec.idx=0;
  return {poet:poet,idx:rec.idx,poem:list[rec.idx],total:list.length};
};
A.readToday=function(pv){
  const R=A.DB.reading;
  const r=A.todayPoem(), p=A.POETS[r.poet], poem=r.poem;

    '<span class="spacer"></span><button class="btn mini ghost" onclick="App.nextPoem()">🎲 换一首</button>'+
  '</div>'+
  '<div class="poem-card">'+
    '<div class="poem-title">'+esc(poem.t)+'</div>'+
    '<div class="poem-meta">'+esc(p.name)+' · '+esc(p.tag)+'　|　'+today()+' '+A.WEEK[new Date().getDay()]+'　|　第 '+(r.idx+1)+' / '+r.total+' 首</div>'+
    '<div class="poem-body">'+esc(poem.body)+'</div>'+
    '<div class="poem-note"><b>创作背景</b><br>'+esc(poem.bg)+'</div>'+

    '<span class="spacer"></span><span class="text-sub">每天自动换一首，'+r.total+' 首之内不重复</span></div></div>'+
  '<div class="card"><div class="card-h">📚 诗人小传</div><div class="text-sub" style="font-size:14px;line-height:1.9">'+esc(p.desc)+'</div></div>';
};

A.toggleRotate=function(v){ A.DB.reading.rotate=!!v; A.save('reading'); A.render(); };
A.nextPoem=function(){
  const R=A.DB.reading,d=today();
  let poet=R.poet||'libai';
  if(R.rotate) poet=(poemDefaultIdx('libai',d)%2===0)?'libai':'nalan';
  const list=A.POEMS[poet]||A.POEMS.libai;

  function fb(t){ const ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); A.toast('已复制 ✓','ok'); }catch(e){ A.toast('复制失败，请长按选择文本','err'); } ta.remove(); }
};
A.libState={q:'',limit:40};
A.readLib=function(pv){
  const R=A.DB.reading; const poet=A.POEMS[R.poet]?R.poet:'libai';

    '<div class="row" style="margin-bottom:12px"><input type="text" id="libQ" placeholder="🔍 搜标题或诗句" value="'+esc(st.q)+'" style="flex:1;min-width:140px" oninput="App.onLibSearch(this.value)">'+
    '<span class="text-sub">共 '+all.length+' 首'+(q?('，匹配 '+list.length+' 首'):'')+'</span></div>'+
    (shown.length?shown.map(p=>{
      const idx=all.indexOf(p), key=poet+':'+idx, fav=favs.indexOf(key)>=0;

      return '<div class="list-row" style="cursor:pointer" onclick="var b=this.nextElementSibling;var s=b.style.display===\'none\';b.style.display=s?\'block\':\'none\';this.querySelector(\'.tag\').textContent=s?\'收起\':\'展开\'">'+
        '<div class="lr-main"><div class="lr-title">'+(fav?'★ ':'')+esc(p.t)+'</div>'+
        '<div class="lr-sub">'+esc(lines[0])+(lines[1]?' / '+esc(lines[1]):'')+'</div></div>'+
        '<span class="tag'+(fav?'':' b')+'">展开</span></div>'+
        '<div class="card" style="display:none;margin:-6px 0 12px">'+
          '<div class="poem-body" style="font-size:15.5px;line-height:1.95">'+esc(p.body)+'</div>'+
          '<div class="poem-note"><b>创作背景</b><br>'+esc(p.bg)+'</div>'+
          '<div class="row" style="margin-top:12px"><button class="btn mini '+(fav?'danger':'ghost')+'" onclick="App.toggleFav(\''+key+'\')">'+(fav?'★ 取消收藏':'☆ 收藏')+'</button>'+
          '<button class="btn mini ghost" onclick="App.setTodayPoem(\''+poet+'\','+idx+')">设为今日诗词</button></div></div>';
    }).join(''):A.empty(q?'没有找到相关诗词':'这位诗人还没有作品','换个关键词试试，派大星帮你翻翻'))+
    (list.length>st.limit?'<div style="text-align:center"><button class="btn mini ghost" onclick="App.moreLib()">显示更多（还有 '+(list.length-st.limit)+' 首）</button></div>':'')+
  '</div>';
};
A.switchLib=function(v){ A.DB.reading.poet=v; A.DB.reading.rotate=false; A.libState.limit=40; A.save('reading'); A.render(); };
A.onLibSearch=function(v){

A.setTodayPoem=function(poet,i){

})(window.App=window.App||{});

<script>
/* ================= 锻炼计划（含图表 Tooltip 与点击跳转） ================= */
(function(A){
'use strict';
const $=A.$,$$=A.$$,esc=A.esc,num=A.num,today=A.today;
const SPORT_PRESETS=['跑步','快走','健身','瑜伽','拉伸','游泳','骑行','跳绳','羽毛球','乒乓球','篮球','徒步','爬山','椭圆机','动感单车','广场舞','力量训练','HIIT'];
const PIE_COLORS=['#ff8fbe','#a98bf5','#5fb8f7','#ffc96b','#7ed9a8','#ff9f9f','#9ad0f5','#c7a2f0'];

function minutesBetween(a,b){ const x=String(a||'00:00').split(':').map(Number),y=String(b||'00:00').split(':').map(Number);
  let d=(y[0]*60+(y[1]||0))-(x[0]*60+(x[1]||0)); if(d<0) d+=1440; return Math.round(d); }
function weekStart(d){ const x=new Date(d); const day=(x.getDay()+6)%7; x.setDate(x.getDate()-day); x.setHours(0,0,0,0); return x; }
function monthStart(d){ return new Date(d.getFullYear(),d.getMonth(),1); }
function dateStr(d){ return d.getFullYear()+'-'+A.pad(d.getMonth()+1)+'-'+A.pad(d.getDate()); }
function logsInRange(s,e){ const a=dateStr(s),b=dateStr(e); return (A.DB.workouts.logs||[]).filter(l=>l.date>=a&&l.date<=b); }

A.sportToday=function(pv){
  const W=A.DB.workouts,d=today(),wd=new Date().getDay();
  const plan=(W.plan||[]).filter(p=>!p.days||!p.days.length||p.days.indexOf(wd)>=0);
  const done=(W.logs||[]).filter(l=>l.date===d);
  const total=done.reduce((s,l)=>s+num(l.minutes),0);
  const doneNames=done.map(l=>l.name);
  pv.innerHTML=
  (A.progTodayHTML?A.progTodayHTML():'')+
  '<div class="card"><div class="card-h">🏃 今日锻炼计划<span class="spacer"></span><span class="tag">'+A.WEEK[wd]+'</span></div>'+
    (plan.length?plan.map(p=>{
      const ok=doneNames.indexOf(p.name)>=0;
      return '<div class="list-row"><div class="lr-main"><div class="lr-title">'+esc(p.name)+(ok?' <span class="tag g">已完成</span>':'')+'</div>'+
        '<div class="lr-sub">计划 '+esc(p.start||'')+' - '+esc(p.end||'')+'　约 '+minutesBetween(p.start,p.end)+' 分钟'+(p.note?('　'+esc(p.note)):'')+'</div></div>'+
        '<button class="btn mini '+(ok?'ghost':'')+'" onclick="App.checkPlan(\''+p.id+'\')">'+(ok?'再记一次':'打卡')+'</button>'+
        '<button class="btn mini ghost" onclick="App.editPlan(\''+p.id+'\')">改</button></div>';
    }).join(''):A.empty('今天没有安排计划','给自己定个小目标，哪怕只是散步十分钟'))+
    '<div class="row" style="margin-top:6px"><button class="btn mini" onclick="App.editPlan(null)">+ 新增计划</button>'+
    '<button class="btn mini ghost" onclick="App.quickLog()">⚡ 临时记录一次运动</button></div></div>'+
  '<div class="card"><div class="card-h">✅ 今日已完成<span class="spacer"></span><span class="tag'+(total>=30?' g':'')+'">共 '+total+' 分钟</span></div>'+
    (done.length?done.slice().reverse().map(l=>
      '<div class="list-row"><div class="lr-main"><div class="lr-title">'+esc(l.name)+' · '+num(l.minutes)+' 分钟</div>'+
      '<div class="lr-sub">'+esc(l.start||'')+' - '+esc(l.end||'')+(l.note?('　'+esc(l.note)):'')+'</div></div>'+
      '<button class="btn mini ghost" onclick="App.editLog(\''+l.id+'\')">改</button>'+
      '<button class="btn mini danger" onclick="App.delLog(\''+l.id+'\')">删</button></div>').join('')
      :A.empty('今天还没动起来','派大星说：起来走两步也好呀！'))+
  '</div>'+
  '<div class="card"><div class="card-h">📅 本周概览<span class="spacer"></span><button class="btn mini ghost" onclick="App.go(\'sport:week\')">看周报</button></div>'+
    (function(){
      const ws=weekStart(new Date()); const ls=logsInRange(ws,new Date(ws.getTime()+6*864e5));
      const days=[0,0,0,0,0,0,0];
      ls.forEach(l=>{ days[(A.parseDate(l.date).getDay()+6)%7]+=num(l.minutes); });
      const tot=days.reduce((a,b)=>a+b,0);
      const mx=Math.max.apply(null,days.concat([30]));
      return '<div class="row" style="gap:6px;align-items:flex-end">'+days.map((v,i)=>
        '<div style="flex:1;text-align:center"><div class="text-sub" style="font-size:11.5px">'+['一','二','三','四','五','六','日'][i]+'</div>'+
        '<div style="height:'+(8+Math.round(v/mx*52))+'px;border-radius:6px;margin:4px 0;background:linear-gradient(180deg,#ff8fbe,#a98bf5)"></div>'+
        '<div style="font-size:11px" class="text-sub">'+(v||'')+'</div></div>').join('')+'</div>'+
        '<div class="text-sub" style="margin-top:8px">本周已累计 <b style="color:var(--accent)">'+tot+'</b> 分钟，达标（≥30分钟）'+days.filter(v=>v>=30).length+' 天</div>';
    })()+'</div>';
};
A.editPlan=function(id){
  const W=A.DB.workouts;
  const p=id?(W.plan||[]).find(x=>x.id===id):{id:A.uid(),name:'跑步',start:'07:00',end:'07:30',days:[1,2,3,4,5],note:''};
  const dayChk=[1,2,3,4,5,6,0].map(d=>'<label class="chk" style="margin:0 10px 6px 0"><input type="checkbox" class="pdays" value="'+d+'" '+((!p.days||p.days.indexOf(d)>=0)?'checked':'')+'> '+A.WEEK[d]+'</label>').join('');
  A.openModal(id?'修改计划':'新增锻炼计划',
    '<label class="fld"><span>运动项目</span><input type="text" id="pf_name" value="'+esc(p.name)+'" list="sportList"><datalist id="sportList">'+SPORT_PRESETS.map(s=>'<option value="'+s+'">').join('')+'</datalist></label>'+
    '<div class="row"><label class="fld" style="flex:1"><span>开始时间</span><input type="time" id="pf_s" value="'+esc(p.start||'07:00')+'"></label>'+
    '<label class="fld" style="flex:1"><span>结束时间</span><input type="time" id="pf_e" value="'+esc(p.end||'07:30')+'"></label></div>'+
    '<label class="fld"><span>重复日（全不选表示每天）</span><div style="margin-top:4px">'+dayChk+'</div></label>'+
    '<label class="fld"><span>备注</span><input type="text" id="pf_note" value="'+esc(p.note||'')+'" placeholder="例如：小区慢跑 3 公里"></label>'+
    '<div class="row">'+SPORT_PRESETS.slice(0,10).map(s=>'<button type="button" class="btn mini ghost" onclick="document.getElementById(\'pf_name\').value=\''+s+'\'">'+s+'</button>').join('')+'</div>',
    (id?'<button class="btn danger" onclick="App.delPlan(\''+p.id+'\')">删除</button>':'')+
    '<button class="btn ghost" onclick="App.closeModal()">取消</button><button class="btn" onclick="App.modalOK()">保存</button>',
    ()=>{
      const name=$('#pf_name').value.trim(); if(!name){ A.toast('请填写运动项目','err'); return false; }
      const days=$$('.pdays').filter(x=>x.checked).map(x=>Number(x.value));
      const o={id:p.id,name:name,start:$('#pf_s').value,end:$('#pf_e').value,days:days,note:$('#pf_note').value.trim()};
      W.plan=W.plan||[];
      const i=W.plan.findIndex(x=>x.id===p.id); if(i>=0) W.plan[i]=o; else W.plan.push(o);
      A.save('workouts'); A.closeModal(); A.render(); A.toast('计划已保存','ok');
    });
};
A.delPlan=function(id){ A.DB.workouts.plan=(A.DB.workouts.plan||[]).filter(x=>x.id!==id); A.save('workouts'); A.closeModal(); A.render(); A.toast('已删除'); };
A.checkPlan=function(id){ const p=(A.DB.workouts.plan||[]).find(x=>x.id===id); if(p) logDialog({name:p.name,start:p.start,end:p.end,date:today(),note:p.note||''}); };
A.quickLog=function(){ logDialog({name:'跑步',start:A.nowHM(),end:A.nowHM(),date:today(),note:''}); };
function logDialog(l){
  const isNew=!l.id;
  A.openModal(isNew?'记录一次运动':'修改运动记录',
    '<label class="fld"><span>运动项目</span><input type="text" id="lf_name" value="'+esc(l.name)+'" list="sportList2"><datalist id="sportList2">'+SPORT_PRESETS.map(s=>'<option value="'+s+'">').join('')+'</datalist></label>'+
    '<label class="fld"><span>日期</span><input type="date" id="lf_date" value="'+esc(l.date)+'"></label>'+
    '<div class="row"><label class="fld" style="flex:1"><span>开始时间</span><input type="time" id="lf_s" value="'+esc(l.start||'')+'"></label>'+
    '<label class="fld" style="flex:1"><span>结束时间</span><input type="time" id="lf_e" value="'+esc(l.end||'')+'"></label></div>'+
    '<label class="fld"><span>时长（分钟，填了时间段会自动算）</span><input type="number" id="lf_min" value="'+num(l.minutes,0)+'"></label>'+
    '<label class="fld"><span>备注</span><input type="text" id="lf_note" value="'+esc(l.note||'')+'"></label>',
    '<button class="btn ghost" onclick="App.closeModal()">取消</button><button class="btn" onclick="App.modalOK()">保存</button>',
    ()=>{
      const name=$('#lf_name').value.trim(); if(!name){ A.toast('请填写运动项目','err'); return false; }
      const s=$('#lf_s').value,e=$('#lf_e').value;
      let min=num($('#lf_min').value,0);

      if(!min||min<=0){ A.toast('请填写时间段或时长','err'); return false; }
      const o={id:l.id||A.uid(),name:name,date:$('#lf_date').value||today(),start:s,end:e,minutes:min,note:$('#lf_note').value.trim()};
      A.DB.workouts.logs=A.DB.workouts.logs||[];
      const i=A.DB.workouts.logs.findIndex(x=>x.id===o.id);
      if(i>=0) A.DB.workouts.logs[i]=o; else A.DB.workouts.logs.push(o);
      A.save('workouts'); A.closeModal(); A.render();
      A.toast(min>=30?('太棒了，'+min+' 分钟！'):('已记录 '+min+' 分钟'),'ok');
      if(min>=30) A.petSay('厉害！'+min+' 分钟，你今天超棒！');

    });
}
A.editLog=function(id){ const l=(A.DB.workouts.logs||[]).find(x=>x.id===id); if(l) logDialog(Object.assign({},l)); };
A.delLog=function(id){ A.confirmBox('删除记录','确定删除这条运动记录吗？',()=>{ A.DB.workouts.logs=A.DB.workouts.logs.filter(x=>x.id!==id); A.save('workouts'); A.render(); A.toast('已删除'); },'删除'); };
A.jumpToLog=function(date){
  A.focusDate=date; A.go('sport:log');
  setTimeout(()=>{ const el=$('#logD'+date); if(el){ el.scrollIntoView({behavior:'smooth',block:'center'}); el.style.boxShadow='0 0 0 2px var(--accent)';
    setTimeout(()=>{ el.style.transition='box-shadow .8s'; el.style.boxShadow=''; },1600); } },350);
};
A.sportLog=function(pv){
  const logs=(A.DB.workouts.logs||[]).slice().sort((a,b)=>a.date<b.date?1:(a.date>b.date?-1:0));
  const byDate={}; logs.forEach(l=>{ (byDate[l.date]=byDate[l.date]||[]).push(l); });
