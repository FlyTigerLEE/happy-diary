  '<div class="card"><div class="card-h">📋 运动记录<span class="spacer"></span><button class="btn mini" onclick="App.quickLog()">+ 补记一次</button></div>'+
    '<div class="row" style="margin-bottom:12px"><span class="tag">共 '+logs.length+' 次</span><span class="tag g">累计 '+all+' 分钟</span><span class="tag b">约 '+(all/60).toFixed(1)+' 小时</span>'+
    (A.focusDate?'<span class="tag">已定位 '+A.focusDate+'</span>':'')+'</div>'+
    (dates.length?dates.slice(0,90).map(d=>{
      const arr=byDate[d],sum=arr.reduce((s,l)=>s+num(l.minutes),0);
      return '<div id="logD'+d+'" style="margin-bottom:14px;border-radius:12px;padding:2px">'+
        '<div class="row" style="margin-bottom:6px"><b>'+d+'</b> <span class="text-sub">'+A.WEEK[A.parseDate(d).getDay()]+'</span>'+
        '<span class="spacer"></span><span class="tag g">'+sum+' 分钟</span></div>'+
        arr.map(l=>'<div class="list-row"><div class="lr-main"><div class="lr-title">'+esc(l.name)+'</div>'+
          '<div class="lr-sub">'+esc(l.start||'')+(l.end?(' - '+esc(l.end)):'')+'　'+num(l.minutes)+' 分钟'+(l.note?('　'+esc(l.note)):'')+'</div></div>'+
          '<button class="btn mini ghost" onclick="App.editLog(\''+l.id+'\')">改</button>'+
          '<button class="btn mini danger" onclick="App.delLog(\''+l.id+'\')">删</button></div>').join('')+'</div>';
    }).join(''):A.empty('还没有运动记录','记下第一次，派大星想看你流汗的样子'))+
  '</div>';
};
function statBlock(logs,days){
  const total=logs.reduce((s,l)=>s+num(l.minutes),0);
  const byName={}; logs.forEach(l=>{ byName[l.name]=(byName[l.name]||0)+num(l.minutes); });
  const rank=Object.keys(byName).map(k=>({name:k,value:byName[k]})).sort((a,b)=>b.value-a.value);
  const ad={}; logs.forEach(l=>ad[l.date]=1);
  return {total:total,count:logs.length,rank:rank,act:Object.keys(ad).length,days:days,avg:days?(total/days).toFixed(1):0};
}
A.sportWeek=function(pv){
  const ws=weekStart(new Date()),we=new Date(ws.getTime()+6*864e5);
  const logs=logsInRange(ws,we);
  const days=[0,0,0,0,0,0,0]; const dayDates=[];
  for(let i=0;i<7;i++) dayDates.push(dateStr(new Date(ws.getTime()+i*864e5)));
  logs.forEach(l=>{ days[(A.parseDate(l.date).getDay()+6)%7]+=num(l.minutes); });
  const st=statBlock(logs,7);
  const prev=logsInRange(new Date(ws.getTime()-7*864e5),new Date(ws.getTime()-864e5));
  const pt=prev.reduce((s,l)=>s+num(l.minutes),0), diff=st.total-pt;
  const labels=['周一','周二','周三','周四','周五','周六','周日'];
  pv.innerHTML=
  '<div class="card"><div class="card-h">📊 运动周报<span class="spacer"></span><span class="text-sub">'+dateStr(ws)+' ~ '+dateStr(we)+'</span></div>'+
    '<div class="grid g4 keep2" style="margin-bottom:14px">'+
      '<div class="stat-box"><div style="font-size:22px;font-weight:800;color:var(--accent)">'+st.total+'</div><div class="text-sub">本周总时长(分)</div></div>'+
      '<div class="stat-box"><div style="font-size:22px;font-weight:800;color:var(--accent-2)">'+st.count+'</div><div class="text-sub">运动次数</div></div>'+
      '<div class="stat-box"><div style="font-size:22px;font-weight:800;color:var(--accent-3)">'+st.act+'</div><div class="text-sub">运动天数</div></div>'+
      '<div class="stat-box"><div style="font-size:22px;font-weight:800;color:'+(diff>=0?'var(--up)':'var(--down)')+'">'+(diff>=0?'+':'')+diff+'</div><div class="text-sub">较上周(分)</div></div>'+
    '</div>'+
    '<div class="chart-box"><canvas id="cvWeek"></canvas><div class="chart-hint">👆 悬停看数值，点柱子看当天记录</div></div>'+
    '<div class="legend"><span><i style="background:#ff8fbe"></i>每日运动时长（分钟）</span><span>目标：每天 30 分钟</span></div></div>'+
  '<div class="card"><div class="card-h">🏅 项目分布</div><div class="chart-box" style="height:200px"><canvas id="cvWeekPie"></canvas></div></div>'+
  '<div class="card"><div class="card-h">📝 本周小结</div><div class="text-sub" style="font-size:14px;line-height:2">'+
    '本周共运动 <b style="color:var(--accent)">'+st.count+'</b> 次、<b style="color:var(--accent)">'+st.total+'</b> 分钟，平均每天 '+st.avg+' 分钟。'+
    (st.rank.length?('花时间最多的是 <b>'+esc(st.rank[0].name)+'</b>（'+st.rank[0].value+' 分钟）。'):'')+
    (st.act>=5?'坚持得非常好，派大星给你鼓掌 👏':(st.act>=3?'节奏不错，再稳定一点就更棒了！':'这周有点偷懒哦，下周从 10 分钟开始也行 🌱'))+
  '</div></div>';
  A.redrawCharts=function(force){
    const cv=$('#cvWeek');
    if(cv) A.chart(cv,'bar',{labels:labels,data:days,min:30},{
      tipFmt:h=>'周'+labels[h.i].slice(1)+'　<b>'+h.v+'</b> 分钟'+(h.v>=30?' ✓':' · 未达标'),
      onClick:h=>{ if(days[h.i]>0) A.jumpToLog(dayDates[h.i]); else { A.focusDate=null; A.go('sport:log'); } },
      force:force});
    const cp=$('#cvWeekPie');
    if(cp) A.chart(cp,'pie',{items:st.rank.map((r,i)=>({name:r.name,value:r.value,color:PIE_COLORS[i%PIE_COLORS.length]}))},{
      tipFmt:h=>'<b>'+esc(h.item.name)+'</b>　'+h.item.value+' 分钟',
      onClick:h=>A.go('sport:log'),force:force});
  };
  A.redrawCharts();
};
A.sportMonth=function(pv){
  const now=new Date(),ms=monthStart(now),me=new Date(now.getFullYear(),now.getMonth()+1,0);
  const logs=logsInRange(ms,me);
  const dc=me.getDate(),arr=new Array(dc).fill(0);
  logs.forEach(l=>{ arr[A.parseDate(l.date).getDate()-1]+=num(l.minutes); });
  const st=statBlock(logs,dc);
  let streak=0,best=0; arr.forEach(v=>{ if(v>0){streak++;best=Math.max(best,streak);} else streak=0; });
  const dates=arr.map((_,i)=>dateStr(new Date(now.getFullYear(),now.getMonth(),i+1)));
  pv.innerHTML=
  '<div class="card"><div class="card-h">📈 运动月报<span class="spacer"></span><span class="text-sub">'+now.getFullYear()+' 年 '+(now.getMonth()+1)+' 月</span></div>'+
    '<div class="grid g4 keep2" style="margin-bottom:14px">'+
      '<div class="stat-box"><div style="font-size:22px;font-weight:800;color:var(--accent)">'+st.total+'</div><div class="text-sub">本月总时长(分)</div></div>'+
      '<div class="stat-box"><div style="font-size:22px;font-weight:800;color:var(--accent-2)">'+st.act+'</div><div class="text-sub">运动天数</div></div>'+
      '<div class="stat-box"><div style="font-size:22px;font-weight:800;color:var(--accent-3)">'+st.avg+'</div><div class="text-sub">日均(分)</div></div>'+
      '<div class="stat-box"><div style="font-size:22px;font-weight:800;color:var(--warn)">'+best+'</div><div class="text-sub">最长连续(天)</div></div>'+
    '</div>'+
    '<div class="chart-box"><canvas id="cvMonth"></canvas><div class="chart-hint">👆 悬停看数值，点圆点看当天记录</div></div>'+
    '<div class="legend"><span><i style="background:#ff6fa5"></i>每日运动时长（分钟）</span></div></div>'+
  '<div class="card"><div class="card-h">🏅 项目分布</div><div class="chart-box" style="height:200px"><canvas id="cvMonthPie"></canvas></div></div>'+
  '<div class="card"><div class="card-h">📝 月度小结</div><div class="text-sub" style="font-size:14px;line-height:2">'+
    '本月累计 <b style="color:var(--accent)">'+st.total+'</b> 分钟（约 '+(st.total/60).toFixed(1)+' 小时），出勤 '+st.act+'/'+dc+' 天，出勤率 '+(st.act/dc*100).toFixed(0)+'%。'+
    (st.rank.length?('最爱的是 <b>'+esc(st.rank[0].name)+'</b>。'):'')+
    (best>=7?('连续 '+best+' 天的记录太硬核了 🔥'):(st.act>=15?'这个月的你非常自律 ✨':'下个月试着每周多动一次，慢慢来 🌸'))+
  '</div></div>';
  A.redrawCharts=function(force){
    const cv=$('#cvMonth');
    if(cv) A.chart(cv,'line',{labels:arr.map((_,i)=>String(i+1)),datasets:[{data:arr,color:'#ff6fa5'}]},{
      tipFmt:h=>today2(h.i)+'　<b>'+h.v+'</b> 分钟',
      onClick:h=>{ if(arr[h.i]>0) A.jumpToLog(dates[h.i]); else { A.focusDate=null; A.go('sport:log'); } },
      force:force});
    const cp=$('#cvMonthPie');
    if(cp) A.chart(cp,'pie',{items:st.rank.map((r,i)=>({name:r.name,value:r.value,color:PIE_COLORS[i%PIE_COLORS.length]}))},{
      tipFmt:h=>'<b>'+esc(h.item.name)+'</b>　'+h.item.value+' 分钟',onClick:h=>A.go('sport:log'),force:force});
  };
  function today2(i){ return (now.getMonth()+1)+'月'+(i+1)+'日 '+A.WEEK[A.parseDate(dates[i]).getDay()]; }
  A.redrawCharts();
};
})(window.App=window.App||{});
</script>

<script>
/* ================= 待办事项（优先级 / 分类筛选） · 生日 · 个人资料 ================= */
(function(A){
'use strict';
const $=A.$,$$=A.$$,esc=A.esc,num=A.num,today=A.today;
const LEVELS={high:{t:'重要紧急',c:'o'},mid:{t:'正常',c:'b'},low:{t:'有空再做',c:''}};
A.todoFilter={level:'all',tag:'all',q:''};

function todoSorted(list,onlyDone){
  const arr=list.filter(t=>!!t.done===!!onlyDone);
  return arr.sort((a,b)=>{
    const lv={high:0,mid:1,low:2};
    if(a.done&&b.done) return (b.doneAt||0)-(a.doneAt||0);
    if((a.due||'9')!==(b.due||'9')) return (a.due||'9999')<(b.due||'9999')?-1:1;
    return (lv[a.level]||1)-(lv[b.level]||1);
  });
}
function todoRow(t){
  const L=LEVELS[t.level]||LEVELS.mid;
  const over=!t.done&&t.due&&t.due<today();
  return '<div class="list-row'+(t.done?' done':'')+'">'+
    '<input type="checkbox" '+(t.done?'checked':'')+' onchange="App.toggleTodo(\''+t.id+'\')" style="width:19px;height:19px;accent-color:var(--accent)">'+
    '<div class="lr-main"><div class="lr-title">'+esc(t.text)+'</div>'+
    '<div class="lr-sub">'+(t.due?('📅 '+t.due+(over?' <span style="color:var(--up)">已逾期</span>':'')):'')+
    (t.tag?('　🏷 '+esc(t.tag)):'')+'　<span class="tag '+L.c+'">'+L.t+'</span></div></div>'+
    '<button class="btn mini ghost" onclick="App.editTodo(\''+t.id+'\')">改</button>'+
    '<button class="btn mini danger" onclick="App.delTodo(\''+t.id+'\')">删</button></div>';
}
function filterBarHTML(all){
  const f=A.todoFilter;
  const tags=[]; (all||[]).forEach(t=>{ if(t.tag&&tags.indexOf(t.tag)<0) tags.push(t.tag); });
  const lv=[['all','全部'],['high','重要紧急'],['mid','正常'],['low','有空再做']];
  return '<div class="row" style="gap:6px;margin-bottom:10px">'+
    lv.map(x=>'<button class="btn mini '+(f.level===x[0]?'':'ghost')+'" onclick="App.setTodoFilter(\'level\',\''+x[0]+'\')">'+x[1]+'</button>').join('')+
    (tags.length?'<span style="width:8px"></span>':'')+
    tags.map(t=>'<button class="btn mini '+(f.tag===t?'':'ghost')+'" onclick="App.setTodoFilter(\'tag\',\''+esc(t).replace(/'/g,"")+'\')">🏷 '+esc(t)+'</button>').join('')+
    (f.tag!=='all'?'<button class="btn mini ghost" onclick="App.setTodoFilter(\'tag\',\'all\')">✕ 清除分类</button>':'')+
    '</div>';
}
function applyFilter(list){
  const f=A.todoFilter;
  return list.filter(t=>{
    if(f.level!=='all'&&(t.level||'mid')!==f.level) return false;
    if(f.tag!=='all'&&(t.tag||'')!==f.tag) return false;
    if(f.q&&t.text.toLowerCase().indexOf(f.q.toLowerCase())<0) return false;
    return true;
  });
}
A.setTodoFilter=function(k,v){ A.todoFilter[k]=v; A.render(); };
A.onTodoSearch=function(v){
  A.todoFilter.q=v;
  const el=$('#td_q'); const pos=el?el.selectionStart:0;
  A.render();
  const ne=$('#td_q'); if(ne){ ne.focus(); try{ ne.setSelectionRange(pos,pos); }catch(e){} }
};
A.todoAll=function(pv){
  const all=A.DB.todos||[];
  const undone=todoSorted(applyFilter(all),false);
  const done=all.filter(t=>t.done).length;
  const overdue=all.filter(t=>!t.done&&t.due&&t.due<today()).length;
  const pct=all.length?Math.round(done/all.length*100):0;
  const filtered=(A.todoFilter.level!=='all'||A.todoFilter.tag!=='all'||A.todoFilter.q);
  pv.innerHTML=
  '<div class="card"><div class="card-h">✅ 待办事项<span class="spacer"></span><span class="text-sub">'+done+' / '+all.length+' 已完成</span></div>'+
    '<div class="bar" style="margin-bottom:12px"><i style="width:'+pct+'%"></i></div>'+
    '<div class="row" style="margin-bottom:10px">'+
      '<input type="text" id="td_text" placeholder="要做什么？回车添加" style="flex:2;min-width:150px" onkeydown="if(event.key===\'Enter\')App.addTodo(this)">'+
      '<select id="td_level" style="width:auto"><option value="mid">正常</option><option value="high">重要紧急</option><option value="low">有空再做</option></select>'+
      '<input type="date" id="td_due" style="width:auto" title="截止日期">'+
      '<input type="text" id="td_tag" placeholder="分类" style="width:96px">'+
      '<button class="btn" onclick="App.addTodo(this)">添加</button></div>'+
    '<div class="row" style="gap:6px;margin-bottom:10px"><input type="text" id="td_q" placeholder="🔍 搜索待办" value="'+esc(A.todoFilter.q)+'" style="flex:1;min-width:120px" oninput="App.onTodoSearch(this.value)">'+
      '<span class="tag">未完成 '+all.filter(t=>!t.done).length+'</span>'+
      (overdue?'<span class="tag o">逾期 '+overdue+'</span>':'')+
      '<span class="tag g">已完成 '+done+'</span></div>'+
    filterBarHTML(all)+
    (filtered?'<div class="text-sub" style="margin-bottom:8px">筛选中：共 '+undone.length+' 条匹配　<button class="btn mini ghost" onclick="App.clearTodoFilter()">清除筛选</button></div>':'')+
    (undone.length?undone.map(todoRow).join(''):A.empty(filtered?'没有符合条件的待办':'待办都清空啦，去晒晒太阳吧！','派大星：空空的清单，是最好的清单'))+
  '</div>';
};
A.clearTodoFilter=function(){ A.todoFilter={level:'all',tag:'all',q:''}; A.render(); };
A.todoDone=function(pv){
  const done=todoSorted(A.DB.todos||[],true);
  pv.innerHTML=
  '<div class="card"><div class="card-h">🏆 已完成<span class="spacer"></span><span class="text-sub">共 '+done.length+' 条</span></div>'+
    (done.length?done.map(todoRow).join(''):A.empty('还没有完成的事项','从完成一件小事开始，派大星等你'))+
  '</div>'+
  (done.length?'<div class="card"><button class="btn mini danger" onclick="App.clearDone()">🗑 清空已完成</button></div>':'');
};
A.addTodo=function(btn){
  A.withLoading(btn,async()=>{
    const text=$('#td_text').value.trim(); if(!text){ A.toast('先写点什么吧','err'); return; }
    A.DB.todos.push({id:A.uid(),text:text,level:$('#td_level').value,due:$('#td_due').value||'',
      tag:$('#td_tag').value.trim(),done:false,createdAt:Date.now()});
    A.save('todos'); A.render(); A.toast('已添加','ok');
  });
};
A.toggleTodo=function(id){
  const t=A.DB.todos.find(x=>x.id===id); if(!t) return;
  t.done=!t.done; t.doneAt=t.done?Date.now():0; A.save('todos');
  if(t.done){ A.toast('完成一项，真棒！','ok'); if(Math.random()<0.5) A.petSay('又搞定一件，你真厉害！'); }
  A.render();
};
A.delTodo=function(id){ A.DB.todos=A.DB.todos.filter(x=>x.id!==id); A.save('todos'); A.render(); A.toast('已删除'); };
A.clearDone=function(){ A.confirmBox('清空已完成','确定清空所有已完成事项吗？',()=>{ A.DB.todos=A.DB.todos.filter(t=>!t.done); A.save('todos'); A.render(); A.toast('已清空'); },'清空'); };
A.editTodo=function(id){
  const t=A.DB.todos.find(x=>x.id===id); if(!t) return;
  A.openModal('编辑待办',
    '<label class="fld"><span>内容</span><input type="text" id="ef_text" value="'+esc(t.text)+'"></label>'+
    '<label class="fld"><span>优先级</span><select id="ef_level">'+
      '<option value="high"'+(t.level==='high'?' selected':'')+'>重要紧急</option>'+
      '<option value="mid"'+(t.level==='mid'?' selected':'')+'>正常</option>'+
      '<option value="low"'+(t.level==='low'?' selected':'')+'>有空再做</option></select></label>'+
    '<label class="fld"><span>截止日期</span><input type="date" id="ef_due" value="'+esc(t.due||'')+'"></label>'+
    '<label class="fld"><span>分类</span><input type="text" id="ef_tag" value="'+esc(t.tag||'')+'"></label>',
    '<button class="btn ghost" onclick="App.closeModal()">取消</button><button class="btn" onclick="App.modalOK()">保存</button>',
    ()=>{ t.text=$('#ef_text').value.trim()||t.text; t.level=$('#ef_level').value; t.due=$('#ef_due').value;
      t.tag=$('#ef_tag').value.trim(); A.save('todos'); A.render(); A.toast('已保存','ok'); });
};

/* ================= 生日提醒 ================= */
function nextBirthday(ds){
  const now=new Date(); now.setHours(0,0,0,0);
  const b=A.parseDate(ds);
  let next=new Date(now.getFullYear(),b.getMonth(),b.getDate());
  if(next.getTime()<now.getTime()) next=new Date(now.getFullYear()+1,b.getMonth(),b.getDate());
  return {next:next,days:Math.round((next-now)/864e5),age:next.getFullYear()-b.getFullYear()};
}
A.nextBirthday=nextBirthday;
A.bdayList=function(pv){
  const list=(A.DB.birthdays||[]).slice().map(b=>Object.assign({},b,{nb:nextBirthday(b.date)})).sort((a,b)=>a.nb.days-b.nb.days);
  pv.innerHTML=
  '<div class="card"><div class="card-h">🎂 生日提醒<span class="spacer"></span><button class="btn mini" onclick="App.editBday(null)">+ 新增</button></div>'+
    (list.length?list.map(b=>{
      const d=b.nb.days, cls=d===0?'':(d<=7?'o':(d<=30?'b':''));
      return '<div class="list-row"'+(d===0?' style="background:linear-gradient(135deg,#fff2d9,#ffe9f2);border-color:#f6dba8"':'')+'>'+
        '<div style="width:46px;text-align:center;flex:0 0 46px"><div style="font-size:20px;font-weight:800;color:'+(d<=7?'var(--accent)':'var(--text)')+'">'+(d===0?'🎉':d)+'</div>'+
        '<div class="text-sub" style="font-size:10.5px">'+(d===0?'就是今天':'天后')+'</div></div>'+
        '<div class="lr-main"><div class="lr-title">'+esc(b.name)+' <span class="tag '+cls+'">满 '+b.nb.age+' 岁</span></div>'+
        '<div class="lr-sub">🎂 '+esc(b.date)+'　'+A.WEEK[b.nb.next.getDay()]+(b.relation?('　'+esc(b.relation)):'')+(b.note?('　'+esc(b.note)):'')+'</div></div>'+
        '<button class="btn mini ghost" onclick="App.editBday(\''+b.id+'\')">改</button>'+
        '<button class="btn mini danger" onclick="App.delBday(\''+b.id+'\')">删</button></div>';
    }).join(''):A.empty('还没有添加好友生日','记下重要的人，派大星会帮你倒数'))+
  '</div>'+
  '<div class="card"><div class="card-h">💡 小贴士</div><div class="text-sub" style="line-height:1.9">按距离下次生日的天数自动排序；7 天内金色高亮，30 天内蓝色标记。首页概览会显示最近的一个生日。</div></div>';
};
A.editBday=function(id){
  const b=id?(A.DB.birthdays||[]).find(x=>x.id===id):{id:A.uid(),name:'',date:'',relation:'',note:''};
  A.openModal(id?'编辑生日':'新增生日',
    '<label class="fld"><span>姓名</span><input type="text" id="bf_name" value="'+esc(b.name)+'" placeholder="小明"></label>'+
    '<label class="fld"><span>生日日期（公历）</span><input type="date" id="bf_date" value="'+esc(b.date)+'"></label>'+
    '<label class="fld"><span>关系</span><input type="text" id="bf_rel" value="'+esc(b.relation||'')+'" placeholder="好友 / 家人 / 同事"></label>'+
    '<label class="fld"><span>备注</span><input type="text" id="bf_note" value="'+esc(b.note||'')+'" placeholder="喜欢什么礼物？"></label>',
    '<button class="btn ghost" onclick="App.closeModal()">取消</button><button class="btn" onclick="App.modalOK()">保存</button>',
    ()=>{
      const name=$('#bf_name').value.trim(),date=$('#bf_date').value;
      if(!name||!date){ A.toast('姓名和日期都要填','err'); return false; }
      const o={id:b.id,name:name,date:date,relation:$('#bf_rel').value.trim(),note:$('#bf_note').value.trim()};
      A.DB.birthdays=A.DB.birthdays||[];
      const i=A.DB.birthdays.findIndex(x=>x.id===o.id);
      if(i>=0) A.DB.birthdays[i]=o; else A.DB.birthdays.push(o);
      A.save('birthdays'); A.render(); A.toast('已保存','ok');
    });
};
A.delBday=function(id){ A.confirmBox('删除','确定删除这条生日提醒吗？',()=>{ A.DB.birthdays=A.DB.birthdays.filter(x=>x.id!==id); A.save('birthdays'); A.render(); A.toast('已删除'); },'删除'); };

/* ================= 个人资料 / 体重曲线 ================= */
A.meInfo=function(pv){
  const p=A.DB.profile;
  pv.innerHTML=
  '<div class="card"><div class="card-h">👤 基本资料</div>'+
    '<div class="row"><label class="fld" style="flex:1;min-width:130px"><span>昵称</span><input type="text" id="pf_nick" value="'+esc(p.nickname||'')+'"></label>'+
    '<label class="fld" style="flex:1;min-width:110px"><span>性别</span><select id="pf_gender"><option value="">不填</option>'+
    '<option value="女"'+(p.gender==='女'?' selected':'')+'>女</option><option value="男"'+(p.gender==='男'?' selected':'')+'>男</option></select></label></div>'+
    '<div class="row">'+
    '<label class="fld" style="flex:1;min-width:130px"><span>出生日期</span><input type="date" id="pf_birth" value="'+esc(p.birthday||'')+'"></label>'+
    '<label class="fld" style="flex:1;min-width:110px"><span>身高 (cm)</span><input type="number" step="0.5" id="pf_h" value="'+num(p.height,0)+'"></label>'+
    '<label class="fld" style="flex:1;min-width:110px"><span>目标体重 (kg)</span><input type="number" step="0.1" id="pf_tw" value="'+num(p.targetWeight,0)+'"></label></div>'+
    '<button class="btn" onclick="App.saveProfile(this)">保存资料</button></div>'+
  '<div class="card"><div class="card-h">📊 身体数据速览</div>'+
    (function(){
      const ws=(p.weights||[]).slice().sort((a,b)=>a.date<b.date?-1:1);
      if(!ws.length) return A.empty('还没有体重记录','去“体重管理”称一下，派大星给你画曲线');
      const last=ws[ws.length-1],first=ws[0];
      const kg=num(last.kg),h=num(p.height,0)/100,bmi=h>0?(kg/(h*h)):0,diff=kg-num(first.kg);
      return '<div class="grid g3 keep2">'+
        '<div class="stat-box"><div style="font-size:23px;font-weight:800;color:var(--accent)">'+kg.toFixed(1)+'</div><div class="text-sub">最新体重 (kg)</div></div>'+
        '<div class="stat-box"><div style="font-size:23px;font-weight:800;color:'+(diff<=0?'var(--down)':'var(--up)')+'">'+(diff>0?'+':'')+diff.toFixed(1)+'</div><div class="text-sub">累计变化 (kg)</div></div>'+
        '<div class="stat-box"><div style="font-size:23px;font-weight:800;color:var(--accent-2)">'+(bmi?bmi.toFixed(1):'--')+'</div><div class="text-sub">BMI'+(bmi?('（'+(bmi<18.5?'偏瘦':(bmi<24?'正常':(bmi<28?'偏胖':'偏重')))+'）'):'')+'</div></div>'+
        '</div><div class="text-sub" style="margin-top:10px">记录时间：'+esc(last.date)+'　共 '+ws.length+' 条记录</div>';
    })()+'</div>';
};
A.saveProfile=function(btn){
  A.withLoading(btn,async()=>{
    const p=A.DB.profile;
    p.nickname=$('#pf_nick').value.trim(); p.gender=$('#pf_gender').value; p.birthday=$('#pf_birth').value;
    p.height=num($('#pf_h').value,0); p.targetWeight=num($('#pf_tw').value,0);
    A.save('profile'); A.toast('资料已保存','ok'); A.render();
  });
};
A.meWeight=function(pv){
  const ws=(A.DB.profile.weights||[]).slice().sort((a,b)=>a.date<b.date?-1:1);
  const target=num(A.DB.profile.targetWeight,0);
  const vals=ws.map(w=>num(w.kg));
  const last=vals.length?vals[vals.length-1]:0,min=vals.length?Math.min.apply(null,vals):0,max=vals.length?Math.max.apply(null,vals):0;
  pv.innerHTML=
  '<div class="card"><div class="card-h">⚖️ 体重管理<span class="spacer"></span><button class="btn mini" onclick="App.editWeight(null)">+ 记录体重</button></div>'+
    '<div class="row" style="margin-bottom:12px;gap:8px">'+
      '<span class="tag">最新 '+(last?last.toFixed(1):'--')+' kg</span>'+
      '<span class="tag g">最低 '+(min?min.toFixed(1):'--')+'</span>'+
      '<span class="tag o">最高 '+(max?max.toFixed(1):'--')+'</span>'+
      '<span class="tag b">目标 '+(target?target.toFixed(1):'未设')+' kg</span>'+
      (last&&target?('<span class="tag">距目标 '+Math.abs(last-target).toFixed(1)+' kg</span>'):'')+'</div>'+
    (ws.length?'<div class="chart-box"><canvas id="cvW"></canvas><div class="chart-hint">👆 点圆点可修改那次记录</div></div>'+
      '<div class="legend"><span><i style="background:#ff6fa5"></i>体重（kg）</span>'+(target?'<span><i style="background:#a98bf5"></i>目标线</span>':'')+'</div>'
      :A.empty('还没有体重记录','称一次，曲线就从这里开始生长'))+
  '</div>'+
  '<div class="card"><div class="card-h">📋 记录明细</div>'+
    (ws.length?ws.slice().reverse().slice(0,60).map(w=>
      '<div class="list-row" id="wrow'+w.id+'"><div class="lr-main"><div class="lr-title">'+num(w.kg).toFixed(1)+' kg</div>'+
      '<div class="lr-sub">'+esc(w.date)+' '+A.WEEK[A.parseDate(w.date).getDay()]+(w.note?('　'+esc(w.note)):'')+'</div></div>'+
      '<button class="btn mini ghost" onclick="App.editWeight(\''+w.id+'\')">改</button>'+
      '<button class="btn mini danger" onclick="App.delWeight(\''+w.id+'\')">删</button></div>').join('')
      :'<div class="empty" style="padding:12px">暂无记录</div>')+'</div>';
  if(ws.length){
    A.redrawCharts=function(force){
      const cv=$('#cvW'); if(!cv) return;
      A.chart(cv,'line',{labels:ws.map(w=>w.date.slice(5)),datasets:[{data:vals,color:'#ff6fa5'}],target:target||null,targetLabel:target?target.toFixed(1)+'kg':''},{
        tipFmt:h=>esc(ws[h.i].date)+'　<b>'+h.v.toFixed(1)+'</b> kg',
        onClick:h=>A.editWeight(ws[h.i].id),
        force:force});
    };
    A.redrawCharts();
  }
};
A.editWeight=function(id){
  const w=id?(A.DB.profile.weights||[]).find(x=>x.id===id):{id:A.uid(),date:today(),kg:'',note:''};
  A.openModal(id?'修改记录':'记录体重',
    '<label class="fld"><span>日期</span><input type="date" id="wf_date" value="'+esc(w.date)+'"></label>'+
    '<label class="fld"><span>体重 (kg)</span><input type="number" step="0.1" id="wf_kg" value="'+esc(w.kg)+'" placeholder="例如 55.5"></label>'+
    '<label class="fld"><span>备注</span><input type="text" id="wf_note" value="'+esc(w.note||'')+'" placeholder="早上空腹 / 今天吃多了"></label>',
    '<button class="btn ghost" onclick="App.closeModal()">取消</button><button class="btn" onclick="App.modalOK()">保存</button>',
    ()=>{
      const kg=num($('#wf_kg').value,0); if(!kg){ A.toast('请填写体重','err'); return false; }
      const o={id:w.id,date:$('#wf_date').value||today(),kg:kg,note:$('#wf_note').value.trim()};
      A.DB.profile.weights=A.DB.profile.weights||[];
      const i=A.DB.profile.weights.findIndex(x=>x.id===o.id);
      if(i>=0) A.DB.profile.weights[i]=o; else A.DB.profile.weights.push(o);
      A.DB.profile.weights.sort((a,b)=>a.date<b.date?-1:1);
      A.save('profile'); A.render(); A.toast('已记录','ok');
      /* 编辑后强制重绘曲线 */
      setTimeout(()=>{ if(A.redrawCharts) A.redrawCharts(true); },30);
    });
};
A.delWeight=function(id){ A.confirmBox('删除记录','确定删除这条体重记录吗？',()=>{
  A.DB.profile.weights=A.DB.profile.weights.filter(x=>x.id!==id); A.save('profile'); A.render(); A.toast('已删除'); },'删除'); };
})(window.App=window.App||{});
</script>

<script>
/* ================= 心情温度计 + 今日能量条 + 首页概览 ================= */
(function(A){
'use strict';
const $=A.$,$$=A.$$,esc=A.esc,num=A.num,today=A.today;

/* ---------- 心情数据 ---------- */
const MOODS=[
  {s:1,ic:'😢',t:'很低落',c:'#8fb6dd',tip:'抱抱你，明天会好一点的'},
  {s:2,ic:'🙁',t:'有点丧',c:'#a9c8e8',tip:'先喝口水，什么都不急'},
  {s:3,ic:'😐',t:'还平静',c:'#bfe0d2',tip:'平淡的日子也很珍贵'},
  {s:4,ic:'🙂',t:'还不错',c:'#ffd9a0',tip:'不错哦，保持这个节奏'},
  {s:5,ic:'🤩',t:'超开心',c:'#ff9ec4',tip:'太棒了！派大星也想跟着开心'}
];
const TAGS=['工作顺','被夸了','睡得好','吃了好吃的','见了朋友','运动过','有点累','想发呆','被理解','天气好','小确幸','想倾诉'];
A.MOODS=MOODS; A.MOOD_TAGS=TAGS;
function moodOf(date){ return (A.DB.mood.logs||[]).find(m=>m.date===date); }
A.moodOf=moodOf;
function moodMeta(s){ return MOODS[Math.min(5,Math.max(1,num(s,3)))-1]; }
A.moodMeta=moodMeta;

/* ---------- 今日心情 ---------- */
A.moodToday=function(pv){
  const d=today(), m=moodOf(d)||{date:d,score:0,tags:[],note:''};
  const logs=(A.DB.mood.logs||[]).slice().sort((a,b)=>a.date<b.date?1:-1);
  const last7=logs.slice(0,7);
  const avg=last7.length?(last7.reduce((s,x)=>s+num(x.score),0)/last7.length):0;
  pv.innerHTML=
  '<div class="card"><div class="card-h">🌡️ 今天的心情<span class="spacer"></span><span class="text-sub">'+d+' '+A.WEEK[new Date().getDay()]+'</span></div>'+
    '<div class="mood-scale">'+MOODS.map(x=>
      '<button class="mood-btn'+(num(m.score)===x.s?' sel':'')+'" onclick="App.pickMood('+x.s+')">'+
      '<span class="m-ic">'+x.ic+'</span><span class="m-tx">'+x.t+'</span></button>').join('')+'</div>'+
    '<div class="text-sub" style="margin:10px 0 6px">今天的关键词（可多选）</div>'+
    '<div class="row" style="gap:6px;margin-bottom:12px">'+TAGS.map(t=>{
      const on=(m.tags||[]).indexOf(t)>=0;
      return '<button class="btn mini '+(on?'':'ghost')+'" onclick="App.toggleMoodTag(\''+t+'\')">'+(on?'✓ ':'')+t+'</button>';
    }).join('')+'</div>'+
    '<label class="fld"><span>想说点什么（可选）</span><textarea id="moodNote" placeholder="今天发生了什么？">'+esc(m.note||'')+'</textarea></label>'+
    '<div class="row"><button class="btn" onclick="App.saveMood(this)">保存今日心情</button>'+
    (m.score?'<button class="btn mini ghost" onclick="App.delMood()">清除今日记录</button>':'')+
    '<span class="spacer"></span>'+
    '<button class="btn mini ghost" onclick="App.go(\'mood:cal\')">看心情日历</button></div>'+
    (m.score?'<div class="text-sub" style="margin-top:10px">'+moodMeta(m.score).ic+' '+esc(moodMeta(m.score).tip)+'</div>':'')+
  '</div>'+
  '<div class="card"><div class="card-h">📅 最近 7 天</div>'+
    (last7.length?'<div class="row" style="gap:6px;justify-content:space-between">'+last7.slice().reverse().map(x=>{
      const mm=moodMeta(x.score);
      return '<div style="text-align:center;flex:1"><div style="font-size:22px">'+mm.ic+'</div>'+
        '<div class="text-sub" style="font-size:11px">'+x.date.slice(5)+'</div>'+
        '<div style="height:6px;border-radius:4px;margin-top:3px;background:'+mm.c+'"></div></div>';
    }).join('')+'</div><div class="text-sub" style="margin-top:10px">近 7 次平均心情：<b style="color:var(--accent)">'+avg.toFixed(1)+'</b> / 5　'+
      (avg>=4?'状态很好，继续保持 🌸':(avg>=3?'整体平稳，偶尔给自己加点糖 🍬':'最近有点低落，要不要和派大星说说？🤗'))+'</div>'
      :A.empty('还没有心情记录','先给今天打个分，日积月累就是你的心情地图'))+'</div>';
};
A.pickMood=function(s){
  const d=today(); let m=moodOf(d);
  if(!m){ m={date:d,score:s,tags:[],note:'',updatedAt:Date.now()}; A.DB.mood.logs.push(m); }
  else m.score=s;
  m.updatedAt=Date.now(); A.save('mood'); A.render();
  const mm=moodMeta(s); A.petSay(mm.tip);
};
A.toggleMoodTag=function(t){
  const d=today(); let m=moodOf(d);
  if(!m){ m={date:d,score:3,tags:[],note:'',updatedAt:Date.now()}; A.DB.mood.logs.push(m); }
  m.tags=m.tags||[]; const i=m.tags.indexOf(t);
  if(i>=0) m.tags.splice(i,1); else m.tags.push(t);
  m.updatedAt=Date.now(); A.save('mood'); A.render();
};
A.saveMood=function(btn){
  A.withLoading(btn,async()=>{
    const d=today(); let m=moodOf(d);
    if(!m){ m={date:d,score:3,tags:[],note:'',updatedAt:Date.now()}; A.DB.mood.logs.push(m); }
    m.note=$('#moodNote').value.trim(); m.updatedAt=Date.now();
    A.save('mood'); A.toast('今日心情已保存','ok'); A.render();
  });
};
A.delMood=function(){
  A.confirmBox('清除记录','确定清除今天的心情记录吗？',()=>{
    A.DB.mood.logs=(A.DB.mood.logs||[]).filter(x=>x.date!==today()); A.save('mood'); A.render(); A.toast('已清除'); },'清除');
};

/* ---------- 心情日历 ---------- */
A.moodMonth=null;
A.moodCal=function(pv){
  const base=A.moodMonth?new Date(A.moodMonth):new Date();
  const y=base.getFullYear(),mo=base.getMonth();
  const first=new Date(y,mo,1), start=(first.getDay()+6)%7;   // 周一为第一列
  const days=new Date(y,mo+1,0).getDate();
  const logs=A.DB.mood.logs||[];
  const inMonth=logs.filter(x=>{ const d=A.parseDate(x.date); return d.getFullYear()===y&&d.getMonth()===mo; });
  const avg=inMonth.length?(inMonth.reduce((s,x)=>s+num(x.score),0)/inMonth.length):0;
  const dist=[0,0,0,0,0]; inMonth.forEach(x=>{ dist[Math.min(4,Math.max(0,num(x.score,3)-1))]++; });
  const mx=Math.max.apply(null,dist.concat([1]));
  const cells=[];
  for(let i=0;i<start;i++) cells.push('<div class="mood-cell empty-cell"></div>');
  for(let d=1;d<=days;d++){
    const ds=y+'-'+A.pad(mo+1)+'-'+A.pad(d);
    const m=logs.find(x=>x.date===ds);
    const isToday=ds===today();
    if(m){ const mm=moodMeta(m.score);
      cells.push('<div class="mood-cell'+(isToday?' today':'')+'" style="background:'+mm.c+'55;border-color:'+mm.c+'" '+
        'title="'+ds+' '+mm.t+'" onclick="App.editMood(\''+ds+'\')"><span class="mc-ic">'+mm.ic+'</span><span>'+d+'</span></div>');
    }else{
      cells.push('<div class="mood-cell'+(isToday?' today':'')+'" onclick="App.editMood(\''+ds+'\')"><span>'+d+'</span></div>');
    }
  }
  const prevM=dateStr2(new Date(y,mo-1,1)), nextM=dateStr2(new Date(y,mo+1,1));
  pv.innerHTML=
  '<div class="card"><div class="card-h">🗓 心情日历<span class="spacer"></span>'+
    '<button class="btn mini ghost" onclick="App.shiftMoodMonth(\''+prevM+'\')">‹ 上月</button>'+
    '<b style="min-width:96px;text-align:center">'+y+' 年 '+(mo+1)+' 月</b>'+
    '<button class="btn mini ghost" onclick="App.shiftMoodMonth(\''+nextM+'\')">下月 ›</button></div>'+
    (inMonth.length?'':'<div class="text-sub" style="margin-bottom:10px">本月还没有记录，点任意一天补记 👆</div>')+
    '<div class="mood-cal">'+['一','二','三','四','五','六','日'].map(w=>'<div class="wd">'+w+'</div>').join('')+cells.join('')+'</div>'+
    '<div class="mood-legend">'+MOODS.map(m=>'<span><i style="background:'+m.c+'"></i>'+m.ic+' '+m.t+'</span>').join('')+'</div>'+
  '</div>'+
  '<div class="card"><div class="card-h">📊 本月心情报告</div>'+
    (inMonth.length?
      '<div class="grid g3 keep2" style="margin-bottom:14px">'+
      '<div class="stat-box"><div style="font-size:22px;font-weight:800;color:var(--accent)">'+avg.toFixed(1)+'</div><div class="text-sub">平均心情</div></div>'+
      '<div class="stat-box"><div style="font-size:22px;font-weight:800;color:var(--accent-2)">'+inMonth.length+'</div><div class="text-sub">记录天数</div></div>'+
      '<div class="stat-box"><div style="font-size:22px;font-weight:800;color:var(--accent-3)">'+(inMonth.length/days*100).toFixed(0)+'%</div><div class="text-sub">记录覆盖率</div></div></div>'+
      '<div style="display:grid;gap:7px">'+MOODS.slice().reverse().map((m,i)=>{
        const v=dist[4-i];
        return '<div class="row" style="gap:8px;flex-wrap:nowrap"><span style="width:52px;font-size:12.5px">'+m.ic+' '+m.t+'</span>'+
          '<div class="bar" style="flex:1"><i style="width:'+(v/mx*100)+'%;background:'+m.c+'"></i></div>'+
          '<span class="text-sub" style="width:34px;text-align:right">'+v+' 天</span></div>';
      }).join('')+'</div>'+
      '<div class="text-sub" style="margin-top:12px;line-height:1.9">'+
        (avg>=4?'本月心情整体明亮，好事都在向你招手 🌈':(avg>=3?'本月平稳居多，偶有起伏也很正常 ☁️':'本月有点辛苦，记得多照顾自己一点 🤗'))+
        '　最爱出现的关键词：'+(function(){ const c={}; inMonth.forEach(x=>(x.tags||[]).forEach(t=>c[t]=(c[t]||0)+1));
          const ks=Object.keys(c).sort((a,b)=>c[b]-c[a]); return ks.length?esc(ks[0]):'（还没选过关键词）'; })()+'</div>'
      :A.empty('本月还没有心情记录','每天一秒钟，给心情量个温度'))+
  '</div>';
  function dateStr2(d){ return d.getFullYear()+'-'+A.pad(d.getMonth()+1)+'-01'; }
};
A.shiftMoodMonth=function(m){ A.moodMonth=m; A.render(); };
A.editMood=function(date){
  const m=moodOf(date)||{date:date,score:3,tags:[],note:''};
  A.openModal(date+' 的心情',
    '<div class="text-sub" style="margin-bottom:8px">选择那一天的心情</div>'+
    '<div class="mood-scale" style="margin-bottom:14px">'+MOODS.map(x=>
      '<button class="mood-btn'+(num(m.score)===x.s?' sel':'')+'" data-ms="'+x.s+'" onclick="var p=this.parentNode;Array.prototype.forEach.call(p.children,function(c){c.classList.remove(\'sel\')});this.classList.add(\'sel\')">'+
      '<span class="m-ic">'+x.ic+'</span><span class="m-tx">'+x.t+'</span></button>').join('')+'</div>'+
    '<div class="text-sub" style="margin-bottom:6px">关键词</div>'+
    '<div class="row" style="gap:6px;margin-bottom:12px">'+TAGS.map(t=>{
      const on=(m.tags||[]).indexOf(t)>=0;
      return '<button type="button" class="btn mini '+(on?'':'ghost')+'" data-tag="'+t+'" onclick="this.classList.toggle(\'ghost\')">'+t+'</button>';
    }).join('')+'</div>'+
    '<label class="fld"><span>当天想说的话</span><textarea id="em_note">'+esc(m.note||'')+'</textarea></label>',
    (m.score&&moodOf(date)?'<button class="btn danger" onclick="App.removeMood(\''+date+'\')">删除</button>':'')+
    '<button class="btn ghost" onclick="App.closeModal()">取消</button><button class="btn" onclick="App.modalOK()">保存</button>',
    ()=>{
      const sel=$('.mood-btn.sel');
      const score=sel?num(sel.getAttribute('data-ms'),3):3;
      const tags=$$('[data-tag]').filter(b=>!b.classList.contains('ghost')).map(b=>b.getAttribute('data-tag'));
      const note=$('#em_note').value.trim();
      let cur=moodOf(date);
      if(!cur){ cur={date:date,score:score,tags:tags,note:note,updatedAt:Date.now()}; A.DB.mood.logs.push(cur); }
      else { cur.score=score; cur.tags=tags; cur.note=note; cur.updatedAt=Date.now(); }
      A.save('mood'); A.render(); A.toast('已保存','ok');
    });
};
A.removeMood=function(date){
  A.DB.mood.logs=(A.DB.mood.logs||[]).filter(x=>x.date!==date);
  A.save('mood'); A.closeModal(); A.render(); A.toast('已删除');
};

/* ---------- 今日能量条 ---------- */
A.energy=function(){
  const d=today();
  const todos=A.DB.todos||[];
  const doneToday=todos.filter(t=>t.done&&t.doneAt&&new Date(t.doneAt).toDateString()===new Date().toDateString()).length;
  const logs=(A.DB.workouts.logs||[]).filter(l=>l.date===d);
  const minutes=logs.reduce((s,l)=>s+num(l.minutes),0);
  const mood=moodOf(d);
  const weightToday=(A.DB.profile.weights||[]).some(w=>w.date===d);
  const parts=[
    {ic:'✅',t:'待办完成',v:Math.min(30,doneToday*15),max:30,desc:doneToday?('完成 '+doneToday+' 项'):'今天还没完成待办'},
    {ic:'🏃',t:'运动',v:Math.min(30,Math.round(minutes/30*30)),max:30,desc:minutes?(minutes+' 分钟'):'今天还没运动'},
    {ic:'🌡️',t:'心情',v:mood?Math.round(num(mood.score,3)/5*25):0,max:25,desc:mood?(moodMeta(mood.score).t):'还没记录心情'},
    {ic:'📝',t:'记录',v:(weightToday?8:0)+(mood?7:0),max:15,desc:(weightToday?'已记体重':'未记体重')+(mood?' · 已记心情':' · 未记心情')}
  ];
  const total=parts.reduce((s,p)=>s+p.v,0);
  let level,tip;
  if(total>=90){ level='今天超棒！'; tip='派大星给你满分好评 ⭐'; }
  else if(total>=70){ level='元气满满'; tip='状态在线，继续保持！'; }
  else if(total>=45){ level='状态不错'; tip='再加把劲就满分啦～'; }
  else if(total>=20){ level='慢慢升温'; tip:'一点点来，也很好'; }
  else { level='需要充充电'; tip:'先做一件小事吧，派大星陪你'; }
  return {total:total,parts:parts,level:level,tip:tip};
};
function energyHTML(){
  const e=A.energy();
  const C=2*Math.PI*44;
  const off=C*(1-e.total/100);
  return '<div class="energy-wrap">'+
    '<div class="energy-ring"><svg width="104" height="104" viewBox="0 0 104 104">'+
      '<defs><linearGradient id="eg" x1="0" y1="0" x2="1" y2="1">'+
      '<stop offset="0%" stop-color="#ff8fbe"/><stop offset="100%" stop-color="#a98bf5"/></linearGradient></defs>'+
      '<circle class="track" cx="52" cy="52" r="44" fill="none" stroke-width="11"/>'+
      '<circle class="fillr" cx="52" cy="52" r="44" fill="none" stroke-width="11" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'"/>'+
    '</svg><div class="energy-val"><b style="color:var(--accent)">'+e.total+'</b><span>今日能量</span></div></div>'+
    '<div class="energy-items">'+e.parts.map(p=>
      '<div class="energy-item'+(p.v?'':' off')+'"><i>'+p.ic+'</i><div style="flex:1;min-width:0">'+
      '<div style="font-size:12.5px;color:var(--text)">'+p.t+'　<span class="text-sub">'+p.v+'/'+p.max+'</span></div>'+
      '<div class="text-sub" style="font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(p.desc)+'</div></div></div>').join('')+
    '</div></div>'+
    '<div class="text-sub" style="margin-top:12px;font-size:14px">当前状态：<b style="color:var(--accent)">'+e.level+'</b>　'+esc(e.tip)+'</div>';
}

/* ---------- 首页 ---------- */
function greetWord(){
  const h=new Date().getHours();
  if(h<6) return '夜深了，早点休息呀';
  if(h<11) return '早安，今天也要元气满满';
  if(h<14) return '中午好，记得好好吃饭';
  if(h<18) return '下午好，喝口水活动一下';
  if(h<22) return '晚上好，今天辛苦啦';
  return '夜深了，别熬太晚哦';
}
function dayOfYear(){ const n=new Date(),s=new Date(n.getFullYear(),0,0); return Math.floor((n-s)/864e5); }

function homeQuoteChips(){
  const Q=A.DB.quotes, items=(Q.items||[]).filter(i=>i.on);
  if(!items.length) return '<span class="text-sub">还没有配置行情项目</span>';
  return items.map(it=>{
    const q=(Q.last||{})[it.code];
    if(!q) return '<span class="tag gray">'+esc(it.name)+' --</span>';
    const cls=q.pct>0?'up':(q.pct<0?'down':'flat');
    return '<span class="tag '+(q.pct>=0?'o':'g')+'" style="font-size:12.5px">'+esc(it.name)+' <b class="'+cls+'">'+q.price.toLocaleString('zh-CN',{maximumFractionDigits:2})+'</b> '+
      (q.pct>0?'+':'')+q.pct.toFixed(2)+'%</span>';
  }).join('');
}
/* =========================================================
   首页概览 · 模块拖拽排序（动态顺序 + 排序模式）
   说明：首页不再硬编码卡片顺序，而是按 A.homeOrder() 返回的顺序动态渲染；
   A.homeOrder() 读取 DB.settings.homeOrder（模块 ID 数组），缺失或需要补齐时回退默认并写入。
   排序模式：PC 用鼠标直接拖拽、移动端长按手柄（≡）拖动，松手即保存到 localStorage。
   ========================================================= */
A.HOME_DEFAULT=['greeting','energy','stats','modules','news','poem','workout','quick','diary'];
A._sortMode=false;

A.homeOrder=function(){
  const s=A.DB.settings;
  const def=A.HOME_DEFAULT;
  const arr=s.homeOrder;
  if(!Array.isArray(arr)||!arr.length){ s.homeOrder=def.slice(); A.save('settings'); return def.slice(); }
  const known=new Set(def);
  const filtered=arr.filter(id=>known.has(id));      /* 丢弃已不存在的模块 */
  let changed=(filtered.length!==arr.length);
  def.forEach(id=>{ if(filtered.indexOf(id)<0){ filtered.push(id); changed=true; } }); /* 补齐新增模块（如日记） */
  if(changed){ s.homeOrder=filtered; A.save('settings'); }
  return filtered;
};

function sortContainer(){ return $('#pv'); }
function saveHomeOrder(){
  const c=sortContainer(); if(!c) return;
  const ids=$$('.home-mod',c).map(m=>m.getAttribute('data-mod')).filter(Boolean);
  if(ids.length){ A.DB.settings.homeOrder=ids; A.save('settings'); }
}

A.applySortMode=function(pv){
  if(!pv) return;
  pv.classList.add('sorting');
  $$('.home-mod',pv).forEach(m=> m.addEventListener('pointerdown',onModPointerDown));
};
function detachSort(pv){
  if(!pv) return;
  $$('.home-mod',pv).forEach(m=> m.removeEventListener('pointerdown',onModPointerDown));
};
A.enterSort=function(){
  A._sortMode=true;
  const pv=sortContainer(); if(pv) A.applySortMode(pv);
  A.updateSortBtn();
  A.toast('拖动卡片左侧 ≡ 手柄调整顺序，完成后点“完成”','ok');
};
A.exitSort=function(){
  A._sortMode=false;
  saveHomeOrder();
  const pv=sortContainer();
  if(pv){ detachSort(pv); pv.classList.remove('sorting'); }
  A.updateSortBtn();
  A.render();
};
A.toggleSort=function(){ if(A._sortMode) A.exitSort(); else A.enterSort(); };
A.updateSortBtn=function(){
  const b=$('#sortBtn'); if(!b) return;
  const onHome=(A.CUR==='home');
  b.style.display=onHome?'':'none';
  if(A._sortMode){ b.textContent='完成'; b.classList.add('active'); b.title='完成排序'; }
  else { b.textContent='⇅'; b.classList.remove('active'); b.title='拖拽排序首页模块'; }
};

/* 统一指针拖拽：PC 鼠标直接拖、移动端长按手柄拖（FLIP 平滑让位） */
function onModPointerDown(e){
  if(!A._sortMode) return;
  if(e.target.closest('button,a,input,textarea,select,label')) return;   /* 让卡片内按钮仍可用 */
  const el=e.currentTarget;
  const isTouch=(e.pointerType==='touch');
  const startY=e.clientY, startX=e.clientX;
  const rect=el.getBoundingClientRect();
  const offY=startY-rect.top;
  let active=false, aborted=false, longTimer=null;
  if(isTouch){ longTimer=setTimeout(()=>{ active=true; beginDrag(); },200); }   /* 移动端长按 200ms 触发 */
  function beginDrag(){
    el.setPointerCapture(e.pointerId);
    const ph=document.createElement('div');
    ph.className='home-mod-placeholder';
    ph.style.height=rect.height+'px';
    el.parentNode.insertBefore(ph,el);
    el.classList.add('dragging');
    el.style.width=rect.width+'px';
    el.style.height=rect.height+'px';
    el.style.position='fixed';
    el.style.left=rect.left+'px';
    el.style.top=(startY-offY)+'px';
    el.style.zIndex='1000';
    el.style.pointerEvents='none';
    el._ph=ph;
    document.body.classList.add('dragging-active');
  }
  function onMove(ev){
    if(!active){
      if(isTouch){
        if(Math.abs(ev.clientY-startY)>10||Math.abs(ev.clientX-startX)>10){ aborted=true; clearTimeout(longTimer); }  /* 长按前移动=滚动，放弃拖拽 */
        return;
      }else{
        if(Math.abs(ev.clientY-startY)>4||Math.abs(ev.clientX-startX)>4){ active=true; beginDrag(); }   /* PC：移动阈值即触发 */
        else return;
      }
    }
    ev.preventDefault();   /* 阻止移动端页面滚动 / 文本选择 */
    el.style.top=(ev.clientY-offY)+'px';
    el.style.left=rect.left+'px';
    const ph=el._ph, container=el.parentNode;
    const sibs=$$('.home-mod',container).filter(s=>s!==el&&s!==ph);
    const oldTop=new Map(); sibs.forEach(s=>oldTop.set(s,s.getBoundingClientRect().top));
    let target=null;
    for(const s of sibs){ const r=s.getBoundingClientRect(); if(ev.clientY<r.top+r.height/2){ target=s; break; } }
    if(target) container.insertBefore(ph,target); else container.appendChild(ph);
    sibs.forEach(s=>{   /* FLIP：相邻卡片平滑让位 */
      const dy=oldTop.get(s)-s.getBoundingClientRect().top;
      if(dy){
        s.style.transition='none'; s.style.transform='translateY('+dy+'px)';
        requestAnimationFrame(()=>{ s.style.transition='transform .2s ease'; s.style.transform=''; });
      }
    });
  }
  function onUp(ev){
    clearTimeout(longTimer);
    if(!active) return;
    ev.preventDefault();
    const ph=el._ph, container=el.parentNode;
    if(ph&&ph.parentNode){ container.insertBefore(el,ph); ph.remove(); }
    el.classList.remove('dragging');
    el.style.position=''; el.style.left=''; el.style.top=''; el.style.width=''; el.style.height='';
    el.style.zIndex=''; el.style.pointerEvents=''; el.style.transform='';
    document.body.classList.remove('dragging-active');
    el._ph=null;
    try{ el.releasePointerCapture(e.pointerId); }catch(_){}
    el.removeEventListener('pointermove',onMove);
    el.removeEventListener('pointerup',onUp);
    el.removeEventListener('pointercancel',onUp);
    saveHomeOrder();
  }
  el.addEventListener('pointermove',onMove);
  el.addEventListener('pointerup',onUp);
  el.addEventListener('pointercancel',onUp);
}

/* 首页「今日日记」卡片（与 v16 时光日记模块同源，置于首页文件以便首屏即可用） */
function homePeopleColor(name){
  let h=0; for(let i=0;i<name.length;i++) h=(h*31+name.charCodeAt(i))>>>0;
  const PAL=['#ff7eb3','#7db9ff','#5cc9a7','#f0a35e','#b694ff','#ff8f8f','#5ec6e0','#9bd35a'];
  return PAL[h%PAL.length];
}

      '<button class="btn mini ghost" onclick="App.go(\'diary:today\')">📖 写日记</button>'+
      '<button class="btn mini ghost" onclick="App.go(\'shopping\')">🛒 购物清单</button>'+
      '<button class="btn mini ghost" onclick="App.go(\'travel\')">✈️ 旅游规划</button>'+
      '<button class="btn mini ghost" onclick="App.go(\'set:sync\')">数据同步</button></div></div>';
  H.diary=(A.diaryHomeCard? A.diaryHomeCard():'');

  const order=A.homeOrder().filter(id=>H[id]);
  pv.innerHTML=order.map(id=>
    '<div class="home-mod" data-mod="'+id+'">'+
      '<div class="drag-handle" aria-hidden="true">≡</div>'+
      '<div class="mod-inner">'+(H[id]||'')+'</div>'+
    '</div>'
  ).join('');

  if(A._sortMode) A.applySortMode(pv);
  A.fetchQuotes().then(()=>{ const el=$('#homeQuotes'); if(el) el.innerHTML=homeQuoteChips(); });
};
})(window.App=window.App||{});
</script>

<script>
/* =========================================================
   记账理财模块：流水记录 / 月度报表 / 类别管理
   数据落在 A.DB.finance（随云端同步，模块名 finance）
   ========================================================= */
(function(A){
'use strict';
const $=A.$,$$=A.$$,esc=A.esc,num=A.num,today=A.today,uid=A.uid,pad=A.pad;

const PIE=['#ff8fb1','#a89bff','#5fc8ff','#ffc96b','#7ce0b0','#ff9d7a','#c9a0ff','#8fd3ff',
           '#f79ac0','#9ee7d0','#ffd36b','#b0b7ff','#ffb0a8','#8ad0ff'];
const PAYS=['现金','微信','支付宝','银行卡','信用卡','其他'];
const IN_C='#12a05c', OUT_C='#e13b3b';

/* ---------------- 数据访问 ---------------- */
function fin(){
  if(!A.DB.finance||typeof A.DB.finance!=='object') A.DB.finance={records:[],cats:null};
  const f=A.DB.finance;
  if(!Array.isArray(f.records)) f.records=[];
  if(!f.cats||typeof f.cats!=='object'||!Array.isArray(f.cats.in)||!Array.isArray(f.cats.out)){
    f.cats=JSON.parse(JSON.stringify(A.defaultDB().finance.cats));
  }
  return f;
}
function recs(){ return fin().records; }
function cats(type){ const c=fin().cats; return (type==='in'?c.in:c.out)||[]; }
A.financeCats=cats;

function hashIdx(s,n){
  let h=0; const str=String(s||'');
  for(let i=0;i<str.length;i++) h=(h*31+str.charCodeAt(i))>>>0;
  return h%(n||5);
}
function catIdx(type,name){
  const l=cats(type); const i=l.findIndex(x=>x.t===name);
  return i>=0?i:(l.length+hashIdx(name));
}
function catColor(type,name){ return PIE[catIdx(type,name)%PIE.length]; }
function catIcon(type,name){ const c=cats(type).find(x=>x.t===name); return c?c.ic:'🧾'; }
A.financeCatColor=catColor; A.financeCatIcon=catIcon;

function money(n,withSign){
  const v=num(n,0);
  const s=Math.abs(v).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',');
  return (withSign&&v>0?'+':'')+(v<0?'-':'')+'¥'+s;
}
A.money=money;
function ymOf(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1); }
function curYM(){ return ymOf(new Date()); }
A.curYM=curYM;
function shiftYM(ym,delta){
  if(ym==='all') return curYM();
  const p=String(ym).split('-').map(Number);
  const d=new Date(p[0],(p[1]||1)-1+delta,1);
  return ymOf(d);
}
function inMonth(r,ym){
  if(ym==='all') return true;
  return String(r.date||'').slice(0,7)===ym;
}
function statOf(ym){
  const list=recs().filter(r=>inMonth(r,ym));
  let inc=0,out=0;
  list.forEach(r=>{ const v=num(r.amount,0); if(r.type==='out') out+=v; else inc+=v; });
  return {in:inc,out:out,bal:inc-out,list:list,n:list.length};
}
A.financeStat=statOf;

function monthOpts(cur){
  const set={}; set[curYM()]=1;
  recs().forEach(r=>{ if(r.date) set[String(r.date).slice(0,7)]=1; });
  if(cur&&cur!=='all') set[cur]=1;
  const arr=Object.keys(set).sort().reverse();
  return '<option value="all"'+(cur==='all'?' selected':'')+'>📅 全部月份</option>'+
    arr.map(m=>'<option value="'+m+'"'+(m===cur?' selected':'')+'>'+m.split('-')[0]+'年'+(+m.split('-')[1])+'月</option>').join('');
}
function monthNav(cur){
  return '<div class="mon-nav">'+
    '<button class="btn mini ghost" onclick="App.financeShift(-1)" title="上个月">‹</button>'+
    '<span class="mon-t">'+(cur==='all'?'全部':(cur.split('-')[0]+'年'+(+cur.split('-')[1])+'月'))+'</span>'+
    '<button class="btn mini ghost" onclick="App.financeShift(1)" title="下个月">›</button>'+
    '<select onchange="App.financePick(this.value)" style="margin-left:4px">'+monthOpts(cur)+'</select>'+
    (cur!==curYM()?'<button class="btn mini ghost" onclick="App.financePick(\''+A.curYM()+'\')">回到本月</button>':'')+
  '</div>';
}
function statBox(v,l,c,sub){
  return '<div class="stat-box"><div class="sv" style="font-size:19px;font-weight:800;color:'+c+'">'+v+'</div>'+
    '<div class="sl" style="font-size:12px;color:var(--text-sub);margin-top:2px">'+l+'</div>'+
    (sub?'<div style="font-size:11px;color:var(--text-sub);margin-top:2px">'+sub+'</div>':'')+'</div>';
}

/* ================= 流水记录 ================= */
A.financeMonth=null;
A.financeType='all';   /* all / in / out  列表筛选 */
function curMonth(){ return A.financeMonth||curYM(); }

A.financeRec=function(pv){
  const ym=curMonth();
  const st=statOf(ym);
  let list=st.list.slice();
  if(A.financeType!=='all') list=list.filter(r=>r.type===A.financeType);
  list.sort((a,b)=>String(b.date).localeCompare(String(a.date))||String(b.createdAt||0)-String(a.createdAt||0));

  /* 按日期分组 */
  const groups=[]; const map={};
  list.forEach(r=>{
    const k=r.date||'未填日期';
    if(!map[k]){ map[k]={d:k,items:[],in:0,out:0}; groups.push(map[k]); }
    map[k].items.push(r);
    if(r.type==='out') map[k].out+=num(r.amount,0); else map[k].in+=num(r.amount,0);
  });

  const typeTabs='<div class="row" style="gap:6px;margin:2px 0 12px">'+
    ['all','out','in'].map(t=>'<button class="btn mini '+(A.financeType===t?'':'ghost')+'" onclick="App.financeTypeSet(\''+t+'\')">'+
      (t==='all'?'全部':t==='out'?'支出':'收入')+'</button>').join('')+'</div>';

  pv.innerHTML=
  '<div class="card"><div class="card-h">💰 流水记录<span class="spacer"></span>'+
      '<button class="btn mini" onclick="App.financeEdit(null)">＋ 记一笔</button></div>'+
    monthNav(ym)+
    '<div class="grid g3 keep2" style="margin-top:12px">'+
      statBox('<span class="money-in">'+money(st.in)+'</span>','收入',IN_C)+
      statBox('<span class="money-out">'+money(st.out)+'</span>','支出',OUT_C)+
      statBox('<span class="'+(st.bal>=0?'money-in':'money-out')+'">'+money(st.bal)+'</span>','结余',
        st.bal>=0?IN_C:OUT_C, '共 '+st.n+' 笔')+
    '</div>'+
    (st.n?'<div class="bar" style="margin-top:12px"><i style="width:'+
        (st.in+st.out?Math.round(st.out/(st.in+st.out)*100):0)+'%;background:linear-gradient(90deg,#ffb36b,'+OUT_C+')"></i></div>'+
      '<div class="text-sub" style="margin-top:6px">支出占本月流水 '+
        (st.in+st.out?Math.round(st.out/(st.in+st.out)*100):0)+'%'+
        (st.in>0?('，储蓄率 '+Math.round(st.bal/st.in*100)+'%'):'')+'</div>':'')+
  '</div>'+
  '<div class="card">'+
    typeTabs+
    (groups.length?groups.map(g=>
      '<div class="day-group"><div class="day-head"><b>'+esc(g.d)+'</b><span>'+A.WEEK[A.parseDate(g.d).getDay()]+'</span>'+
      '<span class="spacer"></span>'+
      (g.in?'<span class="money-in">+'+money(g.in)+'</span>':'')+
      (g.out?'<span class="money-out" style="margin-left:8px">-'+money(g.out)+'</span>':'')+
      '</div>'+
      g.items.map(r=>rowHTML(r)).join('')+'</div>').join('')
      :A.empty(ym==='all'?'还没有任何流水':'这个月还没有记账','点右上角「＋ 记一笔」开始吧，派大星帮你盯着钱包'))+
  '</div>';
  A.redrawCharts=null;
};
function rowHTML(r){
  const isOut=r.type==='out';
  return '<div class="fin-row">'+
    '<div class="fin-ic" style="background:'+catColor(r.type,r.cat)+'22">'+catIcon(r.type,r.cat)+'</div>'+
    '<div class="fin-main"><div class="fin-title">'+esc(r.cat||'未分类')+
      (r.pay?' <span class="tag gray" style="font-size:10.5px">'+esc(r.pay)+'</span>':'')+'</div>'+
      '<div class="fin-sub">'+esc(r.note||(isOut?'支出':'收入'))+'</div></div>'+
    '<div class="fin-amt '+(isOut?'money-out':'money-in')+'">'+(isOut?'-':'+')+money(r.amount)+'</div>'+
    '<div class="fin-acts">'+
      '<button onclick="App.financeEdit(\''+r.id+'\')" title="编辑">✏️</button>'+
      '<button onclick="App.financeDel(\''+r.id+'\')" title="删除">🗑️</button>'+
    '</div></div>';
}
A.financeShift=function(d){ A.financeMonth=shiftYM(curMonth(),d); A.render(); };
A.financePick=function(v){ A.financeMonth=v; A.render(); };
A.financeTypeSet=function(t){ A.financeType=t; A.render(); };

/* ---------------- 增删改 ---------------- */
A.financeEdit=function(id){
  const r=id?recs().find(x=>x.id===id):null;
  const type=r?r.type:'out';
  A.openModal(id?'编辑流水':'记一笔',
    '<input type="hidden" id="fin_id" value="'+esc(id||'')+'">'+
    '<label class="fld"><span>类型</span><select id="fin_type" onchange="App.financeFillCats()">'+
      '<option value="out"'+(type==='out'?' selected':'')+'>支出</option>'+
      '<option value="in"'+(type==='in'?' selected':'')+'>收入</option></select></label>'+
    '<label class="fld"><span>类别</span><select id="fin_cat"></select></label>'+
    '<label class="fld"><span>金额（元）</span><input type="number" id="fin_amt" step="0.01" min="0" inputmode="decimal" value="'+(r?num(r.amount,0):'')+'" placeholder="0.00"></label>'+
    '<label class="fld"><span>日期</span><input type="date" id="fin_date" value="'+esc(r?r.date:today())+'"></label>'+
    '<label class="fld"><span>支付方式（可选）</span><select id="fin_pay">'+
      PAYS.map(p=>'<option value="'+p+'"'+(r&&r.pay===p?' selected':'')+'>'+p+'</option>').join('')+'</select></label>'+
    '<label class="fld"><span>备注（可选）</span><input type="text" id="fin_note" value="'+esc(r?r.note:'')+'" placeholder="比如：和朋友吃火锅"></label>'+
    '<div class="text-sub">小提示：删掉类别也不会影响已经记下的流水哦。</div>',
    '<button class="btn ghost" onclick="App.closeModal()">取消</button>'+
    '<button class="btn" onclick="App.financeSave()">保存</button>'+
    (id?'<button class="btn danger" onclick="App.financeDel(\''+id+'\',true)">删除</button>':''),
    ()=>A.financeSave());
  A.financeFillCats(r?r.cat:'');
};
A.financeFillCats=function(sel){
  const t=$('#fin_type')?$('#fin_type').value:'out';
  const box=$('#fin_cat'); if(!box) return;
  const l=cats(t);
  box.innerHTML=l.map(c=>'<option value="'+esc(c.t)+'"'+(sel===c.t?' selected':'')+'>'+c.ic+' '+esc(c.t)+'</option>').join('');
  if(sel&&!l.some(c=>c.t===sel)) box.innerHTML+='<option value="'+esc(sel)+'" selected>'+esc(sel)+'（已删除）</option>';
};
A.financeSave=function(){
  const id=$('#fin_id')?$('#fin_id').value:'';
  const type=$('#fin_type').value;
  const cat=$('#fin_cat').value;
  const amt=parseFloat($('#fin_amt').value);
  const date=$('#fin_date').value||today();
  if(!isFinite(amt)||amt<=0){ A.toast('请填写大于 0 的金额','err'); return false; }
  const d={type:type,cat:cat,amount:Math.round(amt*100)/100,date:date,
    pay:$('#fin_pay')?$('#fin_pay').value:'',note:$('#fin_note')?$('#fin_note').value.trim():''};
  const list=recs();
  if(id){ const r=list.find(x=>x.id===id); if(r) Object.assign(r,d); }
  else { d.id=uid(); d.createdAt=Date.now(); list.push(d); A.financeMonth=String(date).slice(0,7); }
  A.save('finance'); A.closeModal(); A.render();
  A.toast(id?'流水已更新 ✓':'记好啦 ✓','ok');
  if(A.petSay) A.petSay(type==='out'?('花出去 '+money(amt)+'，剩下的都在你手里～'):('进账 '+money(amt)+'，好运气！'));
  return true;
};
A.financeDel=function(id,inModal){
  const r=recs().find(x=>x.id===id); if(!r) return;
  A.confirmBox('删除流水','确定删除这条记录吗？<br><span class="text-sub">'+esc(r.date)+' · '+esc(r.cat)+' · '+money(r.amount)+'</span>',()=>{
    const f=fin(); f.records=f.records.filter(x=>x.id!==id);
    A.save('finance'); if(inModal) A.closeModal(); A.render(); A.toast('已删除','ok');
  },'删除');
};

/* ================= 月度报表 ================= */
A.financePieMonth=null;
A.financeTrendN=6;
A.financeReport=function(pv){
  const ym=curMonth();
  const st=statOf(ym);
  const prev=statOf(shiftYM(ym,-1));
  const dOut=st.out-prev.out;

  /* 近三个月可选 */
  const m3=[0,-1,-2].map(k=>shiftYM(ym,k));
  const pm=A.financePieMonth&&m3.indexOf(A.financePieMonth)>=0?A.financePieMonth:ym;
  A.financePieMonth=pm;
  const pieData=(function(){
    const m={};
    statOf(pm).list.filter(r=>r.type==='out').forEach(r=>{ const k=r.cat||'未分类'; m[k]=(m[k]||0)+num(r.amount,0); });
    return Object.keys(m).map(k=>({name:k,value:m[k]})).sort((a,b)=>b.value-a.value);
  })();
  const pieTotal=pieData.reduce((s,i)=>s+i.value,0);
  const pieItems=pieData.map((it,i)=>({name:it.name,value:it.value,color:PIE[i%PIE.length]}));

  /* 趋势 */
  const N=A.financeTrendN;
  const labels=[],inc=[],out=[];
  for(let i=N-1;i>=0;i--){
    const m=shiftYM(ym,-i); const s=statOf(m);
    labels.push((+m.split('-')[1])+'月'); inc.push(Math.round(s.in*100)/100); out.push(Math.round(s.out*100)/100);
  }
  const avgOut=N?Math.round(st.out/N*100)/100:0;
  const maxCat=pieData[0];

  pv.innerHTML=
  '<div class="card"><div class="card-h">📊 月度报表<span class="spacer"></span><span class="text-sub">'+
      (ym==='all'?'全部':(ym.split('-')[0]+'年'+(+ym.split('-')[1])+'月'))+'</span></div>'+
    monthNav(ym)+
    '<div class="grid g3 keep2" style="margin-top:12px">'+
      statBox('<span class="money-in">'+money(st.in)+'</span>','总收入',IN_C)+
      statBox('<span class="money-out">'+money(st.out)+'</span>','总支出',OUT_C,
        '较上月 '+(dOut>=0?'+':'')+money(dOut))+
      statBox('<span class="'+(st.bal>=0?'money-in':'money-out')+'">'+money(st.bal)+'</span>','本月结余',
        st.bal>=0?IN_C:OUT_C, st.in>0?('储蓄率 '+Math.round(st.bal/st.in*100)+'%'):'本月暂无收入')+
    '</div>'+
    '<div class="text-sub" style="margin-top:10px;line-height:1.9">'+reportText(st,prev,maxCat,avgOut,N)+'</div>'+
  '</div>'+
  '<div class="card"><div class="card-h">🥧 支出类别占比<span class="spacer"></span>'+
      '<div class="row" style="gap:5px;flex-wrap:nowrap">'+m3.map(m=>
        '<button class="btn mini '+(m===pm?'':'ghost')+'" onclick="App.financePieSet(\''+m+'\')">'+
        (+m.split('-')[1])+'月</button>').join('')+'</div></div>'+
    (pieTotal?'<div class="chart-box" style="height:250px"><canvas id="cvFP"></canvas><div class="chart-hint">👆 悬停看明细</div></div>'
      :A.empty('这个月还没有支出记录','记几笔之后，派大星帮你看看钱去哪儿了'))+
  '</div>'+
  '<div class="card"><div class="card-h">📈 收支趋势<span class="spacer"></span>'+
      '<div class="row" style="gap:5px;flex-wrap:nowrap">'+
        [6,12].map(n=>'<button class="btn mini '+(N===n?'':'ghost')+'" onclick="App.financeTrendSet('+n+')">近'+n+'月</button>').join('')+
      '</div></div>'+
    '<div class="chart-box" style="height:250px"><canvas id="cvFT"></canvas><div class="chart-hint">👆 悬停看明细</div></div>'+
    '<div class="legend"><span><i style="background:'+IN_C+'"></i>收入</span><span><i style="background:'+OUT_C+'"></i>支出</span></div>'+
  '</div>';

  A.redrawCharts=function(force){
    const cp=$('#cvFP');
    if(cp) A.chart(cp,'pie',{items:pieItems,unit:'元',totalText:money(pieTotal),fmt:v=>money(v)},{
      tipFmt:h=>'<b>'+esc(h.item.name)+'</b><br>'+money(h.item.value)+'　'+((h.item.value/pieTotal*100).toFixed(1))+'%',force:force});
    const cl=$('#cvFT');
    if(cl) A.chart(cl,'line',{labels:labels,datasets:[
        {data:inc,color:IN_C},{data:out,color:OUT_C}],unit:'元'},{
      tipFmt:h=>labels[h.i]+'　<b>'+money(h.v)+'</b>',force:force});
  };
  A.redrawCharts();
};
function reportText(st,prev,maxCat,avgOut,N){
  if(!st.n) return '这个月还没有流水，先去「流水记录」记一笔吧～';
  const parts=[];
  parts.push('本月共 <b>'+st.n+'</b> 笔流水，支出 <b class="money-out">'+money(st.out)+'</b>'+
    (st.in?('，收入 <b class="money-in">'+money(st.in)+'</b>'):'')+'。');
  if(maxCat) parts.push('花得最多的是 <b>'+esc(maxCat.name)+'</b>（'+money(maxCat.value)+'，占支出 '+
    (st.out?Math.round(maxCat.value/st.out*100):0)+'%）。');
  const d=st.out-prev.out;
  if(prev.out>0) parts.push('比上月'+(d>0?('<b class="money-out">多花了 '+money(d)+'</b>'):(d<0?('<b class="money-in">少花了 '+money(-d)+'</b>'):'持平'))+'。');
  if(st.bal<0) parts.push('本月<b class="money-out">入不敷出</b>，下个月要稍微收着点啦。');
  else if(st.in>0&&st.bal/st.in>=0.3) parts.push('储蓄率很健康，给你鼓个掌 👏');
  return parts.join('');
}
A.financePieSet=function(m){ A.financePieMonth=m; A.render(); };
A.financeTrendSet=function(n){ A.financeTrendN=n; A.render(); };

/* ================= 类别管理 ================= */
A.financeCat=function(pv){
  function block(type,title,ic){
    const l=cats(type);
    const used={};
    recs().forEach(r=>{ if(r.type===type&&r.cat) used[r.cat]=(used[r.cat]||0)+1; });
    return '<div class="card"><div class="card-h">'+ic+' '+title+'<span class="spacer"></span>'+
      '<button class="btn mini" onclick="App.financeCatAdd(\''+type+'\')">＋ 添加</button></div>'+
      (l.length?'<div class="cat-grid">'+l.map((c,i)=>
        '<div class="cat-chip"><span class="cc-ic" style="background:'+catColor(type,c.t)+'22">'+c.ic+'</span>'+
        '<span class="cc-t">'+esc(c.t)+'</span>'+
        (used[c.t]?'<span class="tag gray" style="font-size:10.5px">'+used[c.t]+' 笔</span>':'')+
        '<button class="cc-x" onclick="App.financeCatDel(\''+type+'\','+i+')" title="删除">✕</button></div>'
      ).join('')+'</div>':A.empty('还没有'+title,'点右上角「＋ 添加」新建一个'))+
      '</div>';
  }
  pv.innerHTML=
  '<div class="card" style="background:linear-gradient(135deg,rgba(255,255,255,.92),rgba(255,240,248,.85))">'+
    '<div style="font-weight:800;font-size:15.5px">🏷️ 类别管理</div>'+
    '<div class="text-sub" style="margin-top:4px;line-height:1.8">这里可以增删收支类别。已经记下的流水会保留原来的类别名，'+
    '删掉分类也不会让历史记录变成「未分类」。</div></div>'+
  block('out','支出类别','💸')+block('in','收入类别','💵');
  A.redrawCharts=null;
};
A.financeCatAdd=function(type){

/* 根据公历日期返回正确的农历年份（早于当年春节则属上一年） */
App.getLunarYear=function(date){
  let y,m,d;
  if(date instanceof Date){ y=date.getFullYear(); m=date.getMonth()+1; d=date.getDate(); }
  else {
    const p=String(date==null?'':date).split('-').map(Number);
    y=p[0]||0; m=p[1]; d=p[2];
    if(!y||!m||!d){ return y||0; } // 缺月/日，回退公历年
  }
  const ny=A.LUNAR_NEW_YEAR[y];
  if(!ny){ console.warn('春节数据缺失，回退至公历年份: '+y); return y; }
  const q=ny.split('-'); const nyM=+q[1], nyD=+q[2];
  if(m<nyM || (m===nyM && d<nyD)) return y-1;
  return y;
};

  if(arg==null) return '';
  if(typeof arg==='number') return ZODIAC[((arg-4)%12+12)%12];
  const ly=A.getLunarYear(arg);
  return ZODIAC[((ly-4)%12+12)%12];
};
function signOf(m,d){
  const x=m*100+d;
  for(let i=0;i<SIGNS.length;i++){
    const s=SIGNS[i],a=s.s[0]*100+s.s[1],b=s.e[0]*100+s.e[1];
    if(a<=b){ if(x>=a&&x<=b) return s; }
    else { if(x>=a||x<=b) return s; }
  }
  return null;
}
function birthStr(){ return (A.DB.profile&&A.DB.profile.birthday)||(A.DB.fortune&&A.DB.fortune.birthDate)||''; }
function signOfBirth(){
  const b=birthStr(); if(!b) return null;
  const p=String(b).split('-').map(Number);
  if(p.length<3||!p[1]||!p[2]) return null;
  return signOf(p[1],p[2]);
}
A.fortuneZodiac=A.zodiacOf; A.fortuneSign=signOfBirth;

/* ---------------- 确定性随机（日期种子） ---------------- */
function seedOf(str){
  let h=2166136261; const s=String(str);
  for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); }
  return h>>>0;
}
function rngFrom(seed){
  let a=seed>>>0;
  return function(){
    a=a+0x6D2B79F5|0;
    let t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}
function pick(arr,r){ return arr[Math.floor(r()*arr.length)%arr.length]; }

/* ---------------- 数据访问 ---------------- */
function F(){
  if(!A.DB.fortune||typeof A.DB.fortune!=='object') A.DB.fortune={birthDate:'',dailyCard:null,logs:[]};
  const f=A.DB.fortune;
  if(!Array.isArray(f.logs)) f.logs=[];
  if(f.dailyCard&&typeof f.dailyCard!=='object') f.dailyCard=null;
  return f;
}
A.fortuneData=F;

function buildCard(date,manual){
  const r=manual?Math.random:rngFrom(seedOf('tarot|'+date));
  const cardId=Math.min(21,Math.floor(r()*22));
  const isReversed=r()<0.42;
  const c=TAROT[cardId];
  const star=isReversed?(r()<0.35?3:2):(r()<0.35?5:4);
  const color=COLORS[Math.floor(r()*COLORS.length)%COLORS.length];
  const number=1+Math.floor(r()*9);
  const keys=isReversed?c.rev:c.up;
  const msg=isReversed?c.revMsg:c.upMsg;
  const z=A.zodiacOf(new Date());
  const s=signOfBirth();
  const bz=birthStr()?A.zodiacOf(birthStr()):'';
  const who=[bz?('属'+bz):z,s?s.t:''].filter(Boolean).join(' · ');
  const bless=pick(BLESS[star]||BLESS[3],r);
  const comment=pick(COMMENT[star]||COMMENT[3],r);
  const reading='<b>【'+c.n+'】'+(isReversed?'逆位':'正位')+'</b>　关键词：'+keys.join('、')+'。<br>'+msg+
    (who?('<br>给'+who+'的你：'+bless):'');
  return {date:date,cardId:cardId,cardName:c.n,isReversed:isReversed,star:star,
    color:color.t,colorHex:color.c,number:number,comment:comment,reading:reading,
    revealed:false,manual:!!manual,generatedAt:Date.now()};
}
function upsertLog(c){
  const f=F();
  const i=f.logs.findIndex(x=>x.date===c.date);
  const row={date:c.date,cardId:c.cardId,cardName:c.cardName,isReversed:c.isReversed,
    star:c.star,color:c.color,colorHex:c.colorHex,number:c.number,comment:c.comment,
    reading:c.reading,note:(i>=0?f.logs[i].note:'')||'',createdAt:Date.now()};
  if(i>=0){ row.createdAt=f.logs[i].createdAt||row.createdAt; f.logs[i]=row; }
  else f.logs.push(row);
  if(f.logs.length>400) f.logs=f.logs.slice(-400);
  return row;
}
A.fortuneUpsertLog=upsertLog;

/* 启动时调用：保证当天有且仅有一张「日期种子」固定的牌 */
A.ensureFortune=function(){
  try{
    const f=F(),d=today();
    f.birthDate=birthStr();
    if(!f.dailyCard||f.dailyCard.date!==d||f.dailyCard.cardId==null){
      const c=buildCard(d,false);
      f.dailyCard=c; upsertLog(c);
      A.save('fortune');
    }

  }catch(e){ console.warn('ensureFortune 失败',e); return null; }
};

/* 压缩并存入 IndexedDB */
A.uploadBg=function(input){
  const f=input.files&&input.files[0]; if(!f) return;
  A.toast('正在压缩图片…');
  const fr=new FileReader();
  fr.onload=()=>{
    const img=new Image();
    img.onload=async()=>{
      try{
        let w=img.width,h=img.height,MAX=1600;
        if(w>MAX){ h=Math.round(h*MAX/w); w=MAX; }
        const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        let blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.78));
        if(blob&&blob.size>900*1024){ blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.6)); }
        if(!blob) throw new Error('压缩失败');
        await A.idb.set('bgImage',blob);
        A.DB.settings.bgImage='idb:bgImage';
        A.save('settings'); A.applyTheme(); A.render();
        A.toast('背景已更换（'+Math.round(blob.size/1024)+' KB，存于 IndexedDB）','ok');
      }catch(e){ A.toast('图片处理失败：'+e.message,'err'); }
    };
    img.onerror=()=>A.toast('不是有效的图片','err');
    img.src=fr.result;
  };
  fr.readAsDataURL(f);
  input.value='';
};

};
/* 手动检查更新：若已有新版本待激活则立即切换，否则强制刷新 */
A.checkForUpdate=function(){
  if(!('serviceWorker' in navigator)){ location.reload(true); return; }
  try{
    const p=navigator.serviceWorker.getRegistration();
    Promise.resolve(p).then(function(reg){
      if(reg&&reg.waiting){ reg.waiting.postMessage('SKIP_WAITING'); }
      else location.reload(true);
    }).catch(function(){ location.reload(true); });
  }catch(e){ location.reload(true); }
};
A.resetAll=function(){
  A.confirmBox('清空全部数据','⚠️ 这会清空全部待办、运动、体重、心情、生日与设置（会先存一份快照）。确定继续吗？',()=>{
    A.makeBackup('清空前');
    localStorage.removeItem('happyDiary_DB_v1');
    A.replaceDB(A.defaultDB()); A.saveAll(); A.applyTheme(); A.go('home');
    A.toast('已清空，可到设置里恢复快照','ok');
  },'确定清空');
};

/* ---------- 版本更新日志 ---------- */
const CL_TYPES={major:['大版本','cl-major'],feature:['新功能','cl-feature'],improve:['优化','cl-improve'],fix:['修复','cl-fix']};
function clSortKey(v){ const p=String(v||'').split('.').map(n=>parseInt(n,10)||0); return (p[0]||0)*1000000+(p[1]||0)*1000+(p[2]||0); }
/* 返回日志列表 HTML（按版本号倒序，最新在上） */
A.changelogRender=function(){
  const list=(A.DB.meta.changelog||[]).slice().sort((a,b)=>clSortKey(b.version)-clSortKey(a.version));
  if(!list.length) return '<div class="empty" style="padding:12px">暂无更新日志，点下方“+ 添加当前版本”记录第一条吧～</div>';
  return list.map(e=>{
    const tp=CL_TYPES[e.type]||CL_TYPES.fix;
    return '<div class="cl-item" id="cl-'+esc(e.version)+'">'+
      '<div class="cl-head"><b>v'+esc(e.version)+'</b>'+
        (e.date?' <span class="cl-date">'+esc(e.date)+'</span>':'')+
        ' <span class="cl-tag '+tp[1]+'">'+tp[0]+'</span></div>'+
      '<ul class="cl-changes">'+(e.changes||[]).map(c=>'<li>'+esc(c)+'</li>').join('')+'</ul>'+
    '</div>';
  }).join('');
};
/* 列表 + 底部“添加”按钮，统一填充到 #changelogBox */
function clBoxHTML(){
  return A.changelogRender()+
    '<div class="row" style="margin-top:8px"><button class="btn mini ghost" onclick="App.changelogAdd()">+ 添加当前版本</button></div>';
}
/* 展开 / 收起日志（可指定 force 强制状态） */
A.toggleChangelog=function(force){
  const box=$('#changelogBox'); if(!box) return;
  const open=(typeof force==='boolean')?force:(box.style.display!=='block');
  box.style.display=open?'block':'none';
  if(open) box.innerHTML=clBoxHTML();
  const btn=$('#clToggleBtn'); if(btn) btn.innerHTML=open?'📁 收起更新日志':'📋 查看更新日志';
};
/* 打开“添加当前版本”弹窗 */
A.changelogAdd=function(){
  const d=A.today();
  A.openModal('添加当前版本',
    '<label class="fld"><span>版本号（如 2.1.1）</span><input type="text" id="cl_ver" value="'+esc(A.VERSION)+'" placeholder="x.y.z"></label>'+
    '<label class="fld"><span>日期（YYYY-MM-DD）</span><input type="text" id="cl_date" value="'+esc(d)+'"></label>'+
    '<label class="fld"><span>类型</span><select id="cl_type">'+
      '<option value="feature">新功能</option><option value="major">大版本</option><option value="improve">优化</option><option value="fix">修复</option></select></label>'+
    '<label class="fld"><span>变更内容（每行一条）</span><textarea id="cl_changes" rows="4" placeholder="新增了 XX 功能&#10;修复了 YY 问题"></textarea></label>',
    '<button class="btn ghost" onclick="App.closeModal()">取消</button><button class="btn" onclick="App.changelogSave()">保存</button>',
    null);
};
/* 保存新增日志条目 */
A.changelogSave=function(){
  const ver=$('#cl_ver').value.trim();
  const date=$('#cl_date').value.trim();
  const type=$('#cl_type').value;
  const changes=$('#cl_changes').value.split('\n').map(s=>s.trim()).filter(Boolean);
  if(!ver){ A.toast('请填写版本号','err'); return false; }
  if(!changes.length){ A.toast('请至少填写一条变更内容','err'); return false; }
  A.DB.meta.changelog=A.DB.meta.changelog||[];
  A.DB.meta.changelog.push({version:ver,date:date,type:type,changes:changes});
  A.save('meta');
  A.closeModal();
  A.toggleChangelog(true);
  A.toast('已添加到更新日志','ok');
};
/* 从自动提示进入：打开关于页 → 展开日志 → 高亮最新条目 */
A.openChangelog=function(){
  A.closeModal();
  A.go('set:about');
  const box=$('#changelogBox'); if(box){ box.style.display='block'; box.innerHTML=clBoxHTML(); }
  const btn=$('#clToggleBtn'); if(btn) btn.innerHTML='📁 收起更新日志';
  setTimeout(()=>{
    const first=$('#changelogBox .cl-item');
    if(first){ first.scrollIntoView({behavior:'smooth',block:'center'}); first.classList.add('cl-hl'); setTimeout(()=>first.classList.remove('cl-hl'),2600); }
  },350);
};
})(window.App=window.App||{});
</script>

<script>

(function(A){

function shopRow(it){

A.shoppingEdit=function(id){

    '<label class="fld"><span>优先级</span><select id="sp_pri">'+
      '<option value="high"'+(it.priority==='high'?' selected':'')+'>高</option>'+
      '<option value="mid"'+(it.priority==='mid'?' selected':'')+'>中</option>'+
      '<option value="low"'+(it.priority==='low'?' selected':'')+'>低</option></select></label>'+

let bubbleTimer=null;
A.petSay=function(msg){
  const b=$('#petBubble'); if(!b) return;
  b.textContent=msg; b.classList.add('show');
  clearTimeout(bubbleTimer);
  bubbleTimer=setTimeout(()=>b.classList.remove('show'),3600);
};
function petInit(){
  const pet=$('#pet'); if(!pet) return;
  let moving=false,sx=0,sy=0,sr=0,sb=0,dragged=false;
  const clampPos=(r,b)=>{
    const w=pet.offsetWidth||110,h=pet.offsetHeight||120;
    return {r:A.clamp(r,4,Math.max(4,window.innerWidth-w-4)),b:A.clamp(b,4,Math.max(4,window.innerHeight-h-4))};
  };
  pet.addEventListener('pointerdown',e=>{
    const rect=pet.getBoundingClientRect();
    sr=window.innerWidth-rect.right; sb=window.innerHeight-rect.bottom;
    sx=e.clientX; sy=e.clientY; moving=true; dragged=false;
    if(pet.setPointerCapture) pet.setPointerCapture(e.pointerId);
  });
  window.addEventListener('pointermove',e=>{
    if(!moving) return;
    const dx=e.clientX-sx,dy=e.clientY-sy;
    if(Math.abs(dx)>6||Math.abs(dy)>6) dragged=true;
    const p=clampPos(sr-dx,sb+dy);
    pet.style.right=p.r+'px'; pet.style.bottom=p.b+'px'; pet.style.left='auto'; pet.style.top='auto';
  },{passive:true});
  window.addEventListener('pointerup',()=>{
    if(!moving) return; moving=false;
    if(dragged){
      const rect=pet.getBoundingClientRect();
      A.DB.settings.petPos={r:Math.round(window.innerWidth-rect.right),b:Math.round(window.innerHeight-rect.bottom)};
      A.save('settings');
    }
  });
  const COSTUMES=['none','duck','box'];
  function applyCostume(c){
    pet.classList.remove('pet-costume-none','pet-costume-duck','pet-costume-box');
    if(COSTUMES.includes(c)&&c!=='none') pet.classList.add('pet-costume-'+c);
  }
  applyCostume(A.DB.settings.petCostume);
  pet.addEventListener('click',()=>{
    if(dragged) return;
    const idx=(COSTUMES.indexOf(A.DB.settings.petCostume)+1)%COSTUMES.length;
    A.DB.settings.petCostume=COSTUMES[idx];
    A.save('settings');
    applyCostume(A.DB.settings.petCostume);
    const list=(A.DB.settings.petWords&&A.DB.settings.petWords.length)?A.DB.settings.petWords:DEFAULT_WORDS;
    let msg=list[Math.floor(Math.random()*list.length)];
    const h=new Date().getHours();
    if(h>=23||h<5) msg='这么晚啦，早点睡，明天继续加油～';
    pet.classList.add('dance');
    const mouth=$('#petMouth'); if(mouth) mouth.setAttribute('d','M37 56 Q50 70 63 56');
    A.petSay(msg);
    setTimeout(()=>{ pet.classList.remove('dance'); const m=$('#petMouth'); if(m) m.setAttribute('d','M39 57 Q50 67 61 57'); },2600);
  });
  const p=A.DB.settings.petPos; if(p){ pet.style.right=p.r+'px'; pet.style.bottom=p.b+'px'; }
}

/* ---------- PWA ---------- */
function starPath(c){
  const pts=[[50,12],[60,40],[90,41],[66,60],[75,92],[50,75],[25,92],[34,60],[10,41],[40,40]];
  c.beginPath(); pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1])); c.closePath();
}
function makeIcon(size){
  const cv=document.createElement('canvas'); cv.width=size; cv.height=size;
  const c=cv.getContext('2d');
  c.fillStyle='#ffd9ea'; c.fillRect(0,0,size,size);
  c.save(); c.scale(size/100,size/100);
  starPath(c); c.fillStyle='#ff9ec4'; c.fill(); c.lineWidth=2; c.strokeStyle='#ef7fae'; c.stroke();
  c.save(); c.clip();
  c.beginPath(); c.moveTo(0,64); c.quadraticCurveTo(30,57,50,64); c.quadraticCurveTo(70,71,100,64); c.lineTo(100,112); c.lineTo(0,112); c.closePath();
  c.fillStyle='#7fd18c'; c.fill();
  [[30,78],[70,80],[50,98]].forEach(p=>{ c.beginPath(); c.arc(p[0],p[1],4.4,0,7); c.fillStyle='#c78ce8'; c.fill(); });
  c.restore();
  [40,61].forEach(x=>{ c.beginPath(); c.arc(x,46,9.5,0,7); c.fillStyle='#fff'; c.fill(); c.lineWidth=1.3; c.strokeStyle='#ef7fae'; c.stroke(); });
  [41,60].forEach(x=>{ c.beginPath(); c.arc(x,47,3.8,0,7); c.fillStyle='#3a2a3a'; c.fill(); });
  c.beginPath(); c.moveTo(39,57); c.quadraticCurveTo(50,67,61,57); c.lineWidth=2.6; c.strokeStyle='#3a2a3a'; c.lineCap='round'; c.stroke();
  c.restore();
  return cv.toDataURL('image/png');
}
function injectPWA(){
  try{
    const proto=location.protocol;
    /* 线上（http/https）：使用同源的真实 manifest 并注册 Service Worker，
       这是 Android Chrome 判定“可安装”并隐藏地址栏的必要条件 */
    if(proto==='http:'||proto==='https:'){
      const lm=document.createElement('link'); lm.rel='manifest'; lm.href='./manifest.json'; document.head.appendChild(lm);
      const ai=document.createElement('link'); ai.rel='apple-touch-icon'; ai.href='./icon-180.png'; document.head.appendChild(ai);
      const fi=document.createElement('link'); fi.rel='icon'; fi.type='image/png'; fi.href='./icon-192.png'; document.head.appendChild(fi);
      if('serviceWorker' in navigator){
        /* 注册时禁止浏览器缓存 sw.js，确保每次都能检测到新版本 */
        let swRefreshing=false;
        navigator.serviceWorker.addEventListener('controllerchange',function(){
          if(!swRefreshing){ swRefreshing=true; location.reload(); }
        });
        function showSwUpdate(){
          if(document.getElementById('swUpdateBar')) return;
          const bar=document.createElement('div'); bar.id='swUpdateBar';
          bar.innerHTML='<span>🎉 发现新版本，点击立即更新</span><button id="swUpdateBtn" type="button">立即更新</button>';
          (document.body||document.documentElement).appendChild(bar);
          bar.querySelector('#swUpdateBtn').addEventListener('click',function(){
            navigator.serviceWorker.getRegistration().then(function(r){
              if(r&&r.waiting) r.waiting.postMessage('SKIP_WAITING');
              else location.reload(true);
            }).catch(function(){ location.reload(true); });
          });
        }
        /* 注册 URL 附带版本参数：穿透平台边缘缓存，
           保证手机端每次都能发现真正的最新 sw.js（边缘缓存按完整 URL 键控，
           裸路径 /sw.js 曾被证实会长期返回旧版）。 */
        navigator.serviceWorker.register('./sw.js?v=17',{updateViaCache:'none'}).then(function(reg){
          /* 已有新版本在等待激活：直接提示 */
          if(reg.waiting && navigator.serviceWorker.controller) showSwUpdate();
          reg.addEventListener('updatefound',function(){
            const nw=reg.installing; if(!nw) return;
            nw.addEventListener('statechange',function(){
              if(nw.state==='installed' && navigator.serviceWorker.controller) showSwUpdate();
            });
          });
        }).catch(function(e){ console.warn('SW 注册失败',e); });
      }
      return;
    }
    /* 本地 file:// 直接打开：浏览器不允许注册 SW，退化为动态图标 + 主题色 */
    const icon=makeIcon(512),icon180=makeIcon(180);
    const mf={name:'我的快乐日记',short_name:'快乐日记',start_url:location.href.split('#')[0],scope:'./',
      display:'standalone',orientation:'portrait',background_color:'#ffe9f3',theme_color:'#ffd9ea',
      description:'派大星主题的个人工作平台：行情、诗词、运动、待办、生日、体重、心情',
      icons:[{src:icon,sizes:'512x512',type:'image/png',purpose:'any maskable'},{src:icon180,sizes:'180x180',type:'image/png'}]};
    const l=document.createElement('link'); l.rel='manifest';
    l.href=URL.createObjectURL(new Blob([JSON.stringify(mf)],{type:'application/manifest+json'}));
    document.head.appendChild(l);
    const ap=document.createElement('link'); ap.rel='apple-touch-icon'; ap.href=icon180; document.head.appendChild(ap);
    const dl=document.createElement('link'); dl.rel='icon'; dl.type='image/png'; dl.href=icon180;
    const old=$('#appIcon'); if(old&&old.remove) old.remove();
    document.head.appendChild(dl);
    /* 本地文件模式一次性说明：解释为何没有安装按钮，并给出主屏幕快捷方式指引 */
    try{
      if(!localStorage.getItem('hd_file_hint_v231')){
        localStorage.setItem('hd_file_hint_v231','1');
        setTimeout(function(){
          A.openModal('📄 本地文件模式',
            '<div style="font-size:14.5px;line-height:1.9">你现在用的是<b>本地文件模式</b>：数据完全存在本机，<b>离线可用、永不打烊</b>。<br><br>'+
            '由于浏览器安全规则，<b>file:// 打开无法注册 Service Worker</b>，因此 Chrome 不会显示「安装应用」按钮，也无法装成无地址栏的独立应用。<br><br>'+
            '想要桌面图标：点 Chrome 右上角菜单 → <b>「添加到主屏幕」</b>，即可生成一个快捷方式（打开时仍在浏览器标签内，功能完全一致）。</div>',
            '<button class="btn" onclick="App.closeModal()">知道了</button>',null);
        },1200);
      }
    }catch(_){ /* localStorage 不可用时静默跳过 */ }
  }catch(e){ console.warn('PWA 图标生成失败',e); }
}
