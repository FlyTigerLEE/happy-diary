<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffd9ea">
<meta name="color-scheme" content="light">
<meta name="format-detection" content="telephone=no,date=no,address=no,email=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="我的快乐日记">
<meta name="application-name" content="我的快乐日记">
<meta name="description" content="我的快乐日记 - 派大星主题的个人工作平台">
<title>我的快乐日记</title>
<link rel="icon" id="appIcon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23ffd9ea'/%3E%3Cpath d='M32 12c8 0 14 10 14 20s-6 18-14 18-14-8-14-18 6-20 14-20z' fill='%23ff9ec4'/%3E%3Ccircle cx='26' cy='32' r='4' fill='%23fff'/%3E%3Ccircle cx='38' cy='32' r='4' fill='%23fff'/%3E%3Ccircle cx='26' cy='32' r='2' fill='%23333'/%3E%3Ccircle cx='38' cy='32' r='2' fill='%23333'/%3E%3Cpath d='M26 42c4 4 8 4 12 0' stroke='%23333' stroke-width='2.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/* ============ 基础与主题变量 ============ */
:root{
  --bg-a:#ffe9f3; --bg-b:#efe7ff; --bg-c:#e4f1ff;
  --card:rgba(255,255,255,.80);
  --card-solid:#ffffff;
  --text:#40304a; --text-sub:#83748c;
  --line:rgba(180,140,180,.20);
  --accent:#ff6fa5; --accent-soft:#ffe0ee; --accent-2:#a98bf5; --accent-3:#5fb8f7;
  --up:#e13b3b; --down:#12a05c; --warn:#ff9f43;
  --radius:18px; --radius-sm:12px;
  --shadow:0 10px 30px rgba(190,130,170,.18);
  --shadow-sm:0 4px 14px rgba(190,130,170,.14);
  --sidebar-w:236px;
  --toast-top:78px;
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC","Noto Sans CJK SC",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;font-family:var(--font);color:var(--text);font-size:15px;line-height:1.6;
  background:#fdeff6;overflow-x:hidden;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body.is-loading{cursor:progress}
#bgLayer{position:fixed;inset:0;z-index:-2;background:linear-gradient(135deg,var(--bg-a) 0%,var(--bg-b) 50%,var(--bg-c) 100%);transition:background-image .45s ease}
#bgLayer.has-img{background-size:cover;background-position:center;background-repeat:no-repeat}
#bgMask{position:fixed;inset:0;z-index:-1;background:rgba(255,255,255,.35);pointer-events:none;transition:background .3s}
body.bg-dark #bgMask{background:rgba(48,32,54,.42)}
body.bg-dark{color:#f6eef8}
body.bg-dark .card,body.bg-dark .sidebar,body.bg-dark .topbar{background:rgba(58,42,66,.72);color:#f6eef8;border-color:rgba(255,255,255,.12)}
body.bg-dark .nav-item,body.bg-dark .sub-item{color:#e8dbee}
body.bg-dark .text-sub{color:#c6b6ce}
body.bg-dark input,body.bg-dark select,body.bg-dark textarea{background:rgba(255,255,255,.10);color:#f6eef8;border-color:rgba(255,255,255,.16)}
body.bg-dark .list-row,body.bg-dark .mood-cell,body.bg-dark .qcard,body.bg-dark .stat-box{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.10)}
body.bg-dark .modal-body,body.bg-dark .modal-head,body.bg-dark .modal-foot{background:rgba(64,46,72,.97);color:#f6eef8}
body.bg-dark .chart-tip{background:rgba(28,18,34,.95)}

/* ============ 布局 ============ */
.app{display:flex;min-height:100%;min-height:100dvh}
.sidebar{width:var(--sidebar-w);flex:0 0 var(--sidebar-w);position:fixed;top:0;bottom:0;left:0;z-index:60;
  display:flex;flex-direction:column;background:rgba(255,255,255,.72);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-right:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 14px) 12px calc(env(safe-area-inset-bottom) + 14px) 12px;
  transition:transform .28s cubic-bezier(.4,0,.2,1),width .24s cubic-bezier(.4,0,.2,1),flex-basis .24s;overflow:hidden}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 14px;position:relative}
.brand-logo{width:40px;height:40px;flex:0 0 40px}
.brand-txt b{display:block;font-size:16.5px;letter-spacing:.5px}
.brand-txt span{font-size:11.5px;color:var(--text-sub);white-space:nowrap}
.side-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:10px;-webkit-overflow-scrolling:touch}
.side-scroll::-webkit-scrollbar{width:5px}
.side-scroll::-webkit-scrollbar-thumb{background:rgba(255,111,165,.35);border-radius:4px}

.nav-group{margin-bottom:6px;position:relative}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:0;border-radius:14px;
  background:transparent;font:inherit;font-size:14.5px;color:var(--text);cursor:pointer;text-align:left;
  transition:background .18s,color .18s;position:relative;white-space:nowrap}
.nav-item .ic{font-size:17px;width:22px;text-align:center;flex:0 0 22px}
.nav-item .arrow{margin-left:auto;font-size:11px;transition:transform .22s;color:var(--text-sub)}
.nav-item.open .arrow{transform:rotate(90deg)}
.nav-item:hover{background:rgba(255,111,165,.10)}
.nav-item.active{background:linear-gradient(90deg,var(--accent-soft),rgba(255,255,255,.2));color:#d93b79;font-weight:600}
.sub-wrap{display:none;padding:2px 0 6px 6px;margin:2px 0 6px 8px;border-left:2px dashed rgba(255,111,165,.28)}
.nav-group.open .sub-wrap{display:block}
.sub-item{display:block;width:100%;padding:7px 12px;border:0;background:transparent;font:inherit;font-size:13.5px;
  color:var(--text-sub);text-align:left;border-radius:10px;cursor:pointer;white-space:nowrap}
.sub-item:hover{background:rgba(255,111,165,.08);color:var(--text)}
.sub-item.active{background:rgba(255,111,165,.16);color:#d93b79;font-weight:600}
.side-foot{padding-top:10px;border-top:1px solid var(--line);font-size:11.5px;color:var(--text-sub);
  display:flex;justify-content:space-between;align-items:center;gap:6px;overflow:hidden}
.sync-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--down);box-shadow:0 0 0 3px rgba(18,160,92,.15);flex:0 0 8px}
.sync-dot.off{background:#c9c2cf;box-shadow:0 0 0 3px rgba(180,170,190,.15)}
.sync-dot.busy{background:var(--warn);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}

/* 侧边栏折叠（PC） */
body.nav-collapsed .sidebar{width:70px;flex-basis:70px;padding-left:8px;padding-right:8px}
body.nav-collapsed .main{margin-left:70px}
body.nav-collapsed .brand-txt,body.nav-collapsed .side-foot span:not(.sync-dot),
body.nav-collapsed .nav-item>span:not(.ic),body.nav-collapsed .nav-item .arrow{display:none}
body.nav-collapsed .nav-item{justify-content:center;padding:11px 0}
body.nav-collapsed .nav-item.active::after{content:"";position:absolute;left:-4px;top:50%;transform:translateY(-50%);
  width:3px;height:20px;border-radius:3px;background:var(--accent)}
body.nav-collapsed .nav-group.open .sub-wrap{display:block;position:absolute;left:62px;top:0;min-width:158px;
  background:var(--card-solid);border-radius:14px;padding:6px;box-shadow:var(--shadow);z-index:80;border:1px solid var(--line);margin:0}
body.nav-collapsed .sub-item{font-size:13px}
body.nav-collapsed .brand{justify-content:center}

.main{flex:1;min-width:0;margin-left:var(--sidebar-w);
  padding:calc(env(safe-area-inset-top) + 14px) 20px calc(env(safe-area-inset-bottom) + 40px) 20px;
  transition:margin-left .24s cubic-bezier(.4,0,.2,1)}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:16px;padding:10px 14px;border-radius:16px;
  background:rgba(255,255,255,.62);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--line);box-shadow:var(--shadow-sm);position:sticky;top:calc(env(safe-area-inset-top) + 6px);z-index:30}
.menu-btn,.collapse-btn{display:none;border:0;background:var(--accent-soft);color:#d93b79;width:38px;height:38px;
  border-radius:12px;font-size:18px;cursor:pointer;flex:0 0 38px;place-items:center}
.collapse-btn{display:grid}
.topbar h1{margin:0;font-size:18px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .sub{font-size:12px;color:var(--text-sub);font-weight:400;margin-left:8px}
.top-actions{display:flex;gap:8px;align-items:center}
.icon-btn{border:0;background:rgba(255,255,255,.7);color:var(--text);width:36px;height:36px;border-radius:12px;
  cursor:pointer;font-size:16px;display:grid;place-items:center;border:1px solid var(--line);transition:transform .15s}
.icon-btn:active{transform:scale(.92)}
.icon-btn.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hello-chip{font-size:12.5px;color:#d93b79;background:var(--accent-soft);padding:6px 12px;border-radius:999px;white-space:nowrap}

/* ============ 卡片与通用 ============ */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;
  box-shadow:var(--shadow-sm);margin-bottom:14px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
/* ===== 首页模块拖拽排序 ===== */
.home-mod{display:flex;align-items:flex-start;gap:10px;margin-bottom:14px}
.home-mod .mod-inner{flex:1;min-width:0}
.home-mod .card,.home-mod .grid{margin:0}
.drag-handle{display:none;flex:0 0 auto;align-self:stretch;width:30px;border:none;background:transparent;
  color:var(--accent);font-size:24px;line-height:1;cursor:grab;align-items:center;justify-content:center;
  border-radius:12px;touch-action:none;user-select:none;-webkit-user-select:none}
.drag-handle:active{cursor:grabbing}
.sorting .drag-handle{display:flex}
.sorting .home-mod{cursor:grab;background:rgba(255,255,255,.55);border:1px dashed rgba(255,143,190,.5);
  border-radius:16px;padding:8px;box-shadow:0 8px 22px rgba(255,143,190,.22);transform:translateY(-2px);
  transition:box-shadow .2s,transform .2s,background .2s;user-select:none;-webkit-user-select:none}
body.bg-dark .sorting .home-mod{background:rgba(90,60,100,.45);border-color:rgba(255,143,190,.4)}
.sorting .home-mod:active{cursor:grabbing}
.home-mod.dragging{box-shadow:0 18px 44px rgba(180,90,150,.4);border:1px solid rgba(255,143,190,.6);
  border-radius:16px;background:rgba(255,255,255,.94);transform:scale(1.02);cursor:grabbing;z-index:1000}
body.bg-dark .home-mod.dragging{background:rgba(80,55,90,.95)}
.home-mod-placeholder{flex:0 0 auto;border:2px dashed rgba(255,143,190,.55);border-radius:16px;
  background:rgba(255,143,190,.10);margin-bottom:14px}
.icon-btn.active{background:linear-gradient(135deg,#ff8fbe,#a98bf5);color:#fff;border-color:transparent}
.dragging-active{user-select:none;-webkit-user-select:none}
body.dragging-active{cursor:grabbing}
.card-h{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:15.5px;font-weight:700}
.card-h .ic{font-size:18px}
.spacer{flex:1}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.text-sub{color:var(--text-sub);font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
button,input,select,textarea{font-family:inherit;font-size:14px}
.btn{border:0;border-radius:12px;padding:9px 16px;cursor:pointer;font-size:14px;font-weight:600;
  background:linear-gradient(135deg,var(--accent),#ff8fbe);color:#fff;box-shadow:0 4px 12px rgba(255,111,165,.32);
  transition:transform .12s,filter .2s;position:relative}
.btn:active{transform:scale(.96)}
.btn:hover{filter:brightness(1.04)}
.btn.ghost{background:rgba(255,255,255,.7);color:var(--text);border:1px solid var(--line);box-shadow:none}
.btn.mini{padding:6px 12px;font-size:13px;border-radius:10px}
.btn.danger{background:linear-gradient(135deg,#ff6b6b,#ff8fa3)}
.btn.ok{background:linear-gradient(135deg,#4ecb8f,#7ddcae)}
.btn:disabled,.btn.loading{opacity:.7;cursor:wait}
.btn.loading::before{content:"";display:inline-block;width:13px;height:13px;margin-right:7px;vertical-align:-2px;
  border:2px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
.btn.ghost.loading::before{border-color:rgba(150,120,160,.35);border-top-color:var(--accent)}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=password],select,textarea{
  padding:9px 12px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.75);
  color:var(--text);outline:none;width:100%;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,111,165,.16)}
textarea{resize:vertical;min-height:70px;line-height:1.6}
label.fld{display:block;margin-bottom:10px;font-size:13px;color:var(--text-sub)}
label.fld>span{display:block;margin-bottom:5px}
.chk{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;color:var(--text);cursor:pointer;user-select:none}
.chk input{width:17px;height:17px;accent-color:var(--accent)}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;background:var(--accent-soft);color:#d93b79}
.tag.g{background:#e3f7ee;color:#0d7a4a}
.tag.b{background:#e6f0ff;color:#2563a8}
.tag.o{background:#fff0dd;color:#a06415}
.tag.p{background:#f3e8ff;color:#6b46c1}
.tag.gray{background:rgba(160,140,170,.16);color:var(--text-sub)}
/* ---------- 版本更新日志 ---------- */
.cl-item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;transition:box-shadow .35s,background .35s}
.cl-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;margin-bottom:4px}
.cl-head b{font-size:14.5px}
.cl-date{color:var(--text-sub);font-size:12.5px}
.cl-tag{display:inline-block;padding:1px 9px;border-radius:999px;font-size:11.5px;font-weight:600;line-height:1.6}
.cl-major{background:rgba(224,90,90,.16);color:#cf4545}
.cl-feature{background:rgba(40,160,100,.16);color:#18945d}
.cl-improve{background:rgba(64,128,220,.16);color:#2f6fd0}
.cl-fix{background:rgba(140,140,150,.20);color:#5a5a66}
.cl-changes{margin:4px 0 0;padding-left:18px}
.cl-changes li{margin:2px 0;line-height:1.7;font-size:13.5px}
.cl-hl{box-shadow:0 0 0 3px rgba(255,120,170,.55);background:rgba(255,210,235,.6);animation:clPulse 1.2s ease 2}
@keyframes clPulse{0%,100%{box-shadow:0 0 0 3px rgba(255,120,170,.55)}50%{box-shadow:0 0 0 7px rgba(255,120,170,.18)}}
.stat-box{background:rgba(255,255,255,.55);border-radius:14px;padding:12px;text-align:center;border:1px solid var(--line)}

/* 空状态（带派大星插画） */
.empty{text-align:center;color:var(--text-sub);padding:24px 10px;font-size:13.5px}
.empty-pet{width:92px;height:92px;margin:0 auto 8px;display:block;opacity:.92;
  animation:floaty 3.2s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.empty .fun{display:block;font-size:13px;color:#c76b95;margin-top:4px}

.list-row{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:13px;
  background:rgba(255,255,255,.62);border:1px solid var(--line);margin-bottom:9px;transition:transform .12s}
.list-row:hover{transform:translateX(2px)}
.list-row .lr-main{flex:1;min-width:0}
/* 装备管理标签页切换 */
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{flex:1;min-width:120px;text-align:center;padding:10px 12px;border-radius:12px;cursor:pointer;
  font-size:14.5px;font-weight:700;border:1px solid var(--line);background:rgba(255,255,255,.5);color:var(--text-sub);transition:.15s}
.tab:hover{background:rgba(255,255,255,.85)}
.tab.on{background:linear-gradient(135deg,#ffd9e8,#e7d6ff);color:var(--text);border-color:transparent;box-shadow:0 3px 10px rgba(180,120,200,.18)}
.list-row .lr-title{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-row .lr-sub{font-size:12px;color:var(--text-sub);margin-top:2px}
.list-row.done .lr-title{text-decoration:line-through;color:var(--text-sub)}
/* ===== 时光日记 ===== */
.people-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.people-tag{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:999px;font-size:12px;
  background:rgba(255,255,255,.7);border:1px solid var(--line);color:var(--text)}
.people-tag .dot{width:8px;height:8px;border-radius:50%;flex:none}
.diary-form{display:flex;flex-direction:column;gap:10px;margin-bottom:6px}
.diary-form textarea{width:100%;min-height:64px;resize:vertical;font:inherit;padding:10px 12px;border-radius:12px;
  border:1px solid var(--line);background:rgba(255,255,255,.7);color:var(--text)}
.diary-form input[type=text]{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);
  background:rgba(255,255,255,.7);color:var(--text);font:inherit}
.diary-date{font-size:13px;color:var(--text-sub);font-weight:700}
.diary-content{font-size:14.5px;line-height:1.5;margin-top:3px}
/* 亮点卡片 / 热力图 */
.hl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:6px}
.hl-card{background:rgba(255,255,255,.62);border:1px solid var(--line);border-radius:14px;padding:13px 14px}
.hl-card .hl-k{font-size:12px;color:var(--text-sub);margin-bottom:7px}
.hl-card .hl-v{font-size:20px;font-weight:800;color:var(--text)}
.hl-list{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.hl-item{display:flex;align-items:center;gap:8px;font-size:13.5px}
.hl-item .hl-rank{width:20px;height:20px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:800;background:linear-gradient(135deg,#ffd9e8,#e7d6ff);color:#a04b86}
.hl-item .hl-bar{height:7px;border-radius:6px;background:linear-gradient(90deg,#ffc0d8,#c9b3ff);margin-left:auto}
.heat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.heat-card{position:relative;border-radius:14px;padding:16px 12px;text-align:center;cursor:pointer;
  border:1px solid var(--line);background:rgba(255,255,255,.55);transition:.15s;overflow:hidden}
.heat-card:hover{transform:translateY(-2px);box-shadow:0 5px 14px rgba(180,120,200,.16)}
.heat-card .hc-m{font-size:13px;color:var(--text-sub)}
.heat-card .hc-n{font-size:22px;font-weight:800;margin-top:4px;color:var(--text)}
.heat-card .hc-bar{position:absolute;left:0;bottom:0;height:4px;background:linear-gradient(90deg,#ff9ec4,#b694ff)}
.heat-card.zero{opacity:.55}
.timeline{display:flex;flex-direction:column;gap:9px}
.tl-row{display:flex;gap:12px;align-items:flex-start}
.tl-dot{width:12px;height:12px;border-radius:50%;background:linear-gradient(135deg,#ff9ec4,#b694ff);margin-top:5px;flex:none;
  box-shadow:0 0 0 4px rgba(255,158,196,.18)}
.tl-body{flex:1;min-width:0;background:rgba(255,255,255,.62);border:1px solid var(--line);border-radius:13px;padding:11px 13px}
.tl-date{font-weight:700;font-size:13px}
.ym-pick{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.ym-pick select{padding:7px 10px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.7);color:var(--text);font:inherit}

/* 行情 */
.quote-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
.qcard{border-radius:16px;padding:14px;background:rgba(255,255,255,.72);border:1px solid var(--line);
  box-shadow:var(--shadow-sm);position:relative;overflow:hidden}
.qcard::after{content:"";position:absolute;right:-24px;top:-24px;width:74px;height:74px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,111,165,.16),transparent 70%)}
.qc-name{font-size:13px;color:var(--text-sub);display:flex;align-items:center;gap:6px}
.qc-price{font-size:25px;font-weight:800;letter-spacing:.5px;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.qc-chg{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.qc-time{font-size:11px;color:var(--text-sub);margin-top:6px}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--text-sub)}
.gold-card{background:linear-gradient(135deg,#fff4d6,#ffe9f2);border-color:#f6dba8}
.gold-card .qc-name{color:#a4762a}
.gold-pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:520px){.gold-pair{gap:10px}}
.gold-spread{margin-top:12px;padding:11px 13px;border-radius:14px;
  background:linear-gradient(135deg,#fff8e8,#fff1f6);border:1px solid #f6dba8;
  display:flex;flex-direction:column;gap:5px}
.gold-spread .gs-h{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:#a4762a}
.gold-spread .gs-body{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.gold-spread .gs-num{font-size:20px;font-weight:700;letter-spacing:.3px}
.gold-spread .gs-tag{font-size:11.5px;padding:2px 8px;border-radius:999px;background:#fff;
  color:#a4762a;border:1px solid #f0d0a0;white-space:nowrap}
.qc-badge{display:inline-block;margin-left:6px;font-size:10.5px;font-weight:600;line-height:1;
  padding:3px 6px;border-radius:6px;vertical-align:middle}
.qc-badge.spot{background:#ffe3b8;color:#8a5c14}
.qc-badge.fut{background:#dfe9ff;color:#3a5f9e}
.quote-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--text-sub)}

/* 诗词 */
.poem-card{background:linear-gradient(160deg,rgba(255,255,255,.88),rgba(255,240,248,.72));border:1px solid var(--line);
  border-radius:var(--radius);padding:22px 20px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden}
.poem-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,var(--accent),var(--accent-2))}
.poem-title{font-size:21px;font-weight:800;margin:0 0 4px;letter-spacing:1px}
.poem-meta{font-size:12.5px;color:var(--text-sub);margin-bottom:14px}
.poem-body{font-size:17px;line-height:2.1;white-space:pre-wrap;letter-spacing:1.2px;
  font-family:"Kaiti SC","STKaiti","KaiTi",var(--font);color:#4a3548}
.poem-note{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line);font-size:13.5px;color:#6b5a70;line-height:1.85}
.poem-note b{color:#d93b79}
.seal{position:absolute;right:16px;bottom:14px;font-size:11px;color:rgba(217,59,121,.35);
  border:1.5px solid rgba(217,59,121,.3);border-radius:6px;padding:3px 6px;transform:rotate(-8deg);letter-spacing:2px}

/* 表格 */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th,.tbl td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line)}
.tbl th{font-size:12.5px;color:var(--text-sub);font-weight:600}
.tbl tr:last-child td{border-bottom:0}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* 进度条 */
.bar{height:9px;border-radius:99px;background:rgba(160,140,170,.18);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .6s cubic-bezier(.2,.8,.3,1)}

/* 图表 */
.chart-box{position:relative;width:100%;height:260px}
.chart-box canvas{width:100%;height:100%;display:block;touch-action:pan-y}
.chart-tip{position:absolute;pointer-events:none;background:rgba(50,32,48,.92);color:#fff;padding:6px 10px;
  border-radius:9px;font-size:12px;white-space:nowrap;opacity:0;transition:opacity .12s;
  transform:translate(-50%,-135%);z-index:6;box-shadow:0 6px 16px rgba(0,0,0,.18)}
.chart-tip.show{opacity:1}
.chart-tip b{color:#ffd9ea}
.chart-hint{position:absolute;right:2px;top:-2px;font-size:11px;color:var(--text-sub);pointer-events:none}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--text-sub);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}

/* 能量条 */
.energy-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.energy-ring{width:104px;height:104px;flex:0 0 104px;position:relative}
.energy-ring svg{transform:rotate(-90deg);display:block}
.energy-ring .track{stroke:rgba(160,140,170,.18)}
.energy-ring .fillr{stroke:url(#eg);stroke-linecap:round;transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.3,1)}
.energy-val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
.energy-val b{font-size:25px;font-weight:800;line-height:1}
.energy-val span{font-size:10.5px;color:var(--text-sub)}
.energy-items{flex:1;min-width:200px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.energy-item{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-sub);
  background:rgba(255,255,255,.5);border-radius:10px;padding:6px 9px;border:1px solid var(--line)}
.energy-item i{font-style:normal;font-size:15px}
.energy-item.off{opacity:.45}

/* 心情 */
.mood-scale{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.mood-btn{flex:1;min-width:54px;border:1px solid var(--line);background:rgba(255,255,255,.6);border-radius:14px;
  padding:9px 4px;cursor:pointer;text-align:center;transition:transform .14s,border-color .2s,background .2s}
.mood-btn:hover{transform:translateY(-2px)}
.mood-btn .m-ic{font-size:23px;display:block;line-height:1.2}
.mood-btn .m-tx{font-size:11px;color:var(--text-sub);margin-top:2px;display:block}
.mood-btn.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 4px 12px rgba(255,111,165,.22)}
.mood-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.mood-cal .wd{text-align:center;font-size:11px;color:var(--text-sub);padding-bottom:2px}
.mood-cell{aspect-ratio:1/1;border-radius:11px;background:rgba(255,255,255,.45);border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10.5px;
  cursor:pointer;transition:transform .12s;position:relative;color:var(--text-sub)}
.mood-cell:hover{transform:scale(1.06)}
.mood-cell .mc-ic{font-size:15px;line-height:1.1}
.mood-cell.empty-cell{opacity:.35;cursor:default}
.mood-cell.empty-cell:hover{transform:none}
.mood-cell.today{outline:2px solid var(--accent);outline-offset:1px}
.mood-legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--text-sub);margin-top:10px}
.mood-legend span i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px}

/* 模态框 */
.mask{position:fixed;inset:0;background:rgba(60,40,60,.42);backdrop-filter:blur(3px);z-index:200;
  display:none;align-items:center;justify-content:center;padding:16px}
.mask.show{display:flex}
.modal{width:min(560px,100%);max-height:86vh;overflow:auto;border-radius:22px;background:var(--card-solid);
  box-shadow:0 24px 60px rgba(80,40,70,.3);animation:pop .22s cubic-bezier(.2,1.2,.4,1)}
@keyframes pop{from{transform:scale(.9) translateY(14px);opacity:0}}
.modal-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;
  font-weight:700;font-size:16px;position:sticky;top:0;background:var(--card-solid);z-index:2;border-radius:22px 22px 0 0}
.modal-body{padding:16px 18px}
.modal-foot{padding:12px 18px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line);
  display:flex;gap:10px;justify-content:flex-end;position:sticky;bottom:0;background:var(--card-solid);border-radius:0 0 22px 22px}
.x-btn{margin-left:auto;border:0;background:rgba(0,0,0,.05);width:30px;height:30px;border-radius:9px;cursor:pointer;font-size:16px;color:var(--text-sub)}

/* 同步进度 */
.sync-progress{margin-top:10px}
.sync-step{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-sub);padding:3px 0}
.sync-step .s-ic{width:16px;text-align:center}
.sync-step.done{color:var(--down)}
.sync-step.cur{color:var(--accent);font-weight:600}
.sync-step.err{color:var(--up)}
.sync-bar{height:6px;border-radius:99px;background:rgba(160,140,170,.18);overflow:hidden;margin:6px 0 2px}
.sync-bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .4s}

/* Toast（下移，适配挖孔屏） */
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + var(--toast-top));
  z-index:500;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:88vw}
.toast{background:rgba(50,32,48,.92);color:#fff;padding:10px 18px;border-radius:14px;font-size:13.5px;
  box-shadow:0 8px 24px rgba(0,0,0,.2);animation:tin .28s cubic-bezier(.2,1.2,.4,1)}
@keyframes tin{from{opacity:0;transform:translateY(-12px) scale(.96)}}

/* 沉浸模式引导条（地址栏隐藏提示，只出现一次） */
.fs-tip{position:fixed;left:50%;top:calc(58px + env(safe-area-inset-top));z-index:190;
  transform:translateX(-50%) translateY(-14px);display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.97);color:#5a3f52;border:1px solid var(--line);border-radius:14px;
  padding:8px 8px 8px 14px;font-size:13px;line-height:1.5;max-width:92vw;
  box-shadow:0 8px 22px rgba(160,100,140,.22);opacity:0;transition:.28s cubic-bezier(.2,1.2,.4,1)}
.fs-tip.show{opacity:1;transform:translateX(-50%) translateY(0)}
.fs-tip b{color:#e8759f}
.fs-tip button{border:none;background:none;cursor:pointer;font:inherit;white-space:nowrap}
.fs-tip .fs-tip-go{background:linear-gradient(135deg,#ffb3d1,#e79ad0);color:#fff;border-radius:10px;padding:5px 11px;font-size:12.5px}
.fs-tip .fs-tip-x{color:#bb9aae;padding:2px 6px;font-size:13px}

/* 桌面宠物 */
#pet{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:150;width:120px;
  cursor:pointer;user-select:none;-webkit-user-drag:none;touch-action:none;
  filter:drop-shadow(0 8px 16px rgba(190,110,150,.28));transition:transform .2s}
#pet:active{transform:scale(.95)}
#pet .pet-svg{width:100%;display:block}
#pet .costume{display:none}
#pet.pet-costume-duck #petCostumeDuck,#pet.pet-costume-box #petCostumeBox{display:block}
#pet.pet-costume-duck .duck-head{transform-box:view-box;transform-origin:7px 33px}
#pet.dance.pet-costume-duck .duck-head{animation:duckWobble .58s ease-in-out infinite}
@keyframes duckWobble{0%,100%{transform:rotate(0)}50%{transform:rotate(-18deg)}}
#pet.dance{animation:dance .58s ease-in-out infinite}
@keyframes dance{0%{transform:translateY(0) rotate(0)}25%{transform:translateY(-14px) rotate(-11deg) scale(1.06)}
  50%{transform:translateY(0) rotate(0) scale(1)}75%{transform:translateY(-10px) rotate(11deg) scale(1.04)}
  100%{transform:translateY(0) rotate(0) scale(1)}}
#pet.dance .arm-l,#pet.dance .arm-r,#pet.dance .leg-l,#pet.dance .leg-r{transform-box:view-box}
#pet.dance .arm-l{animation:armL .58s ease-in-out infinite;transform-origin:22px 66px}
#pet.dance .arm-r{animation:armR .58s ease-in-out infinite;transform-origin:78px 66px}
@keyframes armL{0%,100%{transform:rotate(0)}50%{transform:rotate(-38deg)}}
@keyframes armR{0%,100%{transform:rotate(0)}50%{transform:rotate(38deg)}}
#pet.dance .leg-l{animation:legL .58s ease-in-out infinite;transform-origin:40px 96px}
#pet.dance .leg-r{animation:legR .58s ease-in-out infinite;transform-origin:60px 96px}
@keyframes legL{0%,100%{transform:rotate(0)}50%{transform:rotate(14deg)}}
@keyframes legR{0%,100%{transform:rotate(0)}50%{transform:rotate(-14deg)}}
.bubble{position:absolute;right:82%;bottom:76%;width:186px;background:#fff;color:#4a3548;border-radius:16px;
  padding:11px 13px;font-size:13px;line-height:1.55;box-shadow:0 8px 22px rgba(160,100,140,.24);
  opacity:0;transform:translateY(8px) scale(.9);transition:.25s;pointer-events:none;border:1px solid var(--line)}
.bubble.show{opacity:1;transform:translateY(0) scale(1)}
.bubble::after{content:"";position:absolute;right:-7px;bottom:16px;width:14px;height:14px;background:#fff;
  transform:rotate(45deg);border-right:1px solid var(--line);border-top:1px solid var(--line)}
.pet-tip{position:absolute;left:50%;transform:translateX(-50%);bottom:-4px;font-size:10.5px;color:var(--text-sub);white-space:nowrap;opacity:.75}

/* 页面切换动画 */
.page{display:none}
.page.active{display:block;animation:pageIn .32s cubic-bezier(.22,.85,.3,1)}
@keyframes pageIn{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
.page.active.back{animation:pageInBack .32s cubic-bezier(.22,.85,.3,1)}
@keyframes pageInBack{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
.page.active.fade{animation:pageFade .3s ease}
@keyframes pageFade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .page.active,.page.active.back,.page.active.fade,#pet.dance,.empty-pet{animation:none!important}
}

/* 移动端 */
@media (max-width:860px){
  .sidebar{transform:translateX(-104%);box-shadow:0 0 40px rgba(120,70,110,.22);width:266px;flex-basis:266px}
  .sidebar.open{transform:translateX(0)}
  body.nav-collapsed .sidebar{width:266px;flex-basis:266px}
  body.nav-collapsed .main{margin-left:0}
  body.nav-collapsed .brand-txt,body.nav-collapsed .nav-item>span:not(.ic),body.nav-collapsed .nav-item .arrow{display:inline}
  body.nav-collapsed .nav-item{justify-content:flex-start;padding:10px 12px}
  body.nav-collapsed .nav-group.open .sub-wrap{position:static;min-width:0;box-shadow:none;background:transparent;border:0}
  .main{margin-left:0;padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 76px) 12px}
  .menu-btn{display:grid;place-items:center}
  .collapse-btn{display:none}
  .g2,.g3,.g4,.g5{grid-template-columns:1fr}
  .g2.keep2,.g3.keep2,.g4.keep2,.g5.keep2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .topbar h1{font-size:16px}
  .topbar .sub{display:none}
  .hello-chip{display:none}
  .poem-body{font-size:16px;line-height:1.95}
  #pet{width:92px;right:10px;bottom:calc(12px + env(safe-area-inset-bottom))}
  .bubble{width:150px;font-size:12px;right:78%}
  .modal{max-height:90vh}
  .chart-box{height:220px}
  .quote-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .qc-price{font-size:21px}
  .energy-ring{width:88px;height:88px;flex-basis:88px}
  .energy-items{grid-template-columns:1fr}
}
@media (max-width:360px){.quote-grid{grid-template-columns:1fr}}
.scrim{position:fixed;inset:0;background:rgba(50,30,46,.35);z-index:55;display:none}
.scrim.show{display:block}
@media print{.sidebar,#pet,.top-actions,.menu-btn,.collapse-btn{display:none}.main{margin:0}}

/* ============ 记账理财 ============ */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-sub);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.money-in{color:#12a05c} .money-out{color:#e13b3b}
.money{font-variant-numeric:tabular-nums;font-weight:700}
.mon-nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mon-nav .mon-t{font-size:15px;font-weight:800;min-width:104px;text-align:center}
.mon-nav select{width:auto;min-width:120px;padding:6px 10px;font-size:13px}
.day-group{margin-bottom:12px}
.day-head{display:flex;align-items:baseline;gap:8px;padding:2px 4px 6px;font-size:12.5px;color:var(--text-sub);
  border-bottom:1px dashed var(--line);margin-bottom:6px}
.day-head b{font-size:13.5px;color:var(--text)}
.fin-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:13px;
  background:rgba(255,255,255,.55);border:1px solid var(--line);margin-bottom:6px;
  transition:transform .18s,box-shadow .18s}
.fin-row:hover{transform:translateX(2px);box-shadow:var(--shadow-sm)}
.fin-ic{width:34px;height:34px;flex:0 0 34px;border-radius:11px;display:grid;place-items:center;font-size:17px;
  background:var(--accent-soft)}
.fin-main{flex:1;min-width:0}
.fin-title{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fin-sub{font-size:11.5px;color:var(--text-sub);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fin-amt{font-size:15.5px;font-weight:800;white-space:nowrap}
.fin-acts{display:flex;gap:4px;flex-shrink:0}
.fin-acts button{border:0;background:rgba(255,255,255,.7);border:1px solid var(--line);border-radius:9px;
  width:29px;height:29px;cursor:pointer;font-size:13px;line-height:1;color:var(--text-sub)}
.fin-acts button:active{transform:scale(.92)}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:9px}
.cat-chip{display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:13px;
  background:rgba(255,255,255,.6);border:1px solid var(--line);font-size:13.5px}
.cat-chip .cc-ic{width:28px;height:28px;flex:0 0 28px;border-radius:9px;display:grid;place-items:center;
  font-size:15px;background:var(--accent-soft)}
.cat-chip .cc-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-chip .cc-x{border:0;background:none;color:var(--text-sub);cursor:pointer;font-size:14px;padding:0 2px;opacity:.65}
.cat-chip .cc-x:hover{opacity:1;color:#e13b3b}

/* ============ 今日运势 · 塔罗 ============ */
.ft-head{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}
.ft-cell{background:rgba(255,255,255,.55);border:1px solid var(--line);border-radius:14px;padding:11px 8px;text-align:center}
.ft-cell .fk{font-size:11.5px;color:var(--text-sub)}
.ft-cell .fv{font-size:15.5px;font-weight:800;margin-top:3px}
.stars{font-size:19px;letter-spacing:2px;line-height:1.2}
.stars .on{color:#ffb93b}
.stars .off{color:rgba(160,140,170,.28)}
.lucky-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.lucky{display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:12px;
  background:rgba(255,255,255,.6);border:1px solid var(--line);font-size:13px}
.lucky .sw{width:16px;height:16px;border-radius:5px;border:1px solid rgba(0,0,0,.10)}
/* 塔罗 3D 翻转 */
.tarot-wrap{perspective:1400px;width:190px;height:290px;margin:6px auto 4px;cursor:pointer;
  -webkit-tap-highlight-color:transparent}
.tarot-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;
  transition:transform .95s cubic-bezier(.2,.85,.25,1);will-change:transform}
.tarot-wrap.flipped .tarot-inner{transform:rotateY(180deg)}
.tarot-wrap.rev .tc-front{transform:rotateY(180deg) rotate(180deg)}
.tc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:16px;overflow:hidden;box-shadow:0 14px 32px rgba(120,70,120,.28);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(160deg,rgba(255,255,255,.92),rgba(246,232,255,.92));
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.75)}
.tc-back{background:
  radial-gradient(circle at 50% 30%,rgba(255,255,255,.20),transparent 58%),
  linear-gradient(155deg,#5b3f9c 0%,#7b4fc0 42%,#3f2b78 100%);
  border:1px solid rgba(255,255,255,.35);color:#f3e9ff}
.tc-back .tcb-ring{width:112px;height:112px;border-radius:50%;border:1.5px solid rgba(255,255,255,.42);
  display:grid;place-items:center;position:relative}
.tc-back .tcb-ring::before{content:"";position:absolute;inset:12px;border-radius:50%;

/* 新版本可用提示条 */

<script>
/* 诗词库 · 李白 120 首（离线内置，含创作背景） */
(function(A){
A.POEMS=A.POEMS||{};
A.POETS=A.POETS||{};
A.POETS.libai={name:'李白',tag:'诗仙 · 盛唐',desc:'字太白，号青莲居士，唐代最伟大的浪漫主义诗人。'};
A.POEMS.libai=[
{t:'静夜思',body:`床前明月光，
疑是地上霜。
举头望明月，
低头思故乡。`,bg:`开元十四年（726）前后，二十六岁的李白"仗剑去国，辞亲远游"，客居扬州旅舍。秋夜月色入户，霜气侵阶，羁旅之人望月怀乡，脱口成此二十字。全诗无一奇字，却是中国人共同的乡愁记忆。`},
{t:'望庐山瀑布',body:`日照香炉生紫烟，
遥看瀑布挂前川。
飞流直下三千尺，
疑是银河落九天。`,bg:`李白一生两上庐山。此诗约作于开元、天宝之交隐居庐山时期。香炉峰在日光下水汽蒸腾如紫烟，远望瀑布如白练垂空，诗人以银河落天的奇想写其气势，是盛唐山水诗的浪漫范本。`},
{t:'望庐山五老峰',body:`庐山东南五老峰，
青天削出金芙蓉。
九江秀色可揽结，
吾将此地巢云松。`,bg:`李白隐居庐山期间遍游诸峰。五老峰峭拔如削，在青天里像一朵金色的芙蓉。他看得入迷，生出在此结庐、与云松为伴的念头。`},
{t:'早发白帝城',body:`朝辞白帝彩云间，
千里江陵一日还。
两岸猿声啼不住，
轻舟已过万重山。`,bg:`乾元二年（759），李白因永王李璘案被流放夜郎，行至白帝城忽然遇赦得还。惊喜之下顺流东下江陵，舟行如飞，全诗笔势轻快，是诗人晚年最明朗的一首。`},
{t:'赠汪伦',body:`李白乘舟将欲行，
忽闻岸上踏歌声。
桃花潭水深千尺，
不及汪伦送我情。`,bg:`天宝十四载（755）前后，李白漫游泾县，村人汪伦常以美酒相待。临别时汪伦率众踏歌相送，诗人即兴赋此，以潭水之深反衬情谊之厚，质朴而有余味。`},
{t:'独坐敬亭山',body:`众鸟高飞尽，
孤云独去闲。
相看两不厌，
只有敬亭山。`,bg:`天宝十二载（753）后，李白离开长安已近十年，漂泊宣城一带。世无知音，友人星散，他独坐敬亭山下，唯有青山与己默然相对。二十字写尽热闹散场后的孤高与安顿。`},
{t:'望天门山',body:`天门中断楚江开，
碧水东流至此回。
两岸青山相对出，
孤帆一片日边来。`,bg:`开元十三年（725），二十五岁的李白初出巴蜀，顺长江而下，过安徽当涂天门山。两岸青山如门对峙，江面豁然开阔，一叶孤帆自日边驶来——这是青年李白眼里的世界。`},
{t:'将进酒',body:`君不见，黄河之水天上来，奔流到海不复回。
君不见，高堂明镜悲白发，朝如青丝暮成雪。
人生得意须尽欢，莫使金樽空对月。
天生我材必有用，千金散尽还复来。
烹羊宰牛且为乐，会须一饮三百杯。
岑夫子，丹丘生，将进酒，杯莫停。
与君歌一曲，请君为我倾耳听。
钟鼓馔玉不足贵，但愿长醉不复醒。
古来圣贤皆寂寞，惟有饮者留其名。
陈王昔时宴平乐，斗酒十千恣欢谑。
主人何为言少钱，径须沽取对君酌。
五花马，千金裘，呼儿将出换美酒，与尔同销万古愁。`,bg:`约天宝十一载（752），李白与友人岑勋、元丹丘在嵩山颍阳登高宴饮。此时他离开长安已近十年，抱负未展，遂借酒放歌。诗中有悲愤，更有"天生我材必有用"的万丈豪情。`},
{t:'行路难 · 其一',body:`金樽清酒斗十千，玉盘珍羞直万钱。
停杯投箸不能食，拔剑四顾心茫然。
欲渡黄河冰塞川，将登太行雪满山。
闲来垂钓碧溪上，忽复乘舟梦日边。
行路难，行路难，多歧路，今安在？
长风破浪会有时，直挂云帆济沧海。`,bg:`天宝三载（744），李白被玄宗"赐金放还"，实则是体面地逐出长安。友人为他饯行，美酒当前却难以下咽。诗以冰塞黄河、雪满太行写仕途阻塞，结尾忽转高昂，相信总有长风破浪之日。`},
{t:'行路难 · 其二',body:`大道如青天，我独不得出。
羞逐长安社中儿，赤鸡白雉赌梨栗。
弹剑作歌奏苦声，曳裾王门不称情。
淮阴市井笑韩信，汉朝公卿忌贾生。
君不见昔时燕家重郭隗，拥篲折节无嫌猜。
剧辛乐毅感恩分，输肝剖胆效英才。
昭王白骨萦蔓草，谁人更扫黄金台？
行路难，归去来！`,bg:`与"其一"同期作于离开长安之后。诗人自比韩信、贾生，痛惜无人效燕昭王筑黄金台以纳贤。结句"归去来"，是愤极之后的决绝。`},
{t:'行路难 · 其三',body:`有耳莫洗颍川水，有口莫食首阳蕨。
含光混世贵无名，何用孤高比云月？
吾观自古贤达人，功成不退皆殒身。
子胥既弃吴江上，屈原终投湘水滨。
陆机雄才岂自保？李斯税驾苦不早。
华亭鹤唳讵可闻？上蔡苍鹰何足道？
君不见吴中张翰称达生，秋风忽忆江东行。
且乐生前一杯酒，何须身后千载名？`,bg:`此章连用伍子胥、屈原、陆机、李斯等功成不退而罹祸的典故，反证张翰"莼鲈之思"的旷达。李白借此说服自己放下执念，是"行路难"三章中的收束之笔。`},
{t:'蜀道难',body:`噫吁嚱，危乎高哉！
蜀道之难，难于上青天！
蚕丛及鱼凫，开国何茫然！
尔来四万八千岁，不与秦塞通人烟。
西当太白有鸟道，可以横绝峨眉巅。
地崩山摧壮士死，然后天梯石栈相钩连。
上有六龙回日之高标，下有冲波逆折之回川。
黄鹤之飞尚不得过，猿猱欲度愁攀援。
青泥何盘盘，百步九折萦岩峦。
扪参历井仰胁息，以手抚膺坐长叹。
问君西游何时还？畏途巉岩不可攀。
但见悲鸟号古木，雄飞雌从绕林间。
又闻子规啼夜月，愁空山。
蜀道之难，难于上青天，使人听此凋朱颜！
连峰去天不盈尺，枯松倒挂倚绝壁。
飞湍瀑流争喧豗，砯崖转石万壑雷。
其险也如此，嗟尔远道之人胡为乎来哉！
剑阁峥嵘而崔嵬，一夫当关，万夫莫开。
所守或匪亲，化为狼与豺。
朝避猛虎，夕避长蛇，磨牙吮血，杀人如麻。
锦城虽云乐，不如早还家。
蜀道之难，难于上青天，侧身西望长咨嗟！`,bg:`约作于开元、天宝之交。李白以蜀中山川的险绝起兴，历来有"讽玄宗幸蜀""送友人入蜀""自喻仕途"诸说。全诗气势奔放、想象奇绝，贺知章读后惊呼其为"谪仙人"。`},
{t:'梦游天姥吟留别',body:`海客谈瀛洲，烟涛微茫信难求；
越人语天姥，云霞明灭或可睹。
天姥连天向天横，势拔五岳掩赤城。
天台四万八千丈，对此欲倒东南倾。
我欲因之梦吴越，一夜飞度镜湖月。
湖月照我影，送我至剡溪。
谢公宿处今尚在，渌水荡漾清猿啼。
脚著谢公屐，身登青云梯。
半壁见海日，空中闻天鸡。
千岩万转路不定，迷花倚石忽已暝。
熊咆龙吟殷岩泉，栗深林兮惊层巅。
云青青兮欲雨，水澹澹兮生烟。
列缺霹雳，丘峦崩摧。
洞天石扉，訇然中开。
青冥浩荡不见底，日月照耀金银台。
霓为衣兮风为马，云之君兮纷纷而来下。
虎鼓瑟兮鸾回车，仙之人兮列如麻。
忽魂悸以魄动，怳惊起而长嗟。
惟觉时之枕席，失向来之烟霞。
世间行乐亦如此，古来万事东流水。
别君去兮何时还？且放白鹿青崖间，须行即骑访名山。
安能摧眉折腰事权贵，使我不得开心颜！`,bg:`天宝四载（745）前后，李白将离东鲁南游吴越，临别以此诗赠友。他借一场瑰丽的梦游写尽对名山仙境的向往，最后发出"安能摧眉折腰事权贵"的宣言，是被放还之后最响亮的傲骨之音。`},
{t:'宣州谢朓楼饯别校书叔云',body:`弃我去者，昨日之日不可留；
乱我心者，今日之日多烦忧。
长风万里送秋雁，对此可以酣高楼。
蓬莱文章建安骨，中间小谢又清发。
俱怀逸兴壮思飞，欲上青天揽明月。
抽刀断水水更流，举杯销愁愁更愁。
人生在世不称意，明朝散发弄扁舟。`,bg:`天宝十二载（753），李白在宣城饯别族叔、秘书省校书郎李云。两人登谢朓楼纵酒论文，诗人由饯别转到自身，以"抽刀断水"写愁之难断，末句欲散发行舟，是愤极之后的旷达。`},
{t:'月下独酌 · 其一',body:`花间一壶酒，独酌无相亲。
举杯邀明月，对影成三人。
月既不解饮，影徒随我身。
暂伴月将影，行乐须及春。
我歌月徘徊，我舞影零乱。
醒时同交欢，醉后各分散。
永结无情游，相期邈云汉。`,bg:`约天宝三载（744），李白在长安供奉翰林后期。名为翰林待诏，实为御用文人，政治理想落空，知音寥寥。春夜花下独饮，他把明月与影子拉来作伴，热闹之下是彻骨的孤独。`},
{t:'月下独酌 · 其二',body:`天若不爱酒，酒星不在天。
地若不爱酒，地应无酒泉。
天地既爱酒，爱酒不愧天。
已闻清比圣，复道浊如贤。
贤圣既已饮，何必求神仙。
三杯通大道，一斗合自然。
但得酒中趣，勿为醒者传。`,bg:`组诗第二首。李白以"天地皆爱酒"的奇辩为饮酒张目，把酒提到与大道、自然同高的位置，谐谑之中藏着不与世俗言说的孤怀。`},
{t:'月下独酌 · 其三',body:`三月咸阳城，千花昼如锦。
谁能春独愁，对此径须饮。
穷通与修短，造化夙所禀。
一樽齐死生，万事固难审。
醉后失天地，兀然就孤枕。
不知有吾身，此乐最为甚。`,bg:`作于长安时期。暮春三月、繁花似锦，诗人却独自饮酒。他以"一樽齐死生"的醉语消解穷通寿夭的焦虑，是典型的太白式自我开解。`},
{t:'月下独酌 · 其四',body:`穷愁千万端，美酒三百杯。
愁多酒虽少，酒倾愁不来。
所以知酒圣，酒酣心自开。
辞粟卧首阳，屡空饥颜回。
当代不乐饮，虚名安用哉。
蟹螯即金液，糟丘是蓬莱。
且须饮美酒，乘月醉高台。`,bg:`组诗末章。李白翻用伯夷叔齐、颜回的典故，说与其守着清名挨饿，不如持螯把酒、乘月登台。这是他的牢骚，也是他的自救。`},
{t:'山中与幽人对酌',body:`两人对酌山花开，
一杯一杯复一杯。
我醉欲眠卿且去，
明朝有意抱琴来。`,bg:`李白隐居期间与山中隐士对饮。山花下你一杯我一杯，醉了便直说"我要睡了，你先回，明天想来就抱琴来"。率真得像一封便条，却成了千古名句。`},
{t:'把酒问月',body:`青天有月来几时？我今停杯一问之。
人攀明月不可得，月行却与人相随。
皎如飞镜临丹阙，绿烟灭尽清辉发。
但见宵从海上来，宁知晓向云间没。
白兔捣药秋复春，嫦娥孤栖与谁邻？
今人不见古时月，今月曾经照古人。
古人今人若流水，共看明月皆如此。
唯愿当歌对酒时，月光长照金樽里。`,bg:`题下原注"故人贾淳令予问之"。李白停杯向天发问，把月的永恒与人世的流转对照，"今人不见古时月，今月曾经照古人"十六字，道尽古今同慨。`},
{t:'古朗月行',body:`小时不识月，呼作白玉盘。
又疑瑶台镜，飞在青云端。
仙人垂两足，桂树何团团。
白兔捣药成，问言与谁餐？
蟾蜍蚀圆影，大明夜已残。
羿昔落九乌，天人清且安。
阴精此沦惑，去去不足观。
忧来其如何？凄怆摧心肝。`,bg:`乐府旧题。前半是童年对月亮的天真想象，后半笔锋陡转，以蟾蜍蚀月喻朝政昏暗。一般认为作于安史之乱前后，寄托着诗人对国事的忧愤。`},
{t:'夜宿山寺',body:`危楼高百尺，
手可摘星辰。
不敢高声语，
恐惊天上人。`,bg:`李白漫游途中夜宿高山寺院（一说湖北黄梅蔡山峰顶山寺，一说蜀中绵州越王楼）。以孩童般的想象写楼之高、星之近，二十字里全是天真与敬畏。`},
{t:'秋浦歌 · 其十四',body:`炉火照天地，
红星乱紫烟。
赧郎明月夜，
歌曲动寒川。`,bg:`天宝十三载（754）前后，李白漫游秋浦（今安徽池州）。当地冶铸业兴盛，月夜里炉火映红天地，冶炼工的歌声震动寒川。这是唐诗中少见的劳动者特写。`},
{t:'秋浦歌 · 其十五',body:`白发三千丈，
缘愁似个长。
不知明镜里，
何处得秋霜。`,bg:`同期作于秋浦。此时李白已五十余岁，功业无成，漂泊日久。照镜见白发，遂以"三千丈"的极度夸张写愁绪之长，是浪漫主义最著名的奇句之一。`},
{t:'登金陵凤凰台',body:`凤凰台上凤凰游，凤去台空江自流。
吴宫花草埋幽径，晋代衣冠成古丘。
三山半落青天外，二水中分白鹭洲。
总为浮云能蔽日，长安不见使人愁。`,bg:`天宝年间李白游金陵登凤凰台。诗写六朝繁华尽成丘墟，末以"浮云蔽日"喻奸佞当道、长安难见。传说他有意与崔颢《黄鹤楼》争胜，而气象自具。`},
{t:'登太白峰',body:`西上太白峰，夕阳穷登攀。
太白与我语，为我开天关。
愿乘泠风去，直出浮云间。
举手可近月，前行若无山。
一别武功去，何时复更还？`,bg:`李白登秦岭主峰太白山。山名与己名相合，他索性与"太白"对话，生出乘风出云、举手近月的遐想，末句却仍眷恋人间。`},
{t:'秋登宣城谢朓北楼',body:`江城如画里，山晚望晴空。
两水夹明镜，双桥落彩虹。
人烟寒橘柚，秋色老梧桐。
谁念北楼上，临风怀谢公。`,bg:`天宝十二载（753）秋，李白在宣城登谢朓楼。水如明镜、桥似彩虹，秋色里橘柚梧桐俱老。他临风怀想南齐诗人谢朓——那是他一生心仪的六朝诗人。`},
{t:'谢公亭',body:`谢公离别处，风景每生愁。
客散青天月，山空碧水流。
池花春映日，窗竹夜鸣秋。
今古一相接，长歌怀旧游。`,bg:`谢公亭为谢朓送别处，在宣城。李白独坐亭中，看客散月明、山空水流，觉得古今之情可以相接，遂长歌以怀。`},
{t:'夜泊牛渚怀古',body:`牛渚西江夜，青天无片云。
登舟望秋月，空忆谢将军。
余亦能高咏，斯人不可闻。
明朝挂帆席，枫叶落纷纷。`,bg:`牛渚矶在今安徽马鞍山，是东晋谢尚闻袁虎咏史之处。李白秋夜泊舟于此，自负有袁虎之才而叹无谢尚之知己，末以枫叶纷纷收束，空灵而怅惘。`},
{t:'苏台览古',body:`旧苑荒台杨柳新，
菱歌清唱不胜春。
只今惟有西江月，
曾照吴王宫里人。`,bg:`李白游姑苏台遗址。当年吴王的苑囿已成荒台，唯有杨柳年年新绿，西江明月还照过宫中的美人。以不变者观万变，是怀古诗的正法。`},
{t:'越中览古',body:`越王勾践破吴归，
义士还家尽锦衣。
宫女如花满春殿，
只今惟有鹧鸪飞。`,bg:`李白游越中（今浙江绍兴）凭吊古迹。前三句极写破吴后的繁华锦绣，末句陡然落到"鹧鸪飞"，盛衰之叹全在不言中。`},
{t:'夜下征虏亭',body:`船下广陵去，
月明征虏亭。
山花如绣颊，
江火似流萤。`,bg:`李白夜航东下广陵（今扬州），途经征虏亭。月色里山花如少女粉颊，江上渔火流萤般明灭，二十字写尽江南夜航的轻盈。`},
{t:'与夏十二登岳阳楼',body:`楼观岳阳尽，川迥洞庭开。
雁引愁心去，山衔好月来。
云间连下榻，天上接行杯。
醉后凉风起，吹人舞袖回。`,bg:`乾元二年（759）遇赦东还，李白与友人夏十二登岳阳楼。八百里洞庭尽收眼底，愁心被雁带走，好月被山衔来——是他晚年难得的舒展之作。`},
{t:'秋登巴陵望洞庭',body:`清晨登巴陵，周览无不极。
明湖映天光，彻底见秋色。
秋色何苍然，际海俱澄鲜。
山青灭远树，水绿无寒烟。
来帆出江中，去鸟向日边。
风清长沙浦，山空云梦田。
瞻光惜颓发，阅水悲徂年。
北渚既荡漾，东流自潺湲。
郢人唱白雪，越女歌采莲。
听此更肠断，凭崖泪如泉。`,bg:`李白登巴陵（今岳阳）望洞庭。前半极写湖天澄鲜、帆鸟往来，后半忽然悲从中来：照见白发，叹逝水年华，听郢歌越唱而肠断。`},
{t:'杜陵绝句',body:`南登杜陵上，
北望五陵间。
秋水明落日，
流光灭远山。`,bg:`杜陵在长安东南，汉宣帝陵寝所在。李白南登杜陵北望，秋水映落日、流光没远山，二十字里是帝都黄昏的苍茫。`},
{t:'焦山望寥山',body:`石壁望松寥，宛然在碧霄。
安得五彩虹，驾天作长桥。
仙人如爱我，举手来相招。`,bg:`李白在镇江焦山隔江望松寥、夷山二岛。孤岛如在碧霄，他恨不得架一道彩虹为桥，索性请仙人招他过去。`},
{t:'望鹦鹉洲怀祢衡',body:`魏帝营八极，蚁观一祢衡。
黄祖斗筲人，杀之受恶名。
吴江赋鹦鹉，落笔超群英。
锵锵振金玉，句句欲飞鸣。
鸷鹗啄孤凤，千春伤我情。
五岳起方寸，隐然讵可平。
才高竟何施，寡识冒天刑。
至今芳洲上，兰蕙不忍生。`,bg:`李白过鹦鹉洲，凭吊汉末狂士祢衡。祢衡才高被杀，李白引为同调，"鸷鹗啄孤凤，千春伤我情"说的是祢衡，也是他自己。`},
{t:'上三峡',body:`巫山夹青天，巴水流若兹。
巴水忽可尽，青天无到时。
三朝上黄牛，三暮行太迟。
三朝又三暮，不觉鬓成丝。`,bg:`乾元二年（759）李白流放夜郎，溯江入三峡。峡中舟行迟缓，朝朝暮暮只见黄牛山，愁得鬓发都白了。是他最困顿时期的行旅之作。`},
{t:'秋下荆门',body:`霜落荆门江树空，
布帆无恙挂秋风。
此行不为鲈鱼鲙，
自爱名山入剡中。`,bg:`开元十三年（725）李白出蜀东下过荆门。他反用张翰"莼鲈之思"的典故，声明此行不是为口腹之欲，而是要入剡中寻访名山。`},
{t:'渡荆门送别',body:`渡远荆门外，来从楚国游。
山随平野尽，江入大荒流。
月下飞天镜，云生结海楼。
仍怜故乡水，万里送行舟。`,bg:`开元十三年（725）李白初次出蜀。出了荆门，群山让位给平野，大江奔入荒原；月如天镜、云似海楼。末句却说：还是怜惜故乡的水，万里相送。`},
{t:'峨眉山月歌',body:`峨眉山月半轮秋，
影入平羌江水流。
夜发清溪向三峡，
思君不见下渝州。`,bg:`开元十三年（725），李白自清溪驿乘舟东下。半轮秋月随江水流动，也随诗人一路远行。二十八字中连用五个地名而不觉堆砌，是千古绝技。`},
{t:'客中行',body:`兰陵美酒郁金香，
玉碗盛来琥珀光。
但使主人能醉客，
不知何处是他乡。`,bg:`开元年间李白漫游齐鲁，在兰陵饮到以郁金香浸制的美酒。酒色如琥珀，主人殷勤，诗人一醉忘忧——与其说他乡作客，不如说处处可为故乡。`},
{t:'山中问答',body:`问余何意栖碧山，
笑而不答心自闲。
桃花流水窅然去，
别有天地非人间。`,bg:`李白隐居安陆白兆山时期。有人问他为何栖隐，他笑而不答。答案不在话里，而在随水远去的桃花与那片不属于尘世的天地之中。`},
{t:'清平调 · 其一',body:`云想衣裳花想容，
春风拂槛露华浓。
若非群玉山头见，
会向瑶台月下逢。`,bg:`天宝二载（743）春，唐玄宗与杨贵妃在兴庆宫沉香亭赏牡丹，命李白进《清平调》三章。诗人以云喻衣、以花喻容，把人间富贵写成仙境重逢。`},
{t:'清平调 · 其二',body:`一枝红艳露凝香，
云雨巫山枉断肠。
借问汉宫谁得似，
可怜飞燕倚新妆。`,bg:`三章之二。以巫山神女作衬，说楚王梦中的云雨徒然断肠，哪里比得上眼前的名花；又以汉宫赵飞燕的新妆相比，贵妃之美由此落到实处。`},
{t:'清平调 · 其三',body:`名花倾国两相欢，
常得君王带笑看。
解释春风无限恨，
沉香亭北倚阑干。`,bg:`三章之三。名花与美人交相辉映，君王带笑而看；沉香亭北，美人倚栏，春风里的一切怅恨都为之消解。是三章中最雍容的一首。`},
{t:'长干行',body:`妾发初覆额，折花门前剧。
郎骑竹马来，绕床弄青梅。
同居长干里，两小无嫌猜。
十四为君妇，羞颜未尝开。
低头向暗壁，千唤不一回。
十五始展眉，愿同尘与灰。
常存抱柱信，岂上望夫台。
十六君远行，瞿塘滟滪堆。
五月不可触，猿声天上哀。
门前迟行迹，一一生绿苔。
苔深不能扫，落叶秋风早。
八月蝴蝶来，双飞西园草。
感此伤妾心，坐愁红颜老。
早晚下三巴，预将书报家。
相迎不道远，直至长风沙。`,bg:`乐府旧题，约作于李白漫游金陵时期。诗以商妇口吻自述，从"青梅竹马"的两小无猜写到远别相思，是唐诗中最动人的市民爱情叙事。`},
{t:'塞下曲 · 其一',body:`五月天山雪，无花只有寒。
笛中闻折柳，春色未曾看。
晓战随金鼓，宵眠抱玉鞍。
愿将腰下剑，直为斩楼兰。`,bg:`李白借汉乐府旧题写边塞。天山五月仍飞雪无花，笛中吹《折杨柳》而不见春色，战士昼夜枕戈。末句用傅介子斩楼兰王典故，抒写立功报国之志。`},
{t:'塞下曲 · 其二',body:`天兵下北荒，胡马欲南饮。
横戈从百战，直为衔恩甚。
握雪海上餐，拂沙陇头寝。
何当破月氏，然后方高枕。`,bg:`组诗之二。写天兵出塞、胡马南犯的紧张局势，战士餐雪卧沙，只为报君恩、破敌国，然后才能高枕而卧。`},
{t:'塞下曲 · 其五',body:`塞虏乘秋下，天兵出汉家。
将军分虎竹，战士卧龙沙。
边月随弓影，胡霜拂剑花。
玉关殊未入，少妇莫长嗟。`,bg:`组诗之五。"边月随弓影，胡霜拂剑花"一联对仗精工，写尽边地苦寒与征战之勤；末句劝闺中少妇莫要长叹，玉门尚未攻入，归期还早。`},
{t:'从军行',body:`百战沙场碎铁衣，
城南已合数重围。
突营射杀呼延将，
独领残兵千骑归。`,bg:`李白写一位身经百战的将军：铁甲破碎、重围已合，他仍能突营射杀敌将，独领残兵突围而归。二十八字里有千军万马。`},
{t:'关山月',body:`明月出天山，苍茫云海间。
长风几万里，吹度玉门关。
汉下白登道，胡窥青海湾。
由来征战地，不见有人还。
戍客望边邑，思归多苦颜。
高楼当此夜，叹息未应闲。`,bg:`乐府旧题。李白以天山明月、万里长风起笔，写尽历代征战的无人生还；末以戍客思归、高楼叹息作结，是盛唐边塞诗中悲凉的一路。`},
{t:'子夜吴歌 · 春歌',body:`秦地罗敷女，采桑绿水边。
素手青条上，红妆白日鲜。
蚕饥妾欲去，五马莫留连。`,bg:`李白沿用六朝乐府《子夜吴歌》旧题写四时。春歌化用《陌上桑》罗敷故事，采桑女以"蚕饥"为由婉拒使君，机智而自尊。`},
{t:'子夜吴歌 · 夏歌',body:`镜湖三百里，菡萏发荷花。
五月西施采，人看隘若耶。
回舟不待月，归去越王家。`,bg:`夏歌写镜湖荷花盛开，西施采莲，观者塞满若耶溪。末句忽然转冷：舟未待月便回，是入了越王的宫中。`},
{t:'子夜吴歌 · 秋歌',body:`长安一片月，万户捣衣声。
秋风吹不尽，总是玉关情。
何日平胡虏，良人罢远征。`,bg:`秋歌最负盛名。长安月色下，千家万户捣练制衣，准备寄给远在玉门关外的征人。个人的相思，化作对太平的祈愿。`},
{t:'子夜吴歌 · 冬歌',body:`明朝驿使发，一夜絮征袍。
素手抽针冷，那堪把剪刀。
裁缝寄远道，几日到临洮？`,bg:`冬歌写思妇连夜为征人赶絮棉袍：素手冻得抽不动针，剪刀更是冰凉。袍子寄出后，她最牵挂的是"几日能到临洮"。`},
{t:'春思',body:`燕草如碧丝，秦桑低绿枝。
当君怀归日，是妾断肠时。
春风不相识，何事入罗帏？`,bg:`李白以相隔千里的燕地春草与秦地桑枝起兴：夫君动念思归之时，正是闺中肠断之日。末句怨春风不识趣，无理而情深。`},
{t:'秋思',body:`燕支黄叶落，妾望自登台。
海上碧云断，单于秋色来。
胡兵沙塞合，汉使玉关回。
征客无归日，空悲蕙草摧。`,bg:`此诗写思妇秋日登台远望：胡地黄叶已落，边塞兵气正浓，而征人归期无日，唯有蕙草为之枯萎。`},
{t:'玉阶怨',body:`玉阶生白露，
夜久侵罗袜。
却下水晶帘，
玲珑望秋月。`,bg:`乐府旧题，约作于李白供奉翰林时期。宫女独立白玉阶前，夜深露重浸湿罗袜，入室放下帘子，仍隔着帘栊凝望秋月。全诗无一字言怨，而怨意弥漫。`},
{t:'怨情',body:`美人卷珠帘，
深坐颦蛾眉。
但见泪痕湿，
不知心恨谁。`,bg:`李白写一位卷帘独坐、眉头紧锁的美人。只见脸上泪痕犹湿，却不知她心里怨着谁——留白处最耐寻味。`},
{t:'长门怨 · 其一',body:`天回北斗挂西楼，
金屋无人萤火流。
月光欲到长门殿，
别作深宫一段愁。`,bg:`乐府旧题，写汉武帝陈皇后失宠居长门宫事。北斗西斜、金屋无人，只有萤火流动，连月光到了长门殿也要化作一段新愁。`},
{t:'长门怨 · 其二',body:`桂殿长愁不记春，
黄金四屋起秋尘。
夜悬明镜青天上，
独照长门宫里人。`,bg:`其二续写长门宫的孤寂：桂殿里愁得记不清春秋，金屋早已积满秋尘；夜半高悬的明月，偏偏只照着长门宫里的人。`},
{t:'妾薄命',body:`汉帝宠阿娇，贮之黄金屋。
咳唾落九天，随风生珠玉。
宠极爱还歇，妒深情却疏。
长门一步地，不肯暂回车。
雨落不上天，水覆难再收。
君情与妾意，各自东西流。
昔日芙蓉花，今成断根草。
以色事他人，能得几时好？`,bg:`李白借陈阿娇由"金屋藏娇"到幽居长门的遭遇，写帝王恩宠之不可恃。末四句是冷峻的总结，也常被读作诗人对自身"以色（才）事人"处境的自嘲。`},
{t:'陌上赠美人',body:`白马骄行踏落花，
垂鞭直拂五云车。
美人一笑褰珠箔，
遥指红楼是妾家。`,bg:`李白春日骑马出游，落花满径；美人撩起珠帘一笑，遥指红楼说"那就是我家"。二十八字如一幅唐人仕女出游图。`},
{t:'赠孟浩然',body:`吾爱孟夫子，风流天下闻。
红颜弃轩冕，白首卧松云。
醉月频中圣，迷花不事君。
高山安可仰，徒此揖清芬。`,bg:`开元后期李白在襄阳结识年长十二岁的孟浩然。他敬其弃官隐居、醉月迷花，以"高山仰止"作比，是唐诗中最著名的赠隐士之作。`},
{t:'上李邕',body:`大鹏一日同风起，扶摇直上九万里。
假令风歇时下来，犹能簸却沧溟水。
世人见我恒殊调，闻余大言皆冷笑。
宣父犹能畏后生，丈夫未可轻年少。`,bg:`李白青年时谒见渝州刺史李邕，因不拘俗礼引起不快，遂以此诗明志。以大鹏自喻，末以孔子"后生可畏"反讥，少年意气跃然纸上。`},
{t:'南陵别儿童入京',body:`白酒新熟山中归，黄鸡啄黍秋正肥。
呼童烹鸡酌白酒，儿女嬉笑牵人衣。
高歌取醉欲自慰，起舞落日争光辉。
游说万乘苦不早，著鞭跨马涉远道。
会稽愚妇轻买臣，余亦辞家西入秦。
仰天大笑出门去，我辈岂是蓬蒿人。`,bg:`天宝元年（742）李白奉诏入京，此诗作于南陵家中与妻儿告别时。他用朱买臣得志的典故暗讽轻视自己的世俗之人，末句"仰天大笑出门去"，是其一生的高光时刻。`},
{t:'沙丘城下寄杜甫',body:`我来竟何事？高卧沙丘城。
城边有古树，日夕连秋声。
鲁酒不可醉，齐歌空复情。
思君若汶水，浩荡寄南征。`,bg:`天宝四载（745）李白与杜甫在鲁郡分别后，独居沙丘城时所作。鲁酒齐歌都无味，思念如汶水浩荡南流——这是两位大诗人交谊最真切的见证。`},
{t:'鲁郡东石门送杜二甫',body:`醉别复几日，登临遍池台。
何时石门路，重有金樽开。
秋波落泗水，海色明徂徕。
飞蓬各自远，且尽手中杯。`,bg:`天宝四载（745）秋，李白在鲁郡石门送别杜甫。两人醉别已好几日，此刻泗水秋波、徂徕海色，飞蓬各远，只余手中这一杯。`},
{t:'闻王昌龄左迁龙标遥有此寄',body:`杨花落尽子规啼，
闻道龙标过五溪。
我寄愁心与明月，
随君直到夜郎西。`,bg:`天宝八载（749）前后，王昌龄被贬为龙标尉，远赴湘西。李白时在江南，闻讯寄此诗相慰。他把一颗愁心托付给明月，让月光一路跟着友人走到贬所，是唐诗中最动人的慰藉。`},
{t:'黄鹤楼送孟浩然之广陵',body:`故人西辞黄鹤楼，
烟花三月下扬州。
孤帆远影碧空尽，
唯见长江天际流。`,bg:`开元十八年（730）前后，李白在黄鹤楼送别孟浩然东下扬州。暮春烟花、孤帆远去，诗人久久伫立江边——写离别而不着一个"愁"字，情意尽在流水之中。`},
{t:'送友人',body:`青山横北郭，白水绕东城。
此地一为别，孤蓬万里征。
浮云游子意，落日故人情。
挥手自兹去，萧萧班马鸣。`,bg:`天宝末年，李白在宣城送别友人。青山白水为幕，浮云落日为喻，末以离群之马萧萧长鸣收束——不写人哭，只写马鸣，而别情自见。`},
{t:'送友人入蜀',body:`见说蚕丛路，崎岖不易行。
山从人面起，云傍马头生。
芳树笼秦栈，春流绕蜀城。
升沉应已定，不必问君平。`,bg:`李白送友人入蜀，先极写栈道崎岖、山云逼人，再写蜀中春色，末以严君平卖卜的典故劝友人：升沉自有定数，不必去问卜。`},
{t:'金陵酒肆留别',body:`风吹柳花满店香，吴姬压酒唤客尝。
金陵子弟来相送，欲行不行各尽觞。
请君试问东流水，别意与之谁短长？`,bg:`李白离金陵时，酒肆里柳花飘香、吴姬劝酒，一群年轻朋友来送行，欲行不行，各自干杯。末句问东流水：我的别意和它比，谁更长？`},
{t:'送裴十八图南归嵩山',body:`君思颍水绿，忽复归嵩岑。
归时莫洗耳，为我洗其心。
洗心得真情，洗耳徒买名。
谢公终一起，相与济苍生。`,bg:`天宝年间李白在长安送裴图南归隐嵩山。他翻用许由洗耳的典故，劝友人莫为"高隐"之名，而要先洗其心；末以谢安终将出山相期，可见他自己并未忘情于世。`},
{t:'送杨山人归嵩山',body:`我有万古宅，嵩阳玉女峰。
长留一片月，挂在东溪松。
尔去掇仙草，菖蒲花紫茸。
岁晚或相访，青天骑白龙。`,bg:`李白送一位修道的杨姓友人回嵩山。他把嵩山玉女峰说成自己的"万古宅"，还相约来日骑白龙相访，是求仙诗中飘逸的一路。`},
{t:'白云歌送刘十六归山',body:`楚山秦山皆白云，白云处处长随君。
长随君，君入楚山里，云亦随君渡湘水。
湘水上，女萝衣，白云堪卧君早归。`,bg:`此诗用楚辞体写的送别歌。白云一路跟着友人入楚山、渡湘水，最后劝他：白云可卧，早点归来吧。句式回环，有民歌的风味。`},
{t:'送储邕之武昌',body:`黄鹤西楼月，长江万里情。
春风三十度，空忆武昌城。
送尔难为别，衔杯惜未倾。
湖连张乐地，山逐泛舟行。
诺为楚人重，诗传谢朓清。
沧浪吾有曲，寄入棹歌声。`,bg:`李白在金陵送储邕赴武昌。黄鹤楼月、长江万里，三十年来他一直惦着武昌城；临别杯酒难倾，末以《沧浪歌》相寄，情深而不滥。`},
{t:'劳劳亭',body:`天下伤心处，
劳劳送客亭。
春风知别苦，
不遣柳条青。`,bg:`天宝年间李白在金陵。城南劳劳亭是六朝以来的著名送别之地。春风本无情，诗人却说它懂得离别之苦，故意不让柳条返青——无理而妙，是李白式的痴语。`},
{t:'送陆判官往琵琶峡',body:`水国秋风夜，
殊非远别时。
长安如梦里，
何日是归期？`,bg:`秋夜水国送别陆判官往琵琶峡。明明不是适宜远别的时候，却不得不别；长安如在梦中，归期更是渺茫。二十字里全是身世之感。`},
{t:'江夏别宋之悌',body:`楚水清若空，遥将碧海通。
人分千里外，兴在一杯中。
谷鸟吟晴日，江猿啸晚风。
平生不下泪，于此泣无穷。`,bg:`李白在江夏送别宋之悌。楚水清澈如空，友人此去千里；诗人自言平生不轻易落泪，此刻却泣下不止——宋之悌是宋之问之弟，两人皆为贬谪之人。`},
{t:'送贺宾客归越',body:`镜湖流水漾清波，
狂客归舟逸兴多。
山阴道士如相见，
应写黄庭换白鹅。`,bg:`天宝三载（744）贺知章请度为道士、还乡会稽，李白作此送行。贺自号"四明狂客"，诗人用王羲之写《黄庭经》换鹅的典故相戏，风流蕴藉。`},
{t:'送殷淑',body:`白鹭洲前月，天明送客回。
青龙山后日，早出海云来。
流水无情去，征帆逐吹开。
相看不忍别，更进手中杯。`,bg:`李白在白鹭洲送别殷淑。月落日升，流水无情，征帆已逐风而开；相看不忍别，唯有再饮手中这一杯。`},
{t:'送范山人归泰山',body:`鲁客抱白鹤，别余往泰山。
初行若片云，杳在青崖间。
高高至天门，日观近可攀。
云山望不及，此去何时还？`,bg:`李白在东鲁送一位姓范的隐士回泰山。友人抱着白鹤上路，身影如一片云消失在青崖间；诗人望到望不见为止，只问一句：此去何时回来？`},
{t:'送韩侍御之广德',body:`昔日绣衣何足荣，
今宵贳酒与君倾。
暂就东山赊月色，
酣歌一夜送泉明。`,bg:`李白与韩侍御夜饮送别。他说往日的绣衣荣耀算不得什么，今夜只管赊来东山的月色，酣歌一整夜送你这位"泉明"（渊明）。`},
{t:'送张舍人之江东',body:`张翰江东去，正值秋风时。
天清一雁远，海阔孤帆迟。
白日行欲暮，沧波杳难期。
吴洲如见月，千里幸相思。`,bg:`李白以张翰秋风思归的典故切"之江东"。天清雁远、海阔帆迟，末句说吴洲若见明月，千里之外也请相忆。`},
{t:'别储邕之剡中',body:`借问剡中道，东南指越乡。
舟从广陵去，水入会稽长。
竹色溪下绿，荷花镜里香。
辞君向天姥，拂石卧秋霜。`,bg:`李白送储邕去剡中（今浙江嵊州）。一路竹绿水长、荷香如镜，末句却落到"拂石卧秋霜"——剡中是通往天姥山的路，那里有他梦中的仙境。`},
{t:'送温处士归黄山白鹅峰旧居',body:`黄山四千仞，三十二莲峰。
丹崖夹石柱，菡萏金芙蓉。
伊昔升绝顶，下窥天目松。
仙人炼玉处，羽化留馀踪。
亦闻温伯雪，独往今相逢。
采秀辞五岳，攀岩历万重。
归休白鹅岭，渴饮丹砂井。
凤吹我时来，云车尔当整。
去去陵阳东，行行芳桂丛。
回溪十六度，碧嶂尽晴空。
他日还相访，乘桥蹑彩虹。`,bg:`李白送温处士回黄山。他把黄山三十二峰写成金芙蓉，把友人的归隐写成骑鹤饮丹砂的仙事，末句相约来日踏彩虹相访。`},
{t:'金乡送韦八之西京',body:`客自长安来，还归长安去。
狂风吹我心，西挂咸阳树。
此情不可道，此别何时遇？
望望不见君，连山起烟雾。`,bg:`李白在金乡送韦八回长安。"狂风吹我心，西挂咸阳树"是奇绝的想象：心被狂风卷去挂在长安的树上——那里是他永远放不下的地方。`},
{t:'送族弟凝之滁求婚崔氏',body:`与尔情不浅，忘筌已得鱼。
玉台挂宝镜，持此意何如。
坦腹东床下，由来志气疏。
遥知向前路，掷果定盈车。`,bg:`李白送族弟李凝到滁州求婚。他用温峤玉镜台、王羲之坦腹东床、潘岳掷果盈车三个典故，诙谐地为族弟的婚事说吉利话。`},
{t:'送白利从金吾董将军西征',body:`西羌延国讨，白起佐军威。
剑决浮云气，弓弯明月辉。
马行边草绿，旌卷曙霜飞。
抗手凛相顾，寒风生铁衣。`,bg:`李白送白利随金吾将军董氏西征。剑决浮云、弓弯明月，边草初绿、旌卷曙霜，末句写抗手相别时寒风生于铁甲之上，凛然有金石声。`},
{t:'送外甥郑灌从军 · 其一',body:`六博争雄好彩来，
金盘一掷万人开。
丈夫赌命报天子，
当斩胡头衣锦回。`,bg:`组诗三首之一。李白以六博掷彩起兴，勉励外甥上阵立功：大丈夫赌上性命报效天子，当斩胡人之首、衣锦还乡。`},
{t:'送郄昂谪巴中',body:`瑶草寒不死，移植沧江滨。
东风洒雨露，会入天地春。
予若洞庭叶，随波送逐臣。
思归未可得，书此谢情人。`,bg:`郄昂被贬巴中，李白以此诗相送。他以瑶草不死喻友人的品节，以洞庭落叶自比，说思归虽不可得，且写下此诗以谢故人。`},
{t:'送蔡山人',body:`我本不弃世，世人自弃我。
一乘无倪舟，八极纵远舵。
燕客期跃马，唐生安敢讥。
采珠勿惊龙，大道可暗归。
故山有松月，迟尔玩清晖。`,bg:`李白送一位姓蔡的隐士归山，也借机剖白自己：不是我弃世，是世人弃我。末句却仍盼故山松月，等你同赏清晖。`},
{t:'送杨燕之东鲁',body:`关西杨伯起，汉日旧称贤。
四代三公族，清风播人天。
夫子华阴居，开门对玉莲。
何事历衡霍，云帆今始还。
君坐稍解颜，为君歌此篇。
我固侯门士，谬登圣主筵。
一辞金华殿，蹭蹬长江边。
二子鲁门东，别来已经年。
因君此中去，不觉泪如泉。`,bg:`李白送杨燕回东鲁。先颂其家世清芬，再自述"谬登圣主筵"又被放还的蹭蹬；最挂念的是留在鲁中的两个孩子，说到此处泪如泉涌。`},
{t:'送长沙陈太守 · 其一',body:`长沙陈太守，逸气凌青松。
英主赐五马，本是天池龙。
湘水回九曲，衡山望五峰。
荣君按节去，不及远相从。`,bg:`李白送陈太守赴长沙。以青松喻其逸气、天池龙喻其才具，湘水九曲、衡山五峰，末句遗憾不能相随远去。`},
{t:'送纪秀才游越',body:`海水不满眼，观涛难称心。
即知蓬莱石，却是巨鳌簪。
送尔游华顶，令余发舄吟。
仙人居射的，道士住山阴。
禹穴寻溪入，云门隔岭深。
绿萝秋月夜，相忆在鸣琴。`,bg:`李白送纪秀才游越中。从观涛、蓬莱写到禹穴、云门，一路都是越地名胜；末句说秋月绿萝之夜，我会弹琴相忆。`},
{t:'送李青归华阳川',body:`伯阳仙家子，容色如青春。
日月秘灵洞，云霞辞世人。
化心养精魄，隐几窅天真。
莫作千年别，归来城郭新。`,bg:`李白送道士李青归华阳川。以老子（伯阳）比其道脉，末句反用丁令威化鹤归辽的典故，盼他莫作千年之别。`},
{t:'送舍弟',body:`吾家白额驹，
远别临东道。
他日相思一梦君，
应得池塘生春草。`,bg:`李白送别族弟，以"吾家白额驹"相誉；末句用谢灵运梦谢惠连而得"池塘生春草"的典故，说日后相思入梦，也该梦见这样的好句。`},
{t:'送梁四归东平',body:`玉壶挈美酒，送别强为欢。
大火南星月，长郊北路难。
殷王期负鼎，汶水起垂竿。
莫学东山卧，参差老谢安。`,bg:`李白送梁四回东平。以伊尹负鼎、吕尚垂竿的典故勉励友人及时建功，末句劝他莫学谢安高卧东山，蹉跎到老。`},
{t:'送侯十一',body:`朱亥已击晋，
侯嬴尚隐身。
时无魏公子，
岂贵抱关人。
余亦不火食，
游梁同在陈。
空馀湛卢剑，
赠尔托交亲。`,bg:`李白以侯嬴、朱亥的典故写知遇之难：没有信陵君那样的公子，守门人便无人看重。自己空有一柄湛卢宝剑，只能赠给知己以托交情。`},
{t:'送二季之江东',body:`初发强中作，题诗与惠连。
多惭一日长，不及二龙贤。
西塞当中路，南风欲进船。
云峰出远海，帆影挂清川。
禹穴藏书地，匡山种杏田。
此行俱有适，迟尔早归旋。`,bg:`李白送两位族弟去江东。以谢惠连比其才，一路云峰帆影、禹穴匡山，末句盼他们此行适意、早早归来。`},
{t:'江西送友人之罗浮',body:`桂水分五岭，衡山朝九疑。
乡关渺安西，流浪将何之。
素色愁明湖，秋渚晦寒姿。
畴昔紫芳意，已过黄发期。
君王纵疏散，云壑借巢夷。
尔去之罗浮，我还憩峨眉。
中阔道万里，霞月遥相思。`,bg:`李白在江西送友人去罗浮山，自己则打算回峨眉。两人相隔万里，唯有霞月可以遥寄相思——是他晚年漂泊无定的真实心境。`},
{t:'送赵判官赴黔府中丞叔幕',body:`廓落青云心，交结黄金尽。
富贵翻相忘，令人忽自哂。
蹭蹬鬓毛斑，盛时难再还。
绿萝长不厌，却欲还东山。
君为鲁曾子，拜揖高堂里。
叔继赵平原，偏承明主恩。
风霜推独坐，旌节镇雄藩。
虎士秉金钺，蛾眉开玉樽。
才高幕下去，义重林中言。
水宿五溪月，霜啼三峡猿。
东风春草绿，江上候归轩。`,bg:`李白送赵判官赴黔中幕府。前半自伤交游散尽、两鬓斑白，后半勉励友人佐幕立功，末以春草绿时江上候归作结。`},
{t:'送方士赵叟之东平',body:`长桑晓洞视，
五藏无全牛。
赵叟得秘诀，
还从方士游。
西过获麟台，
为我吊孔丘。
念别复怀古，
潸然空泪流。`,bg:`李白送方士赵叟去东平。以长桑君、庖丁解牛的典故赞其道术，末请他经过获麟台时替自己凭吊孔子——怀古之情与离别之意一并落下泪来。`},
{t:'送程刘二侍御兼独孤判官赴安西幕府',body:`安西幕府多材雄，喧喧惟道三数公。
绣衣貂裘明积雪，飞书走檄如飘风。
朝辞明主出紫宫，银鞍送别金城空。
天外飞霜下葱海，火旗云马生光彩。
胡塞清尘几日归，汉家草绿遥相待。`,bg:`李白送三位友人赴安西幕府。绣衣貂裘映着积雪，飞书走檄疾如飘风；末句说胡塞清尘之日就该归来，汉家草绿正遥遥相待。`},
{t:'送梁公昌从信安郡王北征',body:`入幕推英选，捐书事远戎。
高谈百战术，郁作万夫雄。
起舞莲花剑，行歌明月弓。
将飞天地阵，兵出塞垣通。
祖席留丹景，征麾拂彩虹。
旋应献凯入，麟阁伫深功。`,bg:`李白送梁公昌从信安郡王北征。莲花剑、明月弓，写尽少年将军的风采；末句预期他凯旋献俘、画像麒麟阁。`},
{t:'送族弟绾从军安西',body:`汉家兵马乘北风，鼓行而西破犬戎。
尔随汉将出门去，剪虏若草收奇功。
君王按剑望边色，旄头已落胡天空。
匈奴系颈数应尽，明年应入蒲萄宫。`,bg:`李白送族弟李绾从军安西。全诗气势雄壮，"剪虏若草"四字可见他对战事的乐观；末句预期明年就能献俘于蒲萄宫。`},
{t:'送萧三十一之鲁中兼问稚子伯禽',body:`六月南风吹白沙，吴牛喘月气成霞。
水国郁蒸不可处，时炎道远无行车。
夫子如何涉江路？云帆袅袅金陵去。
高堂倚门望伯鱼，鲁中正是趋庭处。
我家寄在沙丘傍，三年不归空断肠。
君行既识伯禽子，应驾小车骑白羊。`,bg:`天宝年间李白寓居东鲁，子女留在沙丘（今山东兖州）。友人萧三十一要去鲁中，他托对方顺道看望儿子伯禽。末句想象儿子骑着白羊小车的可爱模样，是诗仙少见的慈父柔情。`},
{t:'白鹭鸶',body:`白鹭下秋水，
孤飞如坠霜。
心闲且未去，
独立沙洲傍。`,bg:`李白咏物小诗。白鹭飞下秋水，如一片坠落的霜；它心闲不去，独自立在沙洲边——写的是鹭，也是诗人自许的闲淡。`},
{t:'紫藤树',body:`紫藤挂云木，
花蔓宜阳春。
密叶隐歌鸟，
香风留美人。`,bg:`李白咏庭中紫藤。藤挂高树、花发阳春，密叶里藏着鸣鸟，香风中留住美人，二十字里有声有色有香。`},
{t:'咏邻女东窗海石榴',body:`鲁女东窗下，海榴世所稀。
珊瑚映绿水，未足比光辉。
清香随风发，落日好鸟归。
愿为东南枝，低举拂罗衣。
无由一攀折，引领望金扉。`,bg:`李白寓居东鲁时咏邻家女子窗下的石榴花。以珊瑚映水比其光辉，末句说愿化作东南枝去拂她的罗衣，是咏物而兼写人的轻倩之作。`},
{t:'初月',body:`玉蟾离海上，
白露湿花时。
云畔风生爪，
沙头水浸眉。
乐哉弦管客，
愁杀战征儿。
因绝西园赏，
临风一咏诗。`,bg:`李白咏新月初升：玉蟾离海、白露湿花，云边风起如爪，沙头水浸如眉。同一轮新月，弦管客见之而乐，征人见之而愁。`},
{t:'雨后望月',body:`四郊阴霭散，
开户半蟾生。
万里舒霜合，
一条江练横。
出时山眼白，
高后海心明。
为惜如团扇，
长吟到五更。`,bg:`李白雨后开窗见月。万里霜华如练横江，山眼初白、海心渐明；他怜惜这轮如团扇的月亮，吟咏到天明。`},
{t:'对雨',body:`卷帘聊举目，
露湿草绵芊。
古岫藏云毳，
空庭织碎烟。
水纹愁不起，
风线重难牵。
尽日扶犁叟，
往来江树前。`,bg:`李白写雨中即景：卷帘远望，露湿芳草，古山藏云，空庭织烟。水面无纹、风线难牵，只有扶犁的老农在江树间往来。`},
{t:'晓晴',body:`野凉疏雨歇，
春色遍萋萋。
鱼跃青池满，
莺吟绿树低。
野花妆面湿，
山草纽斜齐。
零落残云片，
风吹挂竹溪。`,bg:`李白写雨后初晴：野凉雨歇，春草萋萋，鱼跃莺吟，野花带露。残云片片被风吹着挂在竹溪之上，是极清新的小品。`},
{t:'望月有怀',body:`清泉映疏松，
不知几千古。
寒月摇清波，
流光入窗户。
对此空长吟，
思君意何深。
无因见安道，
兴尽愁人心。`,bg:`李白望月怀人，用王子猷雪夜访戴"乘兴而来，兴尽而返"的典故：如今连安道也见不到，兴尽之处只剩一片愁心。`},
{t:'落日忆山中',body:`雨后烟景绿，
晴天散馀霞。
东风随春归，
发我枝上花。
花落时欲暮，
见此令人嗟。
愿游名山去，
学道飞丹砂。`,bg:`李白见落日花落而兴叹。雨后山绿、馀霞散绮，东风发花；可花落日暮，他由此生出遨游名山、炼丹学道之想。`},
{t:'日出入行',body:`日出东方隈，似从地底来。
历天又入海，六龙所舍安在哉？
其始与终古不息，人非元气安能与之久裴徊？
草不谢荣于春风，木不怨落于秋天。
谁挥鞭策驱四运？万物兴歇皆自然。
羲和羲和，汝奚汩没于荒淫之波？
鲁阳何德，驻景挥戈？
逆道违天，矫诬实多。
吾将囊括大块，浩然与溟涬同科。`,bg:`乐府旧题。李白反其意而行之：日出日入皆是自然，草木荣落无需感恩或怨尤；他要包举天地，与元气同流。是朴素唯物思想的诗意表达。`},
{t:'独酌',body:`春草如有意，罗生玉堂阴。
东风吹愁来，白发坐相侵。
独酌劝孤影，闲歌面芳林。
长松尔何知，萧瑟为谁吟。
手舞石上月，膝横花间琴。
过此一壶外，悠悠非我心。`,bg:`李白春日独酌。春草多情而白发相侵，他劝自己的孤影饮酒，对芳林闲歌，在石上月、花间琴中手舞足蹈——一壶之外，万事悠悠。`},
{t:'春日独酌 · 其一',body:`东风扇淑气，水木荣春晖。
白日照绿草，落花散且飞。
孤云还空山，众鸟各已归。
彼物皆有托，吾生独无依。
对此石上月，长醉歌芳菲。`,bg:`李白春日独酌，见孤云归山、众鸟归巢，万物各有所托，唯独自己无依。唯有对石上明月，长醉而歌。`},
{t:'春日醉起言志',body:`处世若大梦，胡为劳其生？
所以终日醉，颓然卧前楹。
觉来眄庭前，一鸟花间鸣。
借问此何时？春风语流莺。
感之欲叹息，对酒还自倾。
浩歌待明月，曲尽已忘情。`,bg:`李白春日醉起，以"处世若大梦"开篇，自问何必劳碌一生；醒来看庭前花鸟，对酒自倾，浩歌待月，曲终而忘情。`},
{t:'拟古十二首 · 其九',body:`生者为过客，死者为归人。
天地一逆旅，同悲万古尘。
月兔空捣药，扶桑已成薪。
白骨寂无言，青松岂知春。
前后更叹息，浮荣安足珍？`,bg:`《拟古》组诗之一。李白以"天地一逆旅"的旷达观照生死，说月兔捣药是空忙、扶桑终成薪柴，浮世荣华哪里值得珍重。`},
{t:'下终南山过斛斯山人宿置酒',body:`暮从碧山下，山月随人归。
却顾所来径，苍苍横翠微。
相携及田家，童稚开荆扉。
绿竹入幽径，青萝拂行衣。
欢言得所憩，美酒聊共挥。
长歌吟松风，曲尽河星稀。
我醉君复乐，陶然共忘机。`,bg:`李白在长安附近终南山下访问一位姓斛斯的隐士。绿竹幽径、青萝拂衣，两人饮酒长歌直到银河星稀，陶然间把世俗机心都忘了。`},
{t:'听蜀僧濬弹琴',body:`蜀僧抱绿绮，西下峨眉峰。
为我一挥手，如听万壑松。
客心洗流水，馀响入霜钟。
不觉碧山暮，秋云暗几重。`,bg:`李白听蜀地僧人濬弹琴。琴声如万壑松涛，客心如被流水洗过；一曲终了，碧山已暮，秋云不知暗了几重。`},
{t:'访戴天山道士不遇',body:`犬吠水声中，桃花带雨浓。
树深时见鹿，溪午不闻钟。
野竹分青霭，飞泉挂碧峰。
无人知所去，愁倚两三松。`,bg:`李白青年时在戴天山访道不遇。犬吠水声、桃花带雨，林深见鹿、溪午无钟；道士不知何往，他只得惆怅地倚着松树等待。`},
{t:'春夜洛城闻笛',body:`谁家玉笛暗飞声，
散入春风满洛城。
此夜曲中闻折柳，
何人不起故园情。`,bg:`开元二十三年（735）前后，李白客居东都洛阳。春夜忽闻笛声，吹的正是汉乐府《折杨柳》曲，古人有折柳赠别之俗。一声笛，满城春，也唤起满城游子的乡思。`},
{t:'襄阳歌',body:`落日欲没岘山西，倒著接䍠花下迷。
襄阳小儿齐拍手，拦街争唱白铜鞮。
傍人借问笑何事，笑杀山公醉似泥。
鸬鹚杓，鹦鹉杯。
百年三万六千日，一日须倾三百杯。
遥看汉水鸭头绿，恰似葡萄初酦醅。
此江若变作春酒，垒曲便筑糟丘台。
千金骏马换小妾，笑坐雕鞍歌落梅。
车傍侧挂一壶酒，凤笙龙管行相催。
咸阳市中叹黄犬，何如月下倾金罍？
君不见晋朝羊公一片石，龟头剥落生莓苔。
泪亦不能为之堕，心亦不能为之哀。
清风明月不用一钱买，玉山自倒非人推。
舒州杓，力士铛，李白与尔同死生。
襄王云雨今安在？江水东流猿夜声。`,bg:`开元年间李白游襄阳。他以山简醉酒自况，要用鸬鹚杓、鹦鹉杯倾尽百年三万六千日；"清风明月不用一钱买"一句，最能见其胸襟。`},
{t:'江上吟',body:`木兰之枻沙棠舟，玉箫金管坐两头。
美酒樽中置千斛，载妓随波任去留。
仙人有待乘黄鹤，海客无心随白鸥。
屈平辞赋悬日月，楚王台榭空山丘。
兴酣落笔摇五岳，诗成笑傲凌沧洲。
功名富贵若长在，汉水亦应西北流。`,bg:`李白泛舟江上，以屈原辞赋与日月同辉反衬楚王台榭终成空丘。"功名富贵若长在，汉水亦应西北流"，是他最决绝的富贵观。`},
{t:'扶风豪士歌',body:`洛阳三月飞胡沙，洛阳城中人怨嗟。
天津流水波赤血，白骨相撑如乱麻。
我亦东奔向吴国，浮云四塞道路赊。
东方日出啼早鸦，城门人开扫落花。
梧桐杨柳拂金井，来醉扶风豪士家。
扶风豪士天下奇，意气相倾山可移。
作人不倚将军势，饮酒岂顾尚书期。
雕盘绮食会众客，吴歌赵舞香风吹。
原尝春陵六国时，开心写意君所知。
堂中各有三千士，明日报恩知是谁。
抚长剑，一扬眉，清水白石何离离。
脱吾帽，向君笑。饮君酒，为君吟。
张良未逐赤松去，桥边黄石知我心。`,bg:`天宝十五载（756）安史之乱中，李白避地东南，受扶风豪士款待而作。诗前半写洛阳惨状，后半写豪士意气，末以张良自许，仍想有所作为。`},
{t:'梁园吟',body:`我浮黄河去京阙，挂席欲进波连山。
天长水阔厌远涉，访古始及平台间。
平台为客忧思多，对酒遂作梁园歌。
却忆蓬池阮公咏，因吟渌水扬洪波。
洪波浩荡迷旧国，路远西归安可得。
人生达命岂暇愁，且饮美酒登高楼。
平头奴子摇大扇，五月不热疑清秋。
玉盘杨梅为君设，吴盐如花皎白雪。
持盐把酒但饮之，莫学夷齐事高洁。
昔人豪贵信陵君，今人耕种信陵坟。
荒城虚照碧山月，古木尽入苍梧云。
梁王宫阙今安在？枚马先归不相待。
舞影歌声散绿池，空馀汴水东流海。
沉吟此事泪满衣，黄金买醉未能归。
连呼五白行六博，分曹赌酒酣驰晖。
歌且谣，意方远。
东山高卧时起来，欲济苍生未应晚。`,bg:`天宝三载（744）李白被放还后游梁园（今河南商丘）所作。他凭吊信陵君、梁孝王遗迹，一醉再醉，末句却仍说"欲济苍生未应晚"——失意中犹有壮心。`},
{t:'庐山谣寄卢侍御虚舟',body:`我本楚狂人，凤歌笑孔丘。
手持绿玉杖，朝别黄鹤楼。
五岳寻仙不辞远，一生好入名山游。
庐山秀出南斗傍，屏风九叠云锦张，影落明湖青黛光。
金阙前开二峰长，银河倒挂三石梁。
香炉瀑布遥相望，回崖沓嶂凌苍苍。
翠影红霞映朝日，鸟飞不到吴天长。
登高壮观天地间，大江茫茫去不还。
黄云万里动风色，白波九道流雪山。
好为庐山谣，兴因庐山发。
闲窥石镜清我心，谢公行处苍苔没。
早服还丹无世情，琴心三叠道初成。
遥见仙人彩云里，手把芙蓉朝玉京。
先期汗漫九垓上，愿接卢敖游太清。`,bg:`上元元年（760）前后李白流放遇赦后再上庐山所作。开篇"我本楚狂人，凤歌笑孔丘"，是他对自己一生最坦率的自画像。`},
{t:'当涂赵炎少府粉图山水歌',body:`峨眉高出西极天，罗浮直与南溟连。
名公绎思挥彩笔，驱山走海置眼前。
满堂空翠如可扫，赤城霞气苍梧烟。
洞庭潇湘意渺绵，三江七泽情洄沿。
惊涛汹涌向何处，孤舟一去迷归年。
征帆不动亦不旋，飘如随风落天边。
心摇目断兴难尽，几时可到三山巅。
西峰峥嵘喷流泉，横石蹙水波潺湲。
东崖合沓蔽轻雾，深林杂树空芊绵。
此中冥昧失昼夜，隐几寂听无鸣蝉。
长松之下列羽客，对坐不语南昌仙。
南昌仙人赵夫子，妙年历落青云士。
讼庭无事罗众宾，杳然如在丹青里。
五色粉图安足珍，真仙可以全吾身。
若待功成拂衣去，武陵桃花笑杀人。`,bg:`李白在当涂县尉赵炎家观山水壁画而作。画中峨眉罗浮、洞庭潇湘尽收眼底，他看得心驰神往，恨不得走进画里去寻仙。`},
{t:'草书歌行',body:`少年上人号怀素，草书天下称独步。
墨池飞出北溟鱼，笔锋杀尽中山兔。
八月九月天气凉，酒徒词客满高堂。
笺麻素绢排数箱，宣州石砚墨色光。
吾师醉后倚绳床，须臾扫尽数千张。
飘风骤雨惊飒飒，落花飞雪何茫茫。
起来向壁不停手，一行数字大如斗。
怳怳如闻神鬼惊，时时只见龙蛇走。
左盘右蹙如惊电，状同楚汉相攻战。
湖南七郡凡几家，家家屏障书题遍。
王逸少，张伯英，古来几许浪得名。
张颠老死不足数，我师此义不师古。
古来万事贵天生，何必要公孙大娘浑脱舞。`,bg:`乾元二年（759）前后李白遇怀素于零陵，为其草书作歌。以飘风骤雨、龙蛇走、楚汉相攻形容笔势，末句"古来万事贵天才"，正是他一贯的艺术主张。`},
{t:'西岳云台歌送丹丘子',body:`西岳峥嵘何壮哉！黄河如丝天际来。
黄河万里触山动，盘涡毂转秦地雷。
荣光休气纷五彩，千年一清圣人在。
巨灵咆哮擘两山，洪波喷箭射东海。
三峰却立如欲摧，翠崖丹谷高掌开。
白帝金精运元气，石作莲花云作台。
云台阁道连窈冥，中有不死丹丘生。
明星玉女备洒扫，麻姑搔背指爪轻。
我皇手把天地户，丹丘谈天与天语。
九重出入生光辉，东来蓬莱复西归。
玉浆倘惠故人饮，骑二茅龙上天飞。`,bg:`李白送道友元丹丘归华山。以黄河如丝、巨灵擘山写华山之壮，把友人写成云台上的不死仙人，末句还讨一杯玉浆，要骑龙上天。`},
{t:'元丹丘歌',body:`元丹丘，爱神仙。
朝饮颍川之清流，暮还嵩岑之紫烟，
三十六峰长周旋。
长周旋，蹑星虹，身骑飞龙耳生风，
横河跨海与天通，我知尔游心无穷。`,bg:`李白赠道友元丹丘。句式参差如歌谣，把修道者写成朝饮清流、暮还紫烟、骑飞龙跨河海的仙人，是李白与道士交游的生动记录。`},
{t:'玉壶吟',body:`烈士击玉壶，壮心惜暮年。
三杯拂剑舞秋月，忽然高咏涕泗涟。
凤凰初下紫泥诏，谒帝称觞登御筵。
揄扬九重万乘主，谑浪赤墀青琐贤。
朝天数换飞龙马，敕赐珊瑚白玉鞭。
世人不识东方朔，大隐金门是谪仙。
西施宜笑复宜颦，丑女效之徒累身。
君王虽爱蛾眉好，无奈宫中妒杀人。`,bg:`李白离开长安后追忆供奉翰林的岁月。当年奉诏登筵、赐马赐鞭何等风光，却因小人嫉妒而去。"大隐金门是谪仙"是他的自解，也是他的自傲。`},
{t:'梁甫吟',body:`长啸梁甫吟，何时见阳春？
君不见朝歌屠叟辞棘津，八十西来钓渭滨。
宁羞白发照清水，逢时吐气思经纶。
广张三千六百钓，风期暗与文王亲。
大贤虎变愚不测，当年颇似寻常人。
君不见高阳酒徒起草中，长揖山东隆准公。
入门不拜骋雄辩，两女辍洗来趋风。
东下齐城七十二，指挥楚汉如旋蓬。
狂客落拓尚如此，何况壮士当群雄！
我欲攀龙见明主，雷公砰訇震天鼓。
帝旁投壶多玉女，三时大笑开电光，倏烁晦冥起风雨。
阊阖九门不可通，以额扣关阍者怒。
白日不照吾精诚，杞国无事忧天倾。
猰貐磨牙竞人肉，驺虞不折生草茎。
手接飞猱搏雕虎，侧足焦原未言苦。
智者可卷愚者豪，世人见我轻鸿毛。
力排南山三壮士，齐相杀之费二桃。
吴楚弄兵无剧孟，亚夫咍尔为徒劳。
梁甫吟，声正悲。
张公两龙剑，神物合有时。
风云感会起屠钓，大人𡸣屼当安之。`,bg:`约作于开元后期李白初入长安求仕不遇时。连用姜太公、郦食其的典故自励，中间写叩天阍而不得通，结尾仍坚信"神物合有时"。`},
{t:'答王十二寒夜独酌有怀',body:`昨夜吴中雪，子猷佳兴发。
万里浮云卷碧山，青天中道流孤月。
孤月沧浪河汉清，北斗错落长庚明。
怀余对酒夜霜白，玉床金井冰峥嵘。
人生飘忽百年内，且须酣畅万古情。
君不能狸膏金距学斗鸡，坐令鼻息吹虹霓。
君不能学哥舒，横行青海夜带刀，西屠石堡取紫袍。
吟诗作赋北窗里，万言不值一杯水。
世人闻此皆掉头，有如东风射马耳。
鱼目亦笑我，谓与明月同。
骅骝拳跼不能食，蹇驴得志鸣春风。
折杨皇华合流俗，晋君听琴枉清角。
巴人谁肯和阳春，楚地由来贱奇璞。
黄金散尽交不成，白首为儒身被轻。
一谈一笑失颜色，苍蝇贝锦喧谤声。
曾参岂是杀人者？谗言三及慈母惊。
与君论心握君手，荣辱于余亦何有？
孔圣犹闻伤凤麟，董龙更是何鸡狗！
一生傲岸苦不谐，恩疏媒劳志多乖。
严陵高揖汉天子，何必长剑拄颐事玉阶。
达亦不足贵，穷亦不足悲。
韩信羞将绛灌比，祢衡耻逐屠沽儿。
君不见李北海，英风豪气今何在！
君不见裴尚书，土坟三尺蒿棘居！
少年早欲五湖去，见此弥将钟鼎疏。`,bg:`天宝八载（749）前后，李白答友人王十二的寒夜独酌之作。全诗痛斥斗鸡之徒与边将冒功，悲李邕、裴敦复被害，是他最长、最激愤的抒情长篇之一。`},
{t:'鸣皋歌送岑征君',body:`若有人兮思鸣皋，阻积雪兮心烦劳。
洪河凌兢不可以径度，冰龙鳞兮难容舠。
邈仙山之峻极兮，闻天籁之嘈嘈。
霜崖缟皓以合沓兮，若长风扇海涌沧溟之波涛。
玄猿绿罴，舔舕崟岌。
危柯振石，骇胆栗魄，群呼而相号。
峰峥嵘以路绝，挂星辰于岩嶅。
送君之归兮，动鸣皋之新作。
交鼓吹兮弹丝，觞清泠之池阁。
君不行兮何待？若反顾之黄鹄。
扫梁园之群英，振大雅于东洛。
巾征轩兮历阻折，寻幽居兮越𪩘崿。
盘白石兮坐素月，琴松风兮寂万壑。
望不见兮心氛氲，萝冥冥兮霰纷纷。
水横洞以下渌，波小声而上闻。
虎啸谷而生风，龙藏溪而吐云。
冥鹤清唳，饥鼯嚬呻。
块独处此幽默兮，愀空山而愁人。
鸡聚族以争食，凤孤飞而无邻。
蝘蜓嘲龙，鱼目混珍。
嫫母衣锦，西施负薪。
若使巢由桎梏于轩冕兮，亦奚异乎夔龙蹩躠于风尘！
哭何苦而救楚，笑何夸而却秦？
吾诚不能学二子沽名矫节以耀世兮，固将弃天地而遗身。
白鸥兮飞来，长与君兮相亲。`,bg:`天宝四载（745）前后李白送岑勋归鸣皋山，用楚辞体写成。前半写雪山险阻，后半痛斥"蝘蜓嘲龙，鱼目混珍"的颠倒世相，是骚体诗的杰作。`},
{t:'忆旧游寄谯郡元参军',body:`忆昔洛阳董糟丘，为余天津桥南造酒楼。
黄金白璧买歌笑，一醉累月轻王侯。
海内贤豪青云客，就中与君心莫逆。
回山转海不作难，倾情倒意无所惜。
我向淮南攀桂枝，君留洛北愁梦思。
不忍别，还相随。
相随迢迢访仙城，三十六曲水回萦。
一溪初入千花明，万壑度尽松风声。
银鞍金络到平地，汉东太守来相迎。
紫阳之真人，邀我吹玉笙。
餐霞楼上动仙乐，嘈然宛似鸾凤鸣。
袖长管催欲轻举，汉东太守醉起舞。
手持锦袍覆我身，我醉横眠枕其股。
当筵意气凌九霄，星离雨散不终朝，分飞楚关山水遥。
余既还山寻故巢，君亦归家渡渭桥。
君家严君勇貔虎，作尹并州遏戎虏。
五月相呼渡太行，摧轮不道羊肠苦。
行来北凉岁月深，感君贵义轻黄金。
琼杯绮食青玉案，使我醉饱无归心。
时时出向城西曲，晋祠流水如碧玉。
浮舟弄水箫鼓鸣，微波龙鳞莎草绿。
兴来携妓恣经过，其若杨花似雪何。
红妆欲醉宜斜日，百尺清潭写翠娥。
翠娥婵娟初月辉，美人更唱舞罗衣。
清风吹歌入空去，歌曲自绕行云飞。
此时行乐难再遇，西游因献长杨赋。
北阙青云不可期，东山白首还归去。
渭桥南头一遇君，酂台之北又离群。
问余别恨今多少，落花春暮争纷纷。
言亦不可尽，情亦不可及。
呼儿长跪缄此辞，寄君千里遥相忆。`,bg:`李白寄给好友元演的长篇回忆诗。从洛阳酒楼、随州仙城写到并州晋祠，四次聚散尽在其中，是他交游诗中最富叙事性的一首。`},
{t:'永王东巡歌 · 其二',body:`三川北虏乱如麻，
四海南奔似永嘉。
但用东山谢安石，
为君谈笑静胡沙。`,bg:`至德元载（756）李白入永王李璘幕府时所作。他以谢安自许，以为谈笑间便可平定胡尘——这是他一生最危险的一次政治豪赌。`},
{t:'上皇西巡南京歌 · 其二',body:`九天开出一成都，
万户千门入画图。
草树云山如锦绣，
秦川得及此间无。`,bg:`天宝十五载（756）玄宗避乱入蜀，李白作组诗歌咏成都。以"九天开出"赞美蜀都形胜，末句反问：秦川哪比得上这里？`},
{t:'与史郎中钦听黄鹤楼上吹笛',body:`一为迁客去长沙，
西望长安不见家。
黄鹤楼中吹玉笛，
江城五月落梅花。`,bg:`乾元元年（758）李白流放夜郎途中经江夏。他以贾谊贬长沙自比，黄鹤楼中一曲《梅花落》，让五月的江城飘满了梅花。`},
{t:'宣城见杜鹃花',body:`蜀国曾闻子规鸟，
宣城还见杜鹃花。
一叫一回肠一断，
三春三月忆三巴。`,bg:`李白晚年流寓宣城，见杜鹃花而想起故乡蜀地的子规鸟。鸟叫一回肠断一回，三月暮春，最忆三巴故里。`},
{t:'自遣',body:`对酒不觉暝，
落花盈我衣。
醉起步溪月，
鸟还人亦稀。`,bg:`李白独饮至暮，落花落满衣襟。醉后沿着溪月漫步，鸟已归巢，人迹也稀——是他隐居生活的剪影。`},
{t:'忆东山 · 其一',body:`不向东山久，
蔷薇几度花。
白云还自散，
明月落谁家。`,bg:`李白怀念谢安隐居的东山。久不前去，蔷薇几度花开；白云自散，明月不知落在谁家——淡淡的怅惘里是对前贤的追慕。`},
{t:'题情深树寄象公',body:`肠断枝上猿，
泪添山下樽。
白云见我去，
亦为我飞翻。`,bg:`李白在山中告别象公。枝上猿啼令人肠断，杯中又添了离泪；连白云见我离去，也为之翻飞不止。`},
{t:'白鼻騧',body:`银鞍白鼻騧，
绿地障泥锦。
细雨春风花落时，
挥鞭直就胡姬饮。`,bg:`乐府旧题。李白写一位骑着白鼻黑嘴骏马的少年郎，在细雨春风、落花时节挥鞭直入胡姬酒肆，是盛唐少年游侠的速写。`},
{t:'少年行 · 其二',body:`五陵年少金市东，
银鞍白马度春风。
落花踏尽游何处，
笑入胡姬酒肆中。`,bg:`李白咏长安少年。银鞍白马、踏尽落花，最后笑着走进胡姬的酒肆——盛唐繁华与少年豪气尽在其中。`},
{t:'结袜子',body:`燕南壮士吴门豪，
筑中置铅鱼隐刀。
感君恩重许君命，
太山一掷轻鸿毛。`,bg:`乐府旧题。李白咏高渐离筑中置铅、专诸鱼腹藏刀的刺客故事，赞其感君恩重、以命相许，把泰山般的一掷看得轻如鸿毛。`},
{t:'侠客行',body:`赵客缦胡缨，吴钩霜雪明。
银鞍照白马，飒沓如流星。
十步杀一人，千里不留行。
事了拂衣去，深藏身与名。
闲过信陵饮，脱剑膝前横。
将炙啖朱亥，持觞劝侯嬴。
三杯吐然诺，五岳倒为轻。
眼花耳热后，意气素霓生。
救赵挥金槌，邯郸先震惊。
千秋二壮士，烜赫大梁城。
纵死侠骨香，不惭世上英。
谁能书阁下，白首太玄经。`,bg:`乐府旧题。李白借信陵君门下侯嬴、朱亥的故事，塑造了理想中的侠客形象：事了拂衣去，深藏身与名。末句以扬雄白首著书作反衬。`},
{t:'白马篇',body:`龙马花雪毛，金鞍五陵豪。
秋霜切玉剑，落日明珠袍。
斗鸡事万乘，轩盖一何高。
弓摧南山虎，手接太行猱。
酒后竞风采，三杯弄宝刀。
杀人如剪草，剧孟同游遨。
发愤去函谷，从军向临洮。
叱咤经百战，匈奴尽奔逃。
归来使酒气，未肯拜萧曹。
羞入原宪室，荒径隐蓬蒿。`,bg:`曹植有同名之作，李白借旧题写游侠少年。从斗鸡走马到从军破敌，末句说他归来仍使酒任气，不肯低首拜谒权贵。`},
{t:'幽州胡马客歌',body:`幽州胡马客，绿眼虎皮冠。
笑拂两只箭，万人不可干。
弯弓若转月，白雁落云端。
双双掉鞭行，游猎向楼兰。
出门不顾后，报国死何难。
天骄五单于，狼戾好凶残。
牛马散北海，割鲜若虎餐。
虽居燕支山，不道朔雪寒。
妇女马上笑，颜如赪玉盘。
翻飞射鸟兽，花月醉雕鞍。
旄头四光芒，争战若蜂攒。
白刃洒赤血，流沙为之丹。
名将古谁是，疲兵良可叹。
何时天狼灭，父子得闲安。`,bg:`乐府旧题。李白写幽州边地胡人的骑射生活与边塞战事，末句"何时天狼灭，父子得闲安"，是他对和平最朴素的期盼。`},
{t:'出自蓟北门行',body:`虏阵横北荒，胡星曜精芒。
羽书速惊电，烽火昼连光。
虎竹救边急，戎车森已行。
明主不安席，按剑心飞扬。
推毂出猛将，连旗登战场。
兵威冲绝幕，杀气凌穹苍。
列卒赤山下，开营紫塞傍。
孟冬风沙紧，旌旗飒凋伤。
画角悲海月，征衣卷天霜。
挥刃斩楼兰，弯弓射贤王。
单于一平荡，种落自奔亡。
收功报天子，行歌归咸阳。`,bg:`乐府旧题，写大军出蓟北门讨虏。羽书烽火、虎竹戎车，孟冬风沙里画角悲月、征衣卷霜，末以斩楼兰、射贤王、凯歌归咸阳作结。`},
{t:'北风行',body:`烛龙栖寒门，光曜犹旦开。
日月照之何不及此，惟有北风号怒天上来。
燕山雪花大如席，片片吹落轩辕台。
幽州思妇十二月，停歌罢笑双蛾摧。
倚门望行人，念君长城苦寒良可哀。
别时提剑救边去，遗此虎文金鞞靫。
中有一双白羽箭，蜘蛛结网生尘埃。
箭空在，人今战死不复回。
不忍见此物，焚之已成灰。
黄河捧土尚可塞，北风雨雪恨难裁。`,bg:`乐府旧题。"燕山雪花大如席"是李白最夸张也最著名的比喻之一；思妇焚箭成灰一节，把战争之痛写得入骨。`},
{t:'胡无人',body:`严风吹霜海草凋，筋干精坚胡马骄。
汉家战士三十万，将军兼领霍嫖姚。
流星白羽腰间插，剑花秋莲光出匣。
天兵照雪下玉关，虏箭如沙射金甲。
云龙风虎尽交回，太白入月敌可摧。
敌可摧，旄头灭，履胡之肠涉胡血。
悬胡青天上，埋胡紫塞傍。
胡无人，汉道昌。`,bg:`乐府旧题。李白写汉家天兵出玉关破敌，气势凛然。末句"胡无人，汉道昌"，是他边塞诗中最强硬的一笔。`},
{t:'塞上曲',body:`大汉无中策，匈奴犯渭桥。
五原秋草绿，胡马一何骄。
命将征西极，横行阴山侧。
燕支落汉家，妇女无华色。
转战渡黄河，休兵乐事多。
萧条清万里，瀚海寂无波。`,bg:`乐府旧题。李白写汉廷命将出征、横行阴山，收燕支山而罢兵，末以"瀚海寂无波"写太平景象。`},
{t:'空城雀',body:`嗷嗷空城雀，身计何戚促。
本与鹪鹩群，不随凤凰族。
提携四黄口，饮乳未尝足。
食君糠秕馀，尝恐乌鸢逐。
耻涉太行险，羞营覆车粟。
天命有定端，守分绝所欲。`,bg:`乐府旧题。李白以空城雀自喻：本与鹪鹩为群，不肯追随凤凰，宁可食糠秕、担惊受怕，也耻于行险侥幸。是他安贫守分的自白。`},
{t:'长歌行',body:`桃李得日开，荣华照当年。
东风动百物，草木尽欲言。
枯枝无丑叶，涸水吐清泉。
大力运天地，羲和无停鞭。
功名不早著，竹帛将何宣。
桃李务青春，谁能贳白日。
富贵与神仙，蹉跎成两失。
金石犹销铄，风霜无久质。
畏落日月后，强欢歌与酒。
秋霜不惜人，倏忽侵蒲柳。`,bg:`乐府旧题。李白叹时光飞逝、功名未立：富贵与神仙两皆蹉跎，金石犹可销铄，秋霜转眼侵上蒲柳之姿。`},
{t:'短歌行',body:`白日何短短，百年苦易满。
苍穹浩茫茫，万劫太极长。
麻姑垂两鬓，一半已成霜。
天公见玉女，大笑亿千场。
吾欲揽六龙，回车挂扶桑。
北斗酌美酒，劝龙各一觞。
富贵非所愿，与人驻颜光。`,bg:`乐府旧题。李白嫌白日太短，想挽住六龙之车挂在扶桑上，用北斗酌酒劝龙各饮一觞——为的不是自己富贵，而是为人间留住光阴。`},
{t:'秋夕旅怀',body:`凉风度秋海，吹我乡思飞。
连山去无际，流水何时归。
目极浮云色，心断明月晖。
芳草歇柔艳，白露催寒衣。
梦长银汉落，觉罢天星稀。
含悲想旧国，泣下谁能挥。`,bg:`李白秋夜旅次思乡。凉风把乡思吹向远方，连山无际，流水不归；梦长至银河西落，醒来星稀，含悲想故国而泪下。`},
{t:'春怨',body:`白马金羁辽海东，
罗帷绣被卧春风。
落月低轩窥烛尽，
飞花入户笑床空。`,bg:`李白代思妇立言：丈夫远在辽海，她独卧春风绣被之中。落月窥见烛尽，飞花入户笑她床空——无情之物偏作有情之态。`},
{t:'折杨柳',body:`垂杨拂绿水，摇艳东风年。
花明玉关雪，叶暖金窗烟。
美人结长想，对此心凄然。
攀条折春色，远寄龙庭前。`,bg:`乐府旧题。折柳赠别是唐人习俗，李白写闺中美人折下春色，要寄到遥远的龙庭（边塞）去给征人。`},
{t:'紫骝马',body:`紫骝行且嘶，双翻碧玉蹄。
临流不肯渡，似惜锦障泥。
白雪关山远，黄云海戍迷。
挥鞭万里去，安得念春闺。`,bg:`乐府旧题。李白写紫骝马临流不肯渡，似在顾惜锦障泥；而征人挥鞭万里而去，哪里还顾得上念春闺？`},
{t:'豫章行',body:`胡风吹代马，北拥鲁阳关。
吴兵照海雪，西讨何时还。
半渡上辽津，黄云惨无颜。
老母与子别，呼天野草间。
白马绕旌旗，悲鸣相追攀。
白杨秋月苦，早落豫章山。
本为休明人，斩虏素不闲。
岂惜战斗死，为君扫凶顽。
精感石没羽，岂云惮险艰。
楼船若鲸飞，波荡落星湾。
此曲不可奏，三军鬓成斑。`,bg:`乐府旧题。李白写吴兵西征、母子生离的惨状，"老母与子别，呼天野草间"十字，是唐诗中最令人心碎的征夫图景。`},
{t:'秋浦感主人归燕寄内',body:`霜凋楚关木，始知杀气严。
寥寥金天廓，婉婉绿红潜。
胡燕别主人，双双语前檐。
三飞四回顾，欲去复相瞻。
岂不恋华屋，终然谢珠帘。
我不及此鸟，远行岁已淹。
寄书道中叹，泪下不能缄。`,bg:`天宝十三载（754）李白在秋浦见胡燕辞主南归，想到自己久客不归，连燕子都不如。寄给妻子的信写到一半便泪下难封。`},
{t:'寄远 · 其一',body:`三鸟别王母，衔书来见过。
肠断若剪弦，其如愁思何。
遥知玉窗里，纤手弄云和。
奏曲有深意，青松交女萝。
写水山井中，同泉岂殊波。
秦心与楚恨，皎皎为谁多。`,bg:`《寄远》组诗之一，约作于李白漫游期间寄内之作。以青鸟传书起兴，想象妻子在窗下弹琴寄意，两地相思同如一井之水。`},
{t:'长相思',body:`长相思，在长安。
络纬秋啼金井阑，微霜凄凄簟色寒。
孤灯不明思欲绝，卷帷望月空长叹。
美人如花隔云端。
上有青冥之高天，下有渌水之波澜。
天长路远魂飞苦，梦魂不到关山难。
长相思，摧心肝。`,bg:`乐府旧题。李白写秋夜思念远在长安之人，孤灯、微霜、络纬、空月层层渲染，末句"长相思，摧心肝"，是相思诗的极致。`},
{t:'久别离',body:`别来几春未还家，玉窗五见樱桃花。
况有锦字书，开缄使人嗟。
至此肠断彼心绝。
云鬟绿鬓罢梳结，愁如回飙乱白雪。
去年寄书报阳台，今年寄书重相催。
东风兮东风，为我吹行云使西来。
待来竟不来，落花寂寂委青苔。`,bg:`乐府旧题。李白以思妇口吻写久别：樱桃花开了五度，书信催了一年又一年，人终不来，只有落花寂寂地落在青苔上。`}
];
})(window.App=window.App||{});
</script>
